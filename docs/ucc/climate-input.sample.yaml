# 世界气候声明（UCC 声明层的作者输入面）— 注释样例
# =====================================================================
# 放置位置：layers/climate/input/climate.yaml（世界或分支的 climate 层输入）
# 语义规范：docs/ucc/specification.md §5.1（声明层）
#
# 所有字段可选；键缺席 = 引擎默认值（temperate / 6.5 K/km）。引擎构建时
# 读取本文件，把声明抄进 maps/<planet>/climate_yearly.msgpack 的元数据——
# msgpack 是派生产品格式，永远不要手写或手改（input/derived 分离纪律）。
#
# 现行状态：太阳系参照天体与 earth 观测的声明由各自导入/导出器常量承担；
# 引擎世界的作者覆写通道（读本文件 → 写入导出）待首个非默认引擎世界出现
# 时铺设——语义以下面的字段说明为准，铺设前后声明内容不变。

version: 1

# ── 世界气候态（climate_state）──────────────────────────────────────
# 命名行星尺度的气候体制——cell 级分类栖身的整体背景。值域开放：新状态由
# 声明加入（在 specification §5.1 词汇表登记），不需要 bump profile 版本。
#
# 判定线索（从天文/大气层输入读；声明的依据写进 provenance）：
#   temperate          N2-H2O 大气、表面压力 ~0.5–10 bar、全球均温约
#                      −20…+30 °C（地球与现代类地引擎世界的默认态）
#   runaway_greenhouse 温室反馈失控：表面 ≳ 450 °C、压力 ≳ 10 bar、
#                      水汽不再冷凝（金星型；Wolf 2017 / Goldblatt 2015 谱系）
#   thin_co2_cold      CO2 主导、表面压力 ≲ 1 kPa、均温 ≲ −40 °C——
#                      Haberle 2001「液态水有利域」之外的薄冷大气（火星型）
#   methane_hydrology  ~90–95 K、CH4-N2 循环主导的水文（土卫六型；
#                      Schneider 2012 收支词汇）
#   airless            无大气或可忽略（≲ Pa 量级）——月球/水星型；
#                      此态下不声明递减率（见下）
climate_state: temperate

# ── 环境递减率（lapse_rate_c_per_km）────────────────────────────────
# -H 高地修饰语的判据输入：把 cell 温度折算回海平面用的每公里降温数。
# 取环境值（观测/模式拟合的湿大气有效递减率），不是干绝热 g/Cp——
# 海平面还原要的是「实际大气怎么降温」，不是「绝热气泡会怎么降温」。
#
# 现行声明值参考：
#   earth 观测   6.5   ICAO 标准大气（观测拟合）
#   金星         8.0   VIRA 深层近绝热（Seiff 1985；Zasova 2006）
#   火星         2.5   尘辐射软化后的环境值（干绝热 4.5 = g/Cp）
#   土卫六       1.38  Lindal 1983 掩星；Huygens HASI（Fulchignoni 2005）
#   引擎默认     6.5   类地湿 N2-O2 大气类比（标定域声明）
#
# 无大气天体（climate_state: airless）：删除本键——不存在环境递减率，
# -H 修饰语整体不适用。
lapse_rate_c_per_km: 6.5

# ── 声明依据（可选，推荐）───────────────────────────────────────────
# 人类可读的「为什么声明这个值」；引擎会把它抄进导出文件的 provenance。
# 上面的判定线索应该浓缩成一两句写在这里——未来读者（包括你自己）靠它
# 判断这行声明是推导、拟合还是规定。
declaration_notes: >
  类地 N2-O2 湿大气；递减率沿用 ICAO 观测值。若本世界的重力/大气成分
  显著偏离地球（g 或 Cp 差 >30%），改用该大气的主导环境递减率并在此
  说明来源。
