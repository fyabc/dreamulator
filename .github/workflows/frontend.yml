# Frontend PR gate (audit M0 / CI-01, 2026-09-17): type-check, vitest, lint,
# build — previously type-check + build only ran on main inside
# deploy-pages.yml, so frontend breakage could merge unseen.
#
# Node 20 matches deploy-pages.yml (keep the two in sync when bumping).

name: frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Unit tests (vitest)
        run: npx vitest run

      - name: Lint
        run: npm run lint

      - name: Build (API mode)
        run: npm run build
