# Test & lint gate (roadmap 功能性 #3).
#
# - pytest:        hard gate — full suite with all extras (mirrors local dev env).
# - ruff check:    hard gate at pyproject's FULL select (Sprint B, 2026-08 —
#   all 266 legacy items cleared or consciously exempted via per-file-ignores).
# - ruff format:   hard gate — formatting debt cleared 2026-08 (Sprint A);
#   keeps it at zero.
# - mypy:          report-only for now — strict mode has ~150 items of annotation
#   debt (roadmap 工程卫生 #2).  Flip continue-on-error off once cleared.
#
# No LFS checkout needed: the only data/worlds file the tests read is
# geography.yaml (plain YAML; mesh-heavy tests build small meshes in code).

name: tests

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run test suite
        run: uv run pytest tests/ -q -p no:warnings

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff (full lint gate)
        run: uv run ruff check src/ tests/

      - name: Ruff format (hard gate)
        run: uv run ruff format --check src/ tests/

  mypy:
    runs-on: ubuntu-latest
    continue-on-error: true  # annotation debt — see roadmap 工程卫生 #2
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: mypy (report)
        run: uv run mypy src/
