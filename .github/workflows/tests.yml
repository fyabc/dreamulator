# Test & lint gate (roadmap 功能性 #3).
#
# Job layering (audit M0 / TEST-01, 2026-09-17):
# - test:     fast suite — tests/ with default markers (slow/benchmark off).
# - conlang:  independent package tests — packages/conlang/tests (its own
#   pytest run; the root pyproject's testpaths only covers tests/).
# - lint/mypy: static gates on src/ + tests/.
# Out of the PR path by design: slow/validation tests (real-data imports,
# `uv sync --extra validation` + `-m slow`), benchmarks (benchmarks.yml),
# frontend checks (frontend.yml), docs checks (docs.yml).
#
# - pytest:        hard gate — full suite with all extras (mirrors local dev env).
# - ruff check:    hard gate at pyproject's FULL select (Sprint B, 2026-08 —
#   all 266 legacy items cleared or consciously exempted via per-file-ignores).
# - ruff format:   hard gate — formatting debt cleared 2026-08 (Sprint A);
#   keeps it at zero.
# - mypy:          hard gate — strict mode, cleared 2026-08 (Sprint C).
#
# No LFS checkout needed: the only data/worlds file the tests read is
# geography.yaml (plain YAML; mesh-heavy tests build small meshes in code).

name: tests

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "packages/**"
      - "schemas/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "packages/**"
      - "schemas/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Numba writes its @njit(cache=True) files here; caching them across runs
      # removes the cold JIT compile that dominates the first heavy test.
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba-cache
    steps:
      - uses: actions/checkout@v4

      # Pin the interpreter: pygplates (validation extra) ships wheels only up
      # to cp313. The runner's default python3 is newer and would fall back to
      # a source build that needs OpenGL dev headers we don't install.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      # Numba validates each cache entry against the kernel source, so a hit
      # from an older commit is safe; key only on the interpreter and lock.
      - name: Restore numba cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.numba-cache
          key: numba-${{ runner.os }}-py312-${{ hashFiles('uv.lock') }}
          restore-keys: numba-${{ runner.os }}-py312-

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run test suite
        # -n 4: the runner has 4 vCPUs; pyproject's -n auto (capped at 8)
        # oversubscribes them. CLI -n overrides the addopts value.
        run: uv run pytest tests/ -q -p no:warnings -n 4 --durations=20

  conlang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin the interpreter: pygplates (validation extra) ships wheels only up
      # to cp313. The runner's default python3 is newer and would fall back to
      # a source build that needs OpenGL dev headers we don't install.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run conlang package tests
        run: uv run pytest packages/conlang/tests -q -p no:warnings

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin the interpreter: pygplates (validation extra) ships wheels only up
      # to cp313. The runner's default python3 is newer and would fall back to
      # a source build that needs OpenGL dev headers we don't install.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff (full lint gate)
        run: uv run ruff check src/ tests/

      - name: Ruff format (hard gate)
        run: uv run ruff format --check src/ tests/

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin the interpreter: pygplates (validation extra) ships wheels only up
      # to cp313. The runner's default python3 is newer and would fall back to
      # a source build that needs OpenGL dev headers we don't install.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: mypy (strict gate)
        run: uv run mypy src/
