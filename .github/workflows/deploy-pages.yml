name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Only redeploy when site-relevant files change; docs-only commits skip
    # the deploy entirely. Manual runs remain available via workflow_dispatch.
    paths:
      - 'frontend/**'
      - 'scripts/export_static.py'
      - 'data/**'
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Build output (maps + derived) is NOT in git — it is published as a
        # GitHub Release tarball by scripts/publish_world_data.py and downloaded
        # below. This keeps the repo free of large generated files (no LFS).

      - name: Download world build data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/worlds
          gh release download worlds-data --pattern 'worlds-data.tar.gz' \
            --dir /tmp/worlds-data --clobber
          tar xzf /tmp/worlds-data/worlds-data.tar.gz -C data/worlds

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --all-extras

      # The engine build is deliberately NOT run here: maps are slow to generate
      # (minutes per world). They are rebuilt locally and published via
      # `uv run python scripts/publish_world_data.py`; this deploy just consumes
      # the published tarball. Publish BEFORE pushing input changes that affect
      # the data, so the deploy picks up the matching build output.

      - name: Export static data
        run: uv run python scripts/export_static.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build static site
        working-directory: frontend
        run: npx vite build --mode static

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
