name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Only redeploy when site-relevant files change; docs-only commits skip
    # the deploy entirely. Manual runs remain available via workflow_dispatch.
    paths:
      - 'frontend/**'
      - 'scripts/export_static.py'
      - 'data/**'
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --all-extras

      # Engine builds are intentionally NOT run here: derived data is committed
      # to the repo (git-tracked since v0.10.0), and the static export consumes
      # it as-is. This saves minutes per world on every deploy. To rebuild
      # derived data, run `uv run dreamulator build <world>` locally
      # (add `--branch <b>` for branches) and commit the results.

      - name: Export static data
        run: uv run python scripts/export_static.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build static site
        working-directory: frontend
        run: npx vite build --mode static

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
