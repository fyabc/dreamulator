# Nacrea 文明种子 —— 文明层种子的单一信源
#
# 由 seed_discovery 候选区（layers/civilization/derived/civilization_seed_candidates.yaml）
# + geography.yaml 命名地貌锚定。字段与 Phase 3C schema 对齐（docs/design/civilization-layer.md §4）。
#
# ── 天文分区 ───────────────────────────────────────────────
# 潮汐锁定使 Aegis 在天空的位置由经度固定，向星点(0°)/背星点(180°)是深海（潮汐隆起
# 加深），陆块在侧点：世界岛=后随点(90°W)=边缘区、前导点山系(90°E)=边缘区、
# 第二大陆(133°E)=背星区、49°E 雨林=向星区。
#
# ── 背星区 = 长夜 ────────────────────────────────────────────
# 背星区看不到 Aegis 巨行星，但并非完全黑暗：昼夜仍是正常昼夜、仅拉长 3.25×，即「长夜」。
# 外卫星（Cadence/Vigil）与内侧行星（Ember）满相时达金星至满月亮度。
# 背星区的驱动力是「长夜 + 无 Aegis 固定天顶参照 + 星空极洁净」，不是「全暗」。
#
# ── 锚定原则 ────────────────────────────────────────────────
# 锚定于地理特征（命名地貌/海岸/裂谷），而非 cell 坐标或数值。河流锚点为示意，待 3B 落地后精校。

civilizations:
  # ================================================================
  # 现有 3 文明（经 #9 拷问修正）
  # ================================================================
  - id: "civ_rift_sea"
    name: "裂谷海文明"
    anchor:
      description: "世界岛中部大裂谷海中段最窄处两岸（-90°W，0–15°N）"
      cell_hint: "cradle_01"
    tags: [inland_origin, tidal_agriculture, maritime_trade, twilight_zone, tidal_calendar]
    era_seeds:
      - { era: "classical", theme: "内陆 Cfb/Bsk 农耕起源 → 沿海城邦 → 裂谷海两岸对峙 + 44m 潮汐海军" }
      - { era: "industrial", theme: "潮汐能工业化 + 裂谷海航运垄断" }
    narrative:
      origin:
        human: "文明起源自裂谷海东西内陆的温带农耕区，后向沿海发展"
        gaia: "裂谷海沿岸 Af/Aw 驯化潜力低（三高率 3–10%）；深入内陆 Cfb/Bsk 才有三高地块（37%）→ 起源内陆，后发展到沿海出现两岸对峙"
      agriculture:
        human: "内陆谷物带 + 沿岸冲积平原潮汐灌溉"
        gaia: "内陆 Cfb/Bsk 全年型农耕；沿岸作物按 78h 潮汐时刻表播种，每 39h 海水倒灌河口潮汐灌溉"
      religion:
        human: "东岸崇拜高悬的巨眼；西岸不见巨眼、另奉星月"
        gaia: "Aegis 视高度随经度骤降：东岸(lon-84°) +6°、西岸(lon-99°) -9°（不可见）→ 两岸宇宙观分裂为「巨眼信仰」vs「隐眼/星月信仰」"
      war:
        human: "两岸王国争夺裂谷海控制权"
        gaia: "44m 潮汐 → 海军只能在特定潮位出港，海战时间窗由 Aegis 相位决定"

  - id: "civ_river_valley"
    name: "大河文明"
    anchor:
      description: "世界岛东侧湿润河谷/沿海平原（农业腹地，边缘区）"
      cell_hint: "cradle_01"
    tags: [river_valley_origin, agricultural_empire, twilight_zone, light_pollution]
    era_seeds:
      - { era: "classical", theme: "河谷农耕帝国 + 灌溉渠网" }
      - { era: "industrial", theme: "内陆农业机械化 + 与裂谷海文明的长途陆贸" }
    narrative:
      agriculture:
        human: "大河沿岸的谷物带，内陆农耕帝国"
        gaia: "9° 弱季节 → 无「夏收」节律；农业是低纬全年型 / 中纬温和型"
      science:
        human: "天空常被巨行星光辉遮蔽，仅见明亮天体"
        gaia: "Aegis 高度 30°（lon-70°）→ 光污染严重，只能看到明亮天体，天文观测受限（天文能力让位于长夜文明）"

  - id: "civ_long_night"
    name: "长夜文明"
    anchor:
      description: "第二大陆沿岸（133°E，背星区——长夜，Aegis 恒在地平线下）"
      cell_hint: "cradle_02"
    tags: [long_night_adaptation, astronomy_navigation, anti_jovian_side, clean_sky_astronomy]
    era_seeds:
      - { era: "classical", theme: "天文学导航 + 精密机械（长夜缺固定参照倒逼）" }
      - { era: "space_age", theme: "「先知之眼」——背星区最洁净光学/射电环境，深空天文观测中心" }
    narrative:
      navigation:
        human: "以星辰导航，发展天文学"
        gaia: "长夜无 Aegis 光污染、星空极洁净 + 外卫星/行星满相达金星至满月亮度 → 类地球的天文导航（非声呐）"
      science:
        human: "观测天空发现行星运动"
        gaia: "肉眼可见 30+ 捕获卫星轨道 → 开普勒定律在无望远镜时代即可归纳（天文能力从大河文明移至此，因后者光污染）"
      religion:
        human: "无日食、无中心天体的宇宙观"
        gaia: "长期固守恒星天球模型；对向星区「吞日神话」斥为异端 → 千年宗教战争"

  # ================================================================
  # 补充的 6 新文明（基于各层事实数据，简化设计）
  # ================================================================
  - id: "civ_archipelago_west"
    name: "西屿城邦"
    anchor:
      description: "北方大陆西南角 Cfb 区 + 西南热带大岛群（-137°E，40°N）"
    tags: [maritime_city_states, temperate_coast, island_trade]
    era_seeds:
      - { era: "classical", theme: "群岛海上贸易网络 + 温带沿岸城邦" }
    narrative:
      trade:
        human: "群岛间的海上贸易城邦"
        gaia: "Cfb 温带海岸 + 热带岛群（三高率 17%）→ 海洋贸易为主、农耕为辅的城邦串"

  - id: "civ_north_coast"
    name: "北岸海民"
    anchor:
      description: "北方大陆东南海岸（-65°E 至 24°E，36°N）"
    tags: [coastal_fishing, cold_adaptation, subarctic]
    era_seeds:
      - { era: "classical", theme: "寒带海岸渔猎 + 海兽皮船" }
    narrative:
      subsistence:
        human: "沿岸渔猎、采集的海民"
        gaia: "ET 苔原海岸（三高率 16–20%）→ 农业不产粮，渔猎/采集为主（法罗/因纽特型）"

  - id: "civ_east_monsoon"
    name: "东岸季风"
    anchor:
      description: "第三大陆北半球东岸（36°E 至 71°E，22–25°N）"
    tags: [monsoon_agriculture, river_valley]
    era_seeds:
      - { era: "classical", theme: "季风河谷农耕" }
    narrative:
      agriculture:
        human: "季风驱动的河谷稻作/谷物带"
        gaia: "Cfb/Csb + Af/Aw 混合（三高率 25–27%）→ 干湿季农业节律（非温度季）"

  - id: "civ_second_continent_empire"
    name: "第二大陆农耕帝国"
    anchor:
      description: "第二大陆西北（94°E，28°N）"
    tags: [agricultural_empire, continental, high_domestication]
    era_seeds:
      - { era: "classical", theme: "大陆谷物帝国" }
    narrative:
      agriculture:
        human: "温带草原/灌丛的谷物帝国"
        gaia: "Cfb/BSk/Csb（三高率 44%，全系统最高）→ 驯化潜力最富的农业腹地"

  - id: "civ_southwest_rainforest"
    name: "西南雨林"
    anchor:
      description: "第二大陆西南热带（74°E 至 100°E，13°N 至 -2°N）"
    tags: [rainforest, river_network, low_domestication]
    era_seeds:
      - { era: "classical", theme: "密林河畔的薯类园艺" }
    narrative:
      subsistence:
        human: "密林河畔的薯类园艺、渔猎"
        gaia: "Af/Am/Aw 雨林（三高率 0%）→ 无大型草食动物/主食谷物/役畜，走薯类园艺 + 渔猎（刚果/亚马逊型）"

  - id: "civ_southern_continent"
    name: "南方大陆"
    anchor:
      description: "半独立南方大陆（128°E，-23°N）"
    tags: [isolated_continent, temperate_agriculture]
    era_seeds:
      - { era: "classical", theme: "半独立大陆的温带农耕" }
    narrative:
      agriculture:
        human: "半独立大陆的温带农耕区"
        gaia: "Cfb/BSk/Csb（三高率 38%）→ 低海拔温带农耕（澳洲类比），地理半隔离"
