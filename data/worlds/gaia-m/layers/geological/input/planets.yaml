# Nacrea 恒星系 — 行星物理参数
# 含 6 颗行星 + 3 颗卫星（Nacrea 珠母星 + 共振卫星 Cadence/Vigil）
planets:
  # ================================================================
  # 宜居卫星：Nacrea（珠母星） — 环绕巨神星 Aegis
  # ================================================================
  - id: satellite_gaiam
    name: "珠母星 · Nacrea"
    orbits: planet_aegis
    planet_type: ocean_world
    mass: 1.20                    # M⊕
    radius: 1.07                  # R⊕ (6817 km)
    rotation_period_days: 3.25    # = 公转周期（被 Aegis 潮汐锁定）
    axial_tilt_deg: 9.0           # 相对黄道面的有效倾角 = 轨道倾角 9°（自转轴 ⊥ 绕 Aegis 轨道面）
    albedo: 0.30
    atmosphere:
      surface_pressure_atm: 1.0
      composition:
        N2: 0.78
        O2: 0.21
        Ar: 0.01
      greenhouse_factor: 62.0     # 方案2 + 高纬暖化微调（+2.5K）：恢复中高纬沿海宜居气候（C），60°S 亚南极岛、52°N 北方内海南岸回暖；隐含厚 CO₂ 大气
    hydrosphere:
      water_coverage: 0.72
      salinity_ppt: 35.0
      ocean_depth_km: 4.0         # 平均深度 4000 m
    lithosphere:
      has_plate_tectonics: true
      # num_plates 为派生量（板块生成输出），不在 input 手写；实际值见 plates.json
      volcanic_activity: 3.0      # 地球的 3 倍（潮汐驱动）
    magnetic_field_strength: 30.0 # 潮汐加热维持熔融地核 → 发电机效应

  # ================================================================
  # 共振卫星：Cadence — 2:1 with Nacrea（拉普拉斯链内环）
  # ================================================================
  - id: satellite_cadence
    name: "韵珠星 · Cadence"
    orbits: planet_aegis
    planet_type: terrestrial
    mass: 0.05                    # M⊕
    radius: 0.45                  # R⊕ (2840 km)，ρ≈3.1 g/cm³ 岩质
    rotation_period_days: 6.50    # 同步自转 = 公转周期
    axial_tilt_deg: 0.0           # 自转轴 ⊥ 轨道面
    albedo: 0.25

  # ================================================================
  # 共振卫星：Vigil — 4:1 with Nacrea（拉普拉斯链外环）
  # ================================================================
  - id: satellite_vigil
    name: "守珠星 · Vigil"
    orbits: planet_aegis
    planet_type: terrestrial
    mass: 0.03                    # M⊕
    radius: 0.39                  # R⊕ (2470 km)，ρ≈2.8 g/cm³ 冰岩混合
    rotation_period_days: 13.0    # 同步自转 = 公转周期
    axial_tilt_deg: 0.0           # 自转轴 ⊥ 轨道面
    albedo: 0.35                  # 富冰表面

  # ================================================================
  # Crucible（鼎星）捕获卫星 — 小卫星（火卫一类比）
  # ================================================================
  - id: satellite_cinder
    name: "焦砾星 · Cinder"        # 鼎卫一
    orbits: planet_crucible
    planet_type: terrestrial
    mass: 1.8e-9                   # M⊕（火卫一类比）
    radius: 0.00175                 # R⊕ (~11 km)
    rotation_period_days: 0.27     # 同步自转 = 公转周期（~6.5 h）
    axial_tilt_deg: 0.0
    albedo: 0.071                   # 暗色捕获岩体

  # ================================================================
  # Boreal（沧星）卫星链 — 3 颗冰质规则卫星
  # ================================================================
  - id: satellite_frostine
    name: "凝冰星 · Frostine"      # 沧卫一
    orbits: planet_boreal
    planet_type: terrestrial
    mass: 0.008                    # M⊕
    radius: 0.2440                  # R⊕ (1550 km)，ρ≈1.9 g/cm³ 冰质
    rotation_period_days: 1.95     # 同步自转 = 公转周期
    axial_tilt_deg: 0.0
    albedo: 0.67                   # 富冰表面，冰下海洋（欧罗巴类比）

  - id: satellite_umbra
    name: "玄冰星 · Umbra"         # 沧卫二
    orbits: planet_boreal
    planet_type: terrestrial
    mass: 0.018                    # M⊕
    radius: 0.3767                  # R⊕ (2400 km)，ρ≈1.8 g/cm³ 冰岩混合
    rotation_period_days: 3.90     # 同步自转 = 公转周期
    axial_tilt_deg: 0.0
    albedo: 0.43                   # 最大者，冰下海洋 + 微弱磁场（木卫三类比）

  - id: satellite_sleet
    name: "霜冰星 · Sleet"         # 沧卫三
    orbits: planet_boreal
    planet_type: terrestrial
    mass: 0.002                    # M⊕
    radius: 0.1491                  # R⊕ (950 km)，ρ≈1.5 g/cm³ 冰质
    rotation_period_days: 7.90     # 同步自转 = 公转周期
    axial_tilt_deg: 0.0
    albedo: 0.22                   # 密布陨石坑（木卫四类比）

  # ================================================================
  # Glacis（霰星）卫星 — 规则内卫星 + 逆行捕获外卫星
  # ================================================================
  - id: satellite_shard
    name: "玄石星 · Shard"         # 霰卫一
    orbits: planet_glacis
    planet_type: terrestrial
    mass: 0.001                    # M⊕
    radius: 0.1178                  # R⊕ (750 km)，ρ≈1.2 g/cm³ 冰岩
    rotation_period_days: 3.42     # 同步自转 = 公转周期
    axial_tilt_deg: 0.0
    albedo: 0.32

  - id: satellite_rogue
    name: "逆石星 · Rogue"         # 霰卫二
    orbits: planet_glacis
    planet_type: terrestrial
    mass: 0.0002                   # M⊕
    radius: 0.0589                  # R⊕ (375 km)
    rotation_period_days: 17.8     # 同步自转 = 公转周期（逆行，轨道扁）
    axial_tilt_deg: 0.0
    albedo: 0.19

  # ================================================================
  # Sentinel（藩星）不规则捕获群 — 散射遗孤，无规则卫星
  # ================================================================
  - id: satellite_vagrant
    name: "近客星 · Vagrant"       # 藩卫一
    orbits: planet_sentinel
    planet_type: terrestrial
    mass: 0.001                    # M⊕
    radius: 0.0994                   # R⊕ (~640 km)，冰岩混合
    rotation_period_days: 0.42     # 不规则，非同步自转
    axial_tilt_deg: 26.0
    albedo: 0.23

  - id: satellite_guest
    name: "远客星 · Guest"         # 藩卫二
    orbits: planet_sentinel
    planet_type: terrestrial
    mass: 0.0003                   # M⊕
    radius: 0.0117                  # R⊕ (~76 km)
    rotation_period_days: 0.31     # 不规则，非同步自转（逆行）
    axial_tilt_deg: 44.0
    albedo: 0.17

  # ================================================================
  # 行星 I：焦星 Ember — 被剥夺地幔的铁核残骸
  # ================================================================
  - id: planet_ember
    name: "焦星 · Ember"
    orbits: star_ignis
    planet_type: terrestrial
    mass: 0.35                    # M⊕
    radius: 0.63                  # R⊕ — ρ=7.8 g/cm³（参照水星 5.4 + 重力压缩）
    rotation_period_days: 5.37    # 潮汐锁定于恒星
    axial_tilt_deg: 0.0
    albedo: 0.10                  # 裸露金属表面
    magnetic_field_strength: 5.0  # 残余铁核微弱磁场 (μT)
    satellite_ids: []             # 无卫星（恒星潮汐剥离，水星类比）

  # ================================================================
  # 行星 II：鼎星 Crucible — 温室炼狱中的次生岩石世界
  # ================================================================
  - id: planet_crucible
    name: "鼎星 · Crucible"
    orbits: star_ignis
    planet_type: terrestrial
    mass: 0.90                    # M⊕
    radius: 0.97                  # R⊕
    rotation_period_days: 16.6    # 潮汐锁定于恒星
    axial_tilt_deg: 0.0
    albedo: 0.15                  # 暗色玄武岩表面
    atmosphere:
      surface_pressure_atm: 90.0
      composition:
        CO2: 0.90
        SO2: 0.05
        N2: 0.05
      greenhouse_factor: 248.0    # T_eq 372 K → 实际表面 ~620 K
    volcanic_activity: 5.0        # 极高火山活动
    satellite_ids:
      - satellite_cinder           # 捕获小卫星（火卫一类比）

  # ================================================================
  # 行星 III：神盾 Aegis — 宜居带气态巨行星
  # ================================================================
  - id: planet_aegis
    name: "巨神星 · Aegis"
    orbits: star_ignis
    planet_type: gas_giant
    mass: 508.5                   # 1.6 M_J × 317.83 M⊕/M_J
    radius: 11.2                  # ~1.0 R_J (Fortney et al. 2007, 1.6 M_J 冷气态巨行星)
    rotation_period_days: 0.4167  # ~10 hours
    axial_tilt_deg: 3.0
    albedo: 0.343                 # Jupiter-like Bond albedo
    atmosphere:
      surface_pressure_atm: 1000.0
      composition:
        H2: 0.86
        He: 0.135
        CH4: 0.003
        NH3: 0.002
      greenhouse_factor: 0.0
    magnetic_field_strength: 400.0  # ~8× Jupiter (质量更大 + 快速自转)
    satellite_ids:
      - satellite_gaiam
      - satellite_cadence
      - satellite_vigil

  # ================================================================
  # 行星 IV：沧星 Boreal — 共振链次级气态巨行星 (2:1)
  # ================================================================
  - id: planet_boreal
    name: "沧星 · Boreal"
    orbits: star_ignis
    planet_type: gas_giant
    mass: 159.3                   # 0.5 M_J (M⊕)
    radius: 9.5                   # R⊕ (~0.85 R_J)
    rotation_period_days: 0.50    # ~12 hours
    axial_tilt_deg: 2.0
    albedo: 0.30
    atmosphere:
      surface_pressure_atm: 500.0
      composition:
        H2: 0.84
        He: 0.14
        H2O: 0.01
        NH3: 0.01
      greenhouse_factor: 0.0
    satellite_ids:
      - satellite_frostine
      - satellite_umbra
      - satellite_sleet

  # ================================================================
  # 行星 V：霰星 Glacis — 共振链末端冰巨星 (4:1)
  # ================================================================
  - id: planet_glacis
    name: "霰星 · Glacis"
    orbits: star_ignis
    planet_type: ice_giant
    mass: 17.1                    # M⊕ (~0.054 M_J，海王星级)
    radius: 3.88                  # R⊕
    rotation_period_days: 0.72    # ~17 hours
    axial_tilt_deg: 5.0
    albedo: 0.25
    atmosphere:
      surface_pressure_atm: 100.0
      composition:
        H2: 0.80
        He: 0.15
        CH4: 0.05
      greenhouse_factor: 0.0
    satellite_ids:
      - satellite_shard
      - satellite_rogue

  # ================================================================
  # 行星 VI：藩星 Sentinel — 迁移弹射遗孤
  # ================================================================
  - id: planet_sentinel
    name: "藩星 · Sentinel"
    orbits: star_ignis
    planet_type: ice_giant
    mass: 8.5                     # M⊕
    radius: 2.4                   # R⊕
    rotation_period_days: 0.625   # ~15 hours
    axial_tilt_deg: 15.0
    albedo: 0.20                  # 冰质表面
    satellite_ids:
      - satellite_vagrant
      - satellite_guest
