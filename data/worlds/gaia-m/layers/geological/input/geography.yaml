# Gaia-M 海陆分布锚定规格（机器可读）
#
# 与 geography.md（2026-08 修改后的不对称混合案）一一对应。地形管线的
# plate 阶段读取本文件，把每个 feature 叠加成逐 cell 的"陆地偏置场"
# ([-1,+1]：正=陆地、负=海洋)，再以全局阈值替代默认的"每板块随机大陆比例"，
# 让命名大陆/大洋真正落到指定位置。构造演化后按 reapply_after_tectonics
# 重新锚定，防止大陆随板块漂移离开锚点。
#
# 字段语义（见 src/dreamulator/map/geography.py）：
#   kind          语义标签（continent/archipelago/plateau/ocean_basin/
#                 rift_sea/shallow_sea/isthmus）
#   lon/lat       锚点中心（度）。极点特征 lon 任意
#   radius_deg    圆半径；拉长特征 = 半短轴（半宽）
#   strength      +1 强陆地 … −1 强海洋
#   elongation    半长轴/半短轴（≥1，1=圆）
#   bearing_deg   半长轴朝向（0=北，90=东）
#
# 角度→距离换算（R=6817 km，1°≈119 km）：
#   世界岛 0.9×10^8 km² ≈ 表面积 15%；大裂谷海 600 km 宽×8000 km 长。
# 注：以下数值为首轮初值，需在重建后按地貌对照 geography.md 迭代微调。
# 已知局限：shallow_sea 的"浅"（水深<200 m）暂无法由二值地壳表达，
# 需后续海底高程控制；本轮仅保证海陆格局正确。

version: 1
land_fraction_target: 0.28      # 与 terrain_config.target_land_fraction 对齐
hemisphere_land_bias: 0.10      # 北半球偏陆（设定：北半球占 62% 陆地）
reapply_after_tectonics: true   # 构造演化后重锚定，保住正典大陆

features:
  # ---- 陆块（侧点 + 极点）----
  - name: 世界岛
    kind: continent
    lon: -90.0                  # 后随点 ~90°W
    lat: 0.0
    radius_deg: 35.0            # 半短轴；拉长后面积约 15% 表面积
    strength: 0.85              # <裂谷强度，保证裂谷能切开（见大裂谷海）
    elongation: 1.6
    bearing_deg: 0.0            # 南北向拉长（首轮初值，待调）

  # ---- 大裂谷海：多段错列（en échelon）裂谷，仿东非大裂谷/红海 ----
  # 不用单一拉长偏置场（会产出笔直经向裂谷）；改用多段沿蜿蜒路径错列排布，
  # 走向左右摆动、宽窄不一，并叠加断块隆起（正场）与异常塌陷（更强负场）。
  # 2026-08-06 v2：用户验证后整体 ×1.7 放大并加强（首版裂谷太弱，碎成湖泊串
  # 而非陆间海）；各段仍拉开幅度，并有东非式分叉（西支）。
  - name: 大裂谷海·南段
    kind: rift_sea
    lon: -92.0
    lat: -25.0
    radius_deg: 5.4             # 宽深海段（红海型）
    strength: -2.6              # 须超过世界岛(+0.85)才能切穿
    elongation: 3.0
    bearing_deg: 25.0           # 段轴向左右摆动 → 蜿蜒走向
  - name: 大裂谷海·中南段
    kind: rift_sea
    lon: -88.0
    lat: -14.0
    radius_deg: 3.1             # 窄弱段（半裂谷/夭折裂谷）
    strength: -2.0
    elongation: 5.0
    bearing_deg: -30.0
  - name: 大裂谷海·中段
    kind: rift_sea
    lon: -91.5
    lat: -3.0
    radius_deg: 4.4
    strength: -3.0              # 强切穿段
    elongation: 3.5
    bearing_deg: 40.0
  - name: 大裂谷海·中北段
    kind: rift_sea
    lon: -87.0
    lat: 8.0
    radius_deg: 2.6             # 最窄段
    strength: -1.8              # 最弱段
    elongation: 4.5
    bearing_deg: -15.0
  - name: 大裂谷海·北段
    kind: rift_sea
    lon: -90.5
    lat: 19.0
    radius_deg: 4.9
    strength: -2.4
    elongation: 2.6
    bearing_deg: 30.0
  # 西支分叉（仿东非大裂谷 Western Rift：从中段向 WNW 分出）
  - name: 大裂谷海·西支南段
    kind: rift_sea
    lon: -97.5
    lat: -1.0
    radius_deg: 3.0
    strength: -2.2
    elongation: 3.0
    bearing_deg: -70.0
  - name: 大裂谷海·西支北段
    kind: rift_sea
    lon: -103.0
    lat: 3.0
    radius_deg: 2.4
    strength: -1.8
    elongation: 2.8
    bearing_deg: -75.0
  # 断块隆起（正场小丘，裂谷肩抬升 / 未裂透的断块）
  - name: 裂谷肩断块隆起·南
    kind: plateau
    lon: -85.5
    lat: -9.0
    radius_deg: 2.7
    strength: 0.9               # 弱正场 → 裂谷边缘断块隆起
    elongation: 2.4
    bearing_deg: -25.0
  - name: 裂谷肩断块隆起·北
    kind: plateau
    lon: -93.5
    lat: 12.0
    radius_deg: 1.7
    strength: 0.5
    elongation: 1.8
    bearing_deg: 20.0
  # 异常塌陷（更强负场，裂谷内局部深陷 / 拉分盆地）
  - name: 裂谷塌陷盆地·中
    kind: rift_sea
    lon: -89.5
    lat: 2.0
    radius_deg: 3.1
    strength: -3.0              # 比裂谷主体更深 → 局部深陷（模型下限 −3）
    elongation: 2.5
    bearing_deg: 15.0
  - name: 裂谷塌陷盆地·北
    kind: rift_sea
    lon: -89.0
    lat: 14.0
    radius_deg: 1.7
    strength: -2.4
    elongation: 2.0
    bearing_deg: -18.0

  - name: 破碎群岛带
    kind: archipelago
    lon: 90.0                   # 前导点 ~90°E
    lat: 0.0
    radius_deg: 25.0
    strength: 0.20              # 弱正场 → cell 落在阈值附近，噪声碎成群岛
    elongation: 1.0
    bearing_deg: 0.0

  - name: 北极孤立大陆
    kind: plateau
    lon: 0.0                    # 极点，lon 任意
    lat: 90.0
    radius_deg: 18.0
    strength: 1.0
    elongation: 1.0

  - name: 北纬45度地峡
    kind: isthmus
    lon: -90.0                  # 连接世界岛与北极大陆
    lat: 55.0
    radius_deg: 1.5             # 半宽 ~180 km（总宽 ~300 km 量级）
    strength: 0.7
    elongation: 15.0            # 南北向陆桥
    bearing_deg: 0.0
    elevation_target_m: 120.0   # 钉扎：陆桥顶 ≤120 m（低矮到未来海侵可淹没）
    pin_strength: 1.0

  # ---- 大洋（向星 / 背星点 + 南极浅海）----
  - name: Aegis深渊洋
    kind: ocean_basin
    lon: 0.0                    # 向星点
    lat: 0.0
    radius_deg: 45.0
    strength: -1.0              # 最深海洋
    elongation: 1.0

  - name: 虚空洋
    kind: ocean_basin
    lon: 180.0                  # 背星点
    lat: 0.0
    radius_deg: 40.0
    strength: -0.8
    elongation: 1.0

  - name: 南极浅海
    kind: shallow_sea
    lon: 0.0                    # 极点，lon 任意
    lat: -90.0
    radius_deg: 20.0
    strength: -0.8              # 强负偏置：触发基准服从，抑制泄漏陆块（打破南北对称）
    elongation: 1.0
    elevation_target_m: -120.0  # 钉扎：120 m 水深陆缘浅海（冰期海退敏感带）
    pin_strength: 1.0

  # ---- 南大洋（geography.md：南半球中纬度为洋；四环近似纬向洋带，
  #   否则 fBm 在此自发出陆，形成设计外大陆，边界横穿成"露出洋中脊"假象）----
  - name: 南大洋·0
    kind: ocean_basin
    lon: 0.0
    lat: -40.0
    radius_deg: 28.0
    strength: -0.8
  - name: 南大洋·90
    kind: ocean_basin
    lon: 90.0
    lat: -40.0
    radius_deg: 28.0
    strength: -0.8
  - name: 南大洋·180
    kind: ocean_basin
    lon: 180.0
    lat: -40.0
    radius_deg: 28.0
    strength: -0.8
  - name: 南大洋·-90
    kind: ocean_basin
    lon: -90.0
    lat: -40.0
    radius_deg: 28.0
    strength: -0.8
