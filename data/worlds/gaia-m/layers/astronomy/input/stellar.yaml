# Gaia-M 恒星系统 — 6 行星 + 3 卫星（Aegis 系统）
# 行星层：Aegis : Boreal : Glacis = 1:2:4 拉普拉斯共振链
# 卫星层：Gaia-M : Cadence : Vigil = 1:2:4 拉普拉斯共振链（维持 Gaia-M 偏心率）
# 以光度为自变量（混合输入模式），引擎通过数值反演推算质量
name: "Gaia System"

description: |
  系统形成史（基于 Izidoro et al. 2017 共振链迁移理论，四阶段演化）：

  阶段 1 — 核吸积期 (0–5 Myr)
  - 水雪线 (~0.5 AU) 外侧冰质星子快速吸积，形成 ~10 M⊕ 固态核心
  - 触发失控气体吸积，3–5 Myr 内增长至 1.6 M_J (Aegis)
  - 雪线内侧仅形成 0.1–1.0 M⊕ 岩石胚胎，未达气态吸积临界质量

  阶段 2 — II 型迁移与共振链捕获 (5–10 Myr)
  - Aegis 与原行星盘交换角动量，从 ~0.5 AU 内迁至宜居带中心 (0.28 AU)
  - 外缘两颗胚胎被"牧羊犬效应"推动，发生会聚迁移
  - 穿过 2:1 / 4:1 共振后被永久锁定 → Aegis : Boreal : Glacis = 1:2:4 拉普拉斯共振链
  - 迁移扫清 0.05–0.2 AU 区间所有原始胚胎

  阶段 3 — 盘消散后碎片重组 (10–200 Myr)
  - 气体盘消散后，Aegis 轨道内侧残余星子缓慢吸积，重组为两颗小岩石行星 (Ember, Crucible)
  - 一颗散射体被弹射至远轨道 (Sentinel, e=0.18, i=7°)

  阶段 4 — 长期潮汐演化 (200 Myr–6 Gyr)
  - 内行星被恒星潮汐锁定
  - Gaia-M 在 Aegis 子盘中形成并缓慢外迁 10%（672,727 → 739,013 km）
  - 外迁过程中会聚迁移捕获两颗外卫星胚胎 → Gaia-M : Cadence : Vigil = 1:2:4
    卫星拉普拉斯共振链（机制与阶段 2 的行星共振链捕获完全对称）
  - 共振链持续泵浦 Gaia-M 的偏心率 e=0.0025（否则潮汐阻尼将在 ~Myr 尺度抹平），
    维持潮汐加热 → 板块构造与碳-硅酸盐循环
  - 系统进入当前稳定态

stars:
  - id: star_ignis
    name: "Ignis"
    spectral_class: M1
    luminosity_class: V
    luminosity: 0.0357        # L☉ — 自变量；引擎反演 M≈0.450 M☉
    metallicity: 0.0
    age_gyr: 5.90
    position:
      x: 0.0
      y: 0.0
      z: 0.0

orbits:
  # ---- 内行星（Aegis 迁移后残余碎片重组） ----
  - body_id: planet_ember
    parent_id: star_ignis
    semi_major_axis_au: 0.046
    eccentricity: 0.005           # 5.9 Gyr 恒星潮汐圆化残余（TRAPPIST-1b 类比）
    inclination_deg: 0.0
    longitude_ascending_node_deg: 0.0
    argument_of_periapsis_deg: 0.0
    mean_anomaly_epoch_deg: 0.0
    epoch_year: 0.0

  - body_id: planet_crucible
    parent_id: star_ignis
    semi_major_axis_au: 0.098
    eccentricity: 0.010           # 距恒星较远，潮汐圆化效率低于 Ember
    inclination_deg: 0.0
    longitude_ascending_node_deg: 0.0
    argument_of_periapsis_deg: 0.0
    mean_anomaly_epoch_deg: 0.0
    epoch_year: 0.0

  # ---- 气态巨行星（宜居带，混合变暖校准后位置） ----
  - body_id: planet_aegis
    parent_id: star_ignis
    semi_major_axis_au: 0.2722    # 混合变暖路径：原 HZ 中心 0.2795 内移 2.7%（温室 72→75K 补足其余份额）；HZ 范围 0.207–0.377 AU
    eccentricity: 0.005
    inclination_deg: 0.0
    longitude_ascending_node_deg: 0.0
    argument_of_periapsis_deg: 0.0
    mean_anomaly_epoch_deg: 0.0
    epoch_year: 0.0

  # ---- 共振链（会聚迁移捕获，1:2:4 拉普拉斯共振） ----
  - body_id: planet_boreal
    parent_id: star_ignis
    semi_major_axis_au: 0.4321    # 2:1 with Aegis → 0.2722 × 2^(2/3)（随链同步内移）
    eccentricity: 0.010           # 2:1 MMR 强制偏心率（GJ 876 共振链类比）
    inclination_deg: 0.0
    longitude_ascending_node_deg: 0.0
    argument_of_periapsis_deg: 0.0
    mean_anomaly_epoch_deg: 0.0
    epoch_year: 0.0

  - body_id: planet_glacis
    parent_id: star_ignis
    semi_major_axis_au: 0.6859    # 4:1 with Aegis → 0.2722 × 4^(2/3)（随链同步内移）
    eccentricity: 0.015           # Laplace 共振链最外端强制偏心率最高
    inclination_deg: 0.0
    longitude_ascending_node_deg: 0.0
    argument_of_periapsis_deg: 0.0
    mean_anomaly_epoch_deg: 0.0
    epoch_year: 0.0

  # ---- 远轨道散射体（Aegis 迁移弹射遗孤） ----
  - body_id: planet_sentinel
    parent_id: star_ignis
    semi_major_axis_au: 3.68
    eccentricity: 0.18            # 高偏心率 — 散射弹射的直接证据
    inclination_deg: 7.0          # 高倾角 — 散射弹射的直接证据
    longitude_ascending_node_deg: 0.0
    argument_of_periapsis_deg: 0.0
    mean_anomaly_epoch_deg: 0.0
    epoch_year: 0.0

  # ---- 宜居卫星（环绕 Aegis，1:2:4 卫星拉普拉斯共振链） ----
  - body_id: satellite_gaiam
    parent_id: planet_aegis
    semi_major_axis_au: 0.00494   # 739,013 km（P=78h，开普勒第三定律）
    eccentricity: 0.0025          # Cadence/Vigil 共振链泵浦维持（潮汐加热之源）
    inclination_deg: 9.0          # 相对黄道面（Aegis 绕恒星轨道面，系统参考平面）
    longitude_ascending_node_deg: 0.0
    argument_of_periapsis_deg: 0.0
    mean_anomaly_epoch_deg: 0.0
    epoch_year: 0.0

  # ---- 共振卫星（2:1 with Gaia-M，拉普拉斯链内环） ----
  - body_id: satellite_cadence
    parent_id: planet_aegis
    semi_major_axis_au: 0.007842  # 1,173,113 km = 739,013 × 2^(2/3)，精确 2:1 → P=6.50 d
    eccentricity: 0.005           # 共振平衡值（泵浦 vs 潮汐阻尼）
    inclination_deg: 9.0          # 与 Gaia-M 共面（相互倾角 ~0，链稳定性要求）
    longitude_ascending_node_deg: 0.0
    argument_of_periapsis_deg: 0.0
    mean_anomaly_epoch_deg: 0.0
    epoch_year: 0.0

  # ---- 共振卫星（4:1 with Gaia-M / 2:1 with Cadence，拉普拉斯链外环） ----
  - body_id: satellite_vigil
    parent_id: planet_aegis
    semi_major_axis_au: 0.012448  # 1,862,241 km = 739,013 × 4^(2/3)，精确 4:1 → P=13.0 d
    eccentricity: 0.008           # 链外端共振强制值略高（仍 <0.01 稳定性约束）
    inclination_deg: 9.0          # 与 Gaia-M 共面
    longitude_ascending_node_deg: 0.0
    argument_of_periapsis_deg: 0.0
    mean_anomaly_epoch_deg: 0.0
    epoch_year: 0.0

bodies:
  # ---- 行星 I：余烬 ----
  - id: planet_ember
    name: "Ember"
    body_type: "planet"
    mass_earth: 0.35
    radius_km: 4014               # 0.63 R⊕ — ρ=7.8 g/cm³（铁核残骸 + 重力压缩）
    rotation_period_days: 5.37    # 潮汐锁定于恒星
    axial_tilt_deg: 0.0
    albedo: 0.10                  # 裸露金属表面
    description:
      surface: "被剥夺大部分地幔的铁核残骸（ρ=7.8 g/cm³），昼侧灼热裸露岩石（380-504°C），铅锌矿脉半熔融；夜侧凝固金属霜，无大气"

  # ---- 行星 II：熔炉 ----
  - id: planet_crucible
    name: "Crucible"
    body_type: "planet"
    mass_earth: 0.90
    radius_km: 6180               # 0.97 R⊕
    rotation_period_days: 16.6    # 潮汐锁定于恒星
    axial_tilt_deg: 0.0
    albedo: 0.15                  # 暗色玄武岩表面
    description:
      surface: "90 bar CO₂ 超临界温室大气，表面 ~620 K，玄武岩平原与硫磺湖泊"

  # ---- 行星 III：神盾（气态巨行星） ----
  - id: planet_aegis
    name: "Aegis"
    body_type: "planet"
    mass_earth: 508.5             # 1.6 M_J × 317.83 M⊕/M_J
    radius_km: 71355              # 11.2 R⊕
    rotation_period_days: 0.4167  # ~10 小时（远快于卫星公转，确保角动量正向传递）
    axial_tilt_deg: 3.0
    albedo: 0.34                  # 类木星 Bond albedo

  # ---- 行星 IV：凛风（共振链 2:1） ----
  - id: planet_boreal
    name: "Boreal"
    body_type: "planet"
    mass_earth: 159.3             # 0.5 M_J
    radius_km: 60562              # 9.5 R⊕ (~0.85 R_J)
    rotation_period_days: 0.50    # ~12 小时
    axial_tilt_deg: 2.0
    albedo: 0.30
    description:
      surface: "水冰凝结线附近，H₂-He 大气富含水冰云与氨冰云，淡蓝色外观"

  # ---- 行星 V：冰棱（共振链 4:1） ----
  - id: planet_glacis
    name: "Glacis"
    body_type: "planet"
    mass_earth: 17.1              # ~0.054 M_J（海王星级）
    radius_km: 24719              # 3.88 R⊕
    rotation_period_days: 0.72    # ~17 小时
    axial_tilt_deg: 5.0
    albedo: 0.25
    description:
      surface: "冰巨星，H₂-He 大气富含 CH₄，深青色；外侧碎片盘的内牧羊犬"

  # ---- 行星 VI：哨兵（散射遗孤） ----
  - id: planet_sentinel
    name: "Sentinel"
    body_type: "planet"
    mass_earth: 8.5
    radius_km: 15290              # 2.4 R⊕
    rotation_period_days: 0.625   # ~15 小时
    axial_tilt_deg: 15.0
    albedo: 0.20                  # 冰质表面
    description:
      surface: "远轨道冰质散射体，近日点 3.02 AU / 远日点 4.34 AU，保留原行星盘外层原始冰质成分"

  # ---- 宜居卫星：Gaia-M ----
  - id: satellite_gaiam
    name: "Gaia-M"
    body_type: "natural_satellite"
    mass_earth: 1.20
    radius_km: 6817               # 1.07 R⊕
    rotation_period_days: 3.25    # = 公转周期（被 Aegis 潮汐锁定）
    axial_tilt_deg: 9.0           # 相对黄道面的有效倾角 = 轨道倾角 9°（自转轴 ⊥ 绕 Aegis 轨道面）；驱动气候引擎季节项
    albedo: 0.30
    description:
      surface: "宜居卫星，72% 海洋覆盖，潮汐加热驱动板块构造与碳-硅酸盐循环"

  # ---- 共振卫星：Cadence（2:1 with Gaia-M，P=6.50 d） ----
  - id: satellite_cadence
    name: "Cadence"
    body_type: "natural_satellite"
    mass_earth: 0.05              # 共振链内环泵浦者
    radius_km: 2840               # ~0.45 R⊕，ρ≈3.1 g/cm³（岩质）
    rotation_period_days: 6.50    # 同步自转
    axial_tilt_deg: 0.0           # 自转轴 ⊥ 轨道面
    albedo: 0.25
    description:
      surface: "岩质共振卫星，与 Gaia-M 锁定 2:1 共振，持续泵浦其偏心率；天空中间歇性出现的'节拍之月'"

  # ---- 共振卫星：Vigil（4:1 with Gaia-M，P=13.0 d） ----
  - id: satellite_vigil
    name: "Vigil"
    body_type: "natural_satellite"
    mass_earth: 0.03              # 共振链外环节拍器
    radius_km: 2470               # ~0.39 R⊕，ρ≈2.8 g/cm³（冰岩混合）
    rotation_period_days: 13.0    # 同步自转
    axial_tilt_deg: 0.0           # 自转轴 ⊥ 轨道面
    albedo: 0.35                  # 富冰表面
    description:
      surface: "冰岩混合共振卫星，拉普拉斯链最外端；与 Cadence 共同维持 Gaia-M 的潮汐加热"
