# =============================================================================
# Earth 地形生成管线配置 — 开发/调试用 (4,096 节点, 快速迭代)
# =============================================================================
#
# 本文件是 terrain-dev 分支的地形参数调试图纸。每个参数都带有详细注释，
# 说明其物理含义、有效范围和对输出的影响。
#
# 用法:
#   uv run dreamulator terrain generate earth --planet earth \
#     --branch terrain-dev \
#     --config data/worlds/earth/branches/terrain-dev/layers/geological/input/terrain_config.yaml
#
# 4,096 节点约为 100K 节点的 1/25, 管线耗时 ~3s (vs ~90s)。
# 调试通过后，将参数同步到 gaia-m 等正式配置。
#
# 算法参考:
#   Cortial, Y., Peytavie, A., Galin, E., & Guérin, E. (2019).
#   "Procedural Tectonic Planets." Computer Graphics Forum, 38(2).
#   https://doi.org/10.1111/cgf.13624
#
# 源码位置 (相对于 src/dreamulator/map/):
#   pipeline_types.py        — 本文件的 schema 定义 (TerrainPipelineConfig dataclass)
#   terrain_pipeline.py      — 管线编排器 (9 阶段)
#   cvt_mesh.py              — Stage 1: CVT 网格生成
#   plate_generator.py       — Stage 2: 板块分割
#   tectonic_simulator.py    — Stage 3: 构造时间演化
#   boundary_detector.py     — Stage 4: 板块边界检测与分类
#   terrain_synthesizer.py   — Stage 5: 地形合成 (高度赋值)
#   export.py                — Stage 9: 等距矩形投影导出
#
# 完整文档: docs/usage/terrain-pipeline.md

# =============================================================================
# 行星基本参数
# =============================================================================
# 这些参数定义被模拟行星的物理属性。它们不影响随机种子或算法选择，
# 只影响物理计算的输入值。
# =============================================================================
planet:
  # 随机种子。相同种子 + 相同参数 = 完全可复现的地形。
  # 整数，任意值均可（推荐 0–2^31）。改变种子会生成完全不同的板块布局。
  seed: 42

  # 行星半径 (km)。地球 = 6371.0。
  # 影响: 球面网格的曲率、板块面积、距离计算。
  radius_km: 6371.0

  # 表面重力加速度 (m/s²)。地球 = 9.81。
  # 影响: 山体高度上限 (isostasy)、侵蚀速率 (TODO: erosion stage)。
  gravity_m_s2: 9.81

  # 自转周期 (天)。地球 = 1.0。
  # 影响: 科里奥利力 → 风带、洋流方向 (TODO: climate stage)。
  rotation_period_days: 1.0

# =============================================================================
# CVT 网格 + 地形合成参数
# =============================================================================
# 控制 Centroidal Voronoi Tessellation 网格的生成方式以及最终高度赋值。
# 全部打包在 terrain: 节下 —— YAML 不允许重复键，只能有一个 terrain 块。
# =============================================================================
terrain:
  # ---- CVT 网格 ----------------------------------------------------------
  # 球面上的 Voronoi cell 数量。每个 cell ≈ 一个"像素化的地理区域"。
  #   - 4,096:  开发调试 (~3s 管线耗时)
  #   - 10,000: 轻量预览
  #   - 100,000: 正式生产（~90s），cell 平均面积 ≈ 51,000 km² (地球陆地面积/100K)
  #   - 500,000: 高精度（Cortial 2019 论文量级）
  # 时间复杂度: O(N log N) for Lloyd, O(N²) for spherical Voronoi.
  num_nodes: 32768

  # 初始采样点相对于 Fibonacci 球面格点的随机抖动强度 (σ, 单位: 格点半间距)。
  #   - 0.0: 完美 Fibonacci 格点 (无随机性)
  #   - 0.2–0.5: 推荐范围 (足够的随机性，避免规则伪影)
  #   - >1.0: 过度抖动，可能导致 Lloyd 收敛缓慢
  jitter_sigma: 0.3

  # Lloyd 松弛迭代次数。每次迭代将 site 移动到其 Voronoi cell 的质心，
  # 使 cell 大小更均匀 (CVT → centroidal Voronoi)。
  #   - 0: 不松弛 (原始 Fibonacci + 抖动的 Voronoi)
  #   - 5–10: 适合大部分场景 (cell 面积方差 < 5%)
  #   - 15–30: 极高均匀性，但增加计算时间
  # 时间复杂度: O(I * N log N), I=iterations.
  lloyd_iterations: 8

  # ---- 地形高度控制 -------------------------------------------------------
  # 大陆平均海拔 (m)。地球 = ~840 m (含冰盖)。
  # 实际值受 noise 和 boundary effects 调制。用于构建双峰高度分布。
  continental_elevation_m: 850.0

  # 海洋平均深度 (m)。地球 = ~-3688 m。负值 = 低于海平面。
  # 与 continental_elevation_m 一起定义双峰分布的两个峰值。
  oceanic_elevation_m: -3800.0

  # ---- 板块边界地形效应 ---------------------------------------------------
  # 板块边界影响范围的半宽 (km)。边界两侧各 boundary_influence_km 范围内的
  # cell 会受边界类型（汇聚/离散/转换）的高度调制。
  #   - 200–500 km: 地球类比范围 (造山带宽度)
  #   - 使用 smoothstep (Hermite 插值) 在边界处平滑过渡
  boundary_influence_km: 500.0

  # 汇聚边界 (→←) 最大抬升量 (m)。模拟俯冲带/碰撞带的造山效应。
  #   - 地球类比: 安第斯山脉 ~4000 m, 喜马拉雅 >6000 m
  #   - 最终高度受 smoothstep 衰减调制: 边界中心=100%, 边缘=0%
  convergent_uplift_m: 4000.0

  # 离散边界 (←→) 最大下沉量 (m)。模拟洋中脊/裂谷的下沉效应。
  # 正值表示下沉深度，最终海拔为负值。
  divergent_depth_m: 2000.0

  # 转换边界 (↑↓) 高度扰动范围 (m)。模拟走滑断层的地形破碎效应。
  # 在 [-spread/2, +spread/2] 范围内随机偏移。
  plate_elevation_spread_m: 1500.0

  # ---- 板块边界噪声 -------------------------------------------------------
  # 边界 cell 随机翻转比例 (0–1)。0 = 完全笔直的 Voronoi 边;
  # 0.05–0.15 = 自然有机的边界形态。
  # 对应 Cortial et al. (2019) §3 的 "noise-warped geodetic distance"。
  boundary_noise: 0.10

  # ---- 地形合成算法 -------------------------------------------------------
  # 选择高度合成策略:
  #   - "cortial2019_gaussian": 对称高斯边界效应 (Cortial 2019 原始版)
  #   - "cortial2019_asymmetric": 非对称剖面 + 热点火山链 + 内陆构造地貌
  #     (Dreamulator 增强版, Phase 2.5+)
  # terrain_algorithm: cortial2019_asymmetric

  # 山体非对称性 (0–1)。仅 terrain_algorithm=cortial2019_asymmetric 时生效。
  #   - 0.0: 完全对称的山体剖面 (坡度两侧相同)
  #   - 0.4: 中等非对称 (迎风面陡, 背风面缓)
  #   - 1.0: 极度非对称
  # 模拟现实中的雨影效应和构造挤压方向性。
  # mountain_asymmetry: 0.4

  # 火山热点链数量。0 = 不生成热点。
  # 每个热点在板块上留下年龄递减的火山岛链 (如夏威夷–皇帝海山链)。
  # 仅 terrain_algorithm=cortial2019_asymmetric 时生效。
  # hotspot_count: 3

  # ---- 海岸地貌 -----------------------------------------------------------
  # 以下参数仅 terrain_algorithm=cortial2019_asymmetric 时生效。

  # 大陆架宽度 (km)。海岸线向海一侧的缓坡带宽度。
  # 地球平均值: ~80 km; 被动大陆边缘: 100–200 km。
  # shelf_width_km: 150.0

  # 海岸平原宽度 (km)。海岸线向陆一侧的缓坡带宽度。
  # 地球平均值: 50–100 km。
  # coastal_plain_width_km: 80.0

  # 海岸平原平滑的最大高度 (m)。高于此值的沿海 cell 被视为
  # 海岸山脉 (如安第斯山脉南段、加州 Big Sur)，不进行平滑处理。
  # 平滑强度从海平面处的全强度线性衰减到此高度处为零。
  # coastal_plain_max_elevation_m: 500.0

  # 岛弧高度 (m)。洋-洋汇聚边界处生成的火山岛弧的最大高度。
  # 地球类比: 日本列岛、阿留申群岛、马里亚纳群岛。
  # island_arc_height_m: 1500.0

  # ---- 内陆构造地貌 -------------------------------------------------------
  # 以下参数控制大陆板块内部的地貌多样性。仅
  # terrain_algorithm=cortial2019_asymmetric 时生效。

  # 每个大陆板块内部的古造山带基础数量。实际数量随板块内部面积
  # 自动缩放: 每 ~300 个内部 cell 增加 1 条造山带。
  # 0 = 不生成内陆造山带。
  # 地球类比: 乌拉尔山脉 (古生代)、阿巴拉契亚山脉 (古生代)、
  #   阿尔泰山、秦岭。
  # interior_orogeny_count: 2

  # 沿造山带走向，某段变为断陷盆地而非隆升山脊的概率 (0–1)。
  # 模拟拉分盆地和断块凹陷。
  # 地球类比: 吐鲁番盆地 (−154 m)、费尔干纳谷地 (~400 m)、
  #   盆地与山脉省的半地堑 (500–2000 m 相对下沉)。
  # interior_basin_chance: 0.25

  # 山间盆地最大下沉深度 (m)。仅影响被选为盆地的段落。
  # interior_basin_depth_max_m: 600.0

  # 造山带走向高度变化强度 (0–1)。
  #   - 0.0: 均匀高度 (整条山脊恒定)
  #   - 1.0: 完整变化范围 (通过 1D 噪声调制)
  # 模拟现实造山带沿走向的高度起伏。
  # interior_height_variation: 0.7

# =============================================================================
# 构造板块参数
# =============================================================================
# 控制板块如何从球面 Voronoi 图分割生成，以及是否进行时间演化。
# =============================================================================
plates:
  # 板块数量。不同世界的推荐值:
  #   - 地球: 12–15 (现实: 7–8 大板块 + 若干小板)
  #   - Gaia-M: 20 (更活跃的构造活动)
  #   - 快速调试: 5–10
  num_plates: 15

  # 板块运动速度范围 (cm/年)。
  #   - 地球: 2–10 cm/yr (太平洋板块最快 ~10, 北美最慢 ~2)
  #   - Gaia-M: 3–15 cm/yr (潮汐加热驱动, 更快)
  # 每个板块从中随机采样一个速度。
  plate_speed_min_cm_yr: 1.0
  plate_speed_max_cm_yr: 10.0

  # ---- 板块分割算法 -------------------------------------------------------
  # 选择初始板块分割策略:
  #   - "cortial2019": Poisson-disc 采样 + 球面 Voronoi BFS (Cortial et al. 2019 §3)
  #     效果: 板块大小均匀、边界自然
  plate_algorithm: cortial2019

  # ---- 海陆比例 -----------------------------------------------------------
  # 每个板块内部的大陆地壳比例范围。实际值在 [min, max] 区间均匀随机采样。
  # 注意: 这是地壳类型（continental/oceanic）的比例，不是最终露出海面的
  # 比例——部分大陆地壳会被海水覆盖（大陆架）。
  #   - 0.1–0.5: 海洋世界 (岛链为主)
  #   - 0.3–0.7: 类地行星 (均衡)
  #   - 0.6–0.9: 超级大陆 / 盘古型
  # 地球露出陆地 ≈29%，大陆地壳 (含陆架) ≈40%。
  continental_fraction_min: 0.28   # target ~29% emergent land
  continental_fraction_max: 0.36

  # 纬度偏置 (0–1)。大陆地壳向赤道集中的权重。值越高，低纬度越偏向形成大陆。
  #   - 0.7–0.9: 快速自转 (地球、木星)
  #   - 0.3–0.5: 潮汐锁定 / 慢自转 (Gaia-M、金星)
  #   - 0.0: 无纬度偏好 (纯噪声分配)
  lat_bias: 0.7

  # ---- 海平面自动校准 ("倒水") -------------------------------------------
  # 启用后，通过二分查找确定海平面高度，使得露出水面的陆地面积比例
  # 恰好等于 target_land_fraction。海平面自动成为 0 m 基准面。
  # 关闭后使用固定的双峰基底 (continental_elevation_m / oceanic_elevation_m)。
  # 隐含水预算（等效均匀深度）在校准日志中报告。
  sea_level_auto: true
  # 目标露出陆地比例 [0, 1]。地球 ≈ 0.29。
  target_land_fraction: 0.28

  # ---- 构造时间演化 -------------------------------------------------------
  # 控制板块随时间演化的算法。影响板块运动、碰撞、俯冲和侵蚀。
  #   - "" (空字符串): 无演化 (静态板块)
  #   - "cortial2019": Cortial et al. (2019) §4–5 的速度场方法
  #     包括: 板块旋转 + 俯冲 + 碰撞 + 侵蚀 + 裂解 + 小板块吸收
  tectonic_algorithm: "cortial2019"

  # 构造演化时间步数。
  #   - 0: 不演化 (静态)
  #   - 50–125: 快速预览
  #   - 125–250: Cortial 2019 论文的默认范围 (500K 点, δt=2My)
  # 每步模拟 δt My (见 tectonic_dt_my) 的构造过程。
  tectonic_steps: 50

  # 每步时间长度 (百万年, My)。
  #   - 0.0: 自动缩放 (最快板块每步移动 ~3 个 cell)
  #   - 2.0: Cortial 2019 在 500K 点时的默认值
  # Dreamulator 根据 cell 分辨率自动计算: δt ∝ (cell_diameter_km) / (max_plate_speed_cm_yr)
  # tectonic_dt_my: 0.0

# =============================================================================
# 噪声参数
# =============================================================================
# 用于在基础地形高度上叠加自然起伏的分形布朗运动 (fBm) 噪声。
# 噪声 = 高频细节 (noise_*) + 低频区域波动 (regional_noise_*)。
# =============================================================================
noise:
  # ---- 高频细节噪声 (fBm) ------------------------------------------------
  # 基础空间频率。值越小 → 地形特征越大、越平滑;
  # 值越大 → 地形越破碎。
  #   - 0.5–1.0: 大陆尺度起伏
  #   - 1.5–3.0: 区域性山脉/盆地
  #   - 4.0–8.0: 局部丘陵/山谷
  noise_scale: 2.0

  # fBm 的叠加层数 (octaves)。每层频率加倍、振幅按 persistence 衰减。
  #   - 2–3: 平滑、少细节 (适合小行星/矮行星)
  #   - 4–6: 中等细节 (类地行星)
  #   - 7–10: 高度细节 (增加计算量)
  noise_octaves: 6

  # fBm 振幅保持系数 (0–1)。控制每层 octave 的振幅衰减。
  #   - 0.2–0.3: 快速衰减 → 外观平滑
  #   - 0.5: 经典 Perlin 噪声风格
  #   - 0.7–0.8: 粗糙、高细节
  noise_persistence: 0.5

  # fBm 频率倍增系数 (>1)。控制每层 octave 的频率增长。
  #   - 1.5–2.0: 标准范围
  #   - 2.0: 经典 lacunarity
  #   - >2.5: 会产生非标准频谱效果
  noise_lacunarity: 2.0

  # 陆地区域噪声振幅 (m)。最终叠加在 continental_elevation_m 上的
  # 噪声最大幅值。实际值在 [-amp, +amp] 范围内。
  noise_amplitude_land_m: 600.0

  # 海洋区域噪声振幅 (m)。通常 < land 振幅，因为海底地形
  # 比陆地上更平坦（深海平原 vs 褶皱山脉）。
  noise_amplitude_ocean_m: 300.0

  # 噪声各向异性 (0–1)。沿板块边界走向方向拉伸 fBm 噪声。
  #   - 0.0: 各向同性 (噪声在各个方向相同)
  #   - 0.3: 细微的线性纹理 (沿走向的山脊/沟槽)
  #   - 1.0: 强烈的线性特征
  # noise_anisotropy: 0.3

  # ---- 低频区域噪声 -------------------------------------------------------
  # 在大空间尺度上叠加在板块内部，产生大范围的台地、盆地和高原。
  # 频率远低于 detail noise (scale 值越小 = 频率越低)。

  # 区域噪声基础空间频率。值远小于 noise_scale (通常为其 1/4–1/10)。
  regional_noise_scale: 0.5

  # 区域噪声在陆地上的振幅 (m)。应大于 noise_amplitude_land_m
  # (通常 1.5–2×)，以确保板块内部的大型隆起和沉降在
  # 高海拔板块上也可见 (plate_elevation_spread_m 可能将
  # 基础海拔推至 2000 m+)。
  regional_noise_amplitude_land_m: 1200.0

  # 区域噪声在海洋中的振幅 (m)。控制深海盆地、洋底高原
  # (如 Ontong Java 高原) 等大规模海底地形。
  regional_noise_amplitude_ocean_m: 800.0

# =============================================================================
# 导出设置
# =============================================================================
# 控制最终输出的等距矩形投影 (equirectangular) 栅格图像尺寸。
# 此分辨率独立于 CVT 网格精度 —— 生成的高程值从 Voronoi cell
# 采样到目标光栅网格上。
# =============================================================================
export:
  # 输出图像宽度 (像素)。等距矩形投影: 360° 经度 = 整幅图像宽度。
  # 推荐值: 2× export_height (equirectangular 标准长宽比 2:1)。
  export_width: 2048

  # 输出图像高度 (像素)。等距矩形投影: 180° 纬度 = 整幅图像高度。
  # 推荐值: export_width / 2。
  export_height: 1024
