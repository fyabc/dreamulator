# Nacrea 恒星系统 — 6 行星 + 3 卫星 + 3 矮行星（Aegis 系统 + 墟带）
# 行星层：Aegis : Boreal : Glacis = 1:2:4 周期通约链（共振邻接，β 安静长期模态，
#   10 Myr 验证；e 带狂野呼吸 = 链内禀，历元值仅为快照）
# 卫星层：Nacrea（宜居内卫，ε=18° 锥摆）+ 双单体逆行捕获卫韵珠/守珠（FJ 近平衡族，
#   长期摄动维持 Nacrea 受迫偏心率，见 design-notes/0009）
# 墟带：Glacis 之外 1.3–3.1 AU 碎片带（柯伊伯带类比，主带 1.4–2.7 AU）+ 外散射盘 +
#   奥尔特云；三颗已命名矮行星（璞/皚/赭）；Sentinel 特洛伊「伴行营」
# 质量+金属量为自变量（混合输入模式）：L = 引擎 MLR+Z 修正值、T = 作者光谱钉值
# （阈值内，静默通过）、R 由 SB 从 (L,T) 导出——引擎一致性校验全链静默通过
name: "Nacrea System"

description: |
  系统形成史（基于 Izidoro et al. 2017 共振链迁移理论，五阶段演化）：

  阶段 1 — 核吸积期 (0–5 Myr)
  - 水雪线 (~0.89 AU) 外侧冰质星子快速吸积，形成 ~10 M⊕ 固态核心
  - 触发失控气体吸积，3–5 Myr 内增长至 1.6 M_J (Aegis)
  - 雪线内侧仅形成 0.1–1.0 M⊕ 岩石胚胎，未达气态吸积临界质量

  阶段 2 — II 型迁移与共振捕获 (5–10 Myr)
  - Aegis 与原行星盘交换角动量，从 ~1 AU 内迁至宜居带内侧半区 (~0.365 AU；
    内缘 0.356、中心 0.486——S_eff 0.922，1D RG 阈下 4.8%；3D GCM 内缘对
    慢自转行星更深 1.5-2×，实际余量更大，湿温室渐进失水为真实约束）
  - 外缘两颗胚胎被"牧羊犬效应"推动，发生会聚迁移
  - 穿过 2:1 / 4:1 共振后周期比锁定 → Aegis : Boreal : Glacis = 1:2:4 周期通约链
    （共振邻接：盘消散后链落入 β 安静长期模态——φ_L 循环、无相位锁定，
    链行星 e 带内禀狂野呼吸（Boreal 0.003–0.11、Glacis 0.005–0.14），
    Aegis e 带 0.065–0.081、振幅呼吸周期 ~2.85 kyr；10 Myr N 体实测有界
    ——重标定后待重认证）
  - 迁移扫清 0.05–0.21 AU 区间所有原始胚胎

  阶段 3 — 盘消散后碎片重组 (10–200 Myr)
  - 气体盘消散后，Aegis 轨道内侧残余星子缓慢吸积，重组为两颗小岩石行星 (Ember, Crucible)
  - Glacis 之外的星子盘保留为「墟带」前身（1.3–3.1 AU）；一颗散射体被弹射至
    远轨道 (Sentinel, e=0.18, i=7°)

  阶段 4 — 晚期散射期与外卫捕获 (~0.5 Gyr，本系统的「晚期重轰炸」)
  - 内行星被恒星潮汐锁定
  - Nacrea 在 Aegis 子盘中形成并缓慢外迁至 ~723,300 km（潮汐演化；外迁速率由
    Aegis k₂/Q=7e-8 设定，与 Nacrea 自身 Q 无关）
  - 一次动力学重组事件把大量冰质星子送过内系：部分被 Aegis/Glacis 逆行捕获
    （韵珠 Cadence、守珠 Vigil、霰星逆石星 Rogue 同代同机制）；部分入外散射盘
    与奥尔特云；墟带内缘被侵蚀雕塑，Sentinel 共振雕刻其外缘
  - 韵珠/守珠的长期摄动 + 恒星四极矩共同维持 Nacrea 的受迫偏心率（否则潮汐阻尼
    将在 ~Myr 尺度抹平），驱动潮汐加热 → 板块构造与碳-硅酸盐循环
  - 系统进入当前稳定态

  阶段 5 — 当前纪元 (5.9 Gyr)
  - 墟带持续碰撞研磨供给尘埃（f_dust≈3e-8，黄道面 16° 宽「墟带光」幽带）；
    偶发矮行星级碰撞 = 「墟带觉醒」增亮事件（百年尺度，当前处于基线期）
  - 彗星双族：短周期（Aegis 族，散射盘供给）与长周期（奥尔特，银河潮汐调制）

  纪元约定（2026-09-28 重构）：全部轨道根数 = 认证轨迹在 t₁=37.905 yr 的状态
  （纪元平移，非独立初值），唯守珠三角（Ω/ω/M）为路线 1 强混沌重抽的
  10-07 定版重采样值（2026-10-07 作者裁决；30 kyr 数值认证：珠母星热流
  0.34 W/m² 正典带内、双珠轨道有界——长期动力学审计与豁免裁决仅见
  design-notes/0009 §2，对外正典 = 双珠与文明长期相伴）。
  路线 1 重标定采年长锁定（a ×1.0328 配 M* 0.65 → P 精确还原 99.8 d），本节
  历法与相位数字全部保持原值：φ=ϖ_A−Ω_N=82.7° → perihelion_day≈22.9 d，
  近日点领先北夏至 ~2.0 d（配大陆 ~25 d 热滞后，增温峰与盛夏重合）。
  ϖ_A 循环周期 ~44 yr、Nacrea 节点（=其自转轴）进动 ~10 yr → 近日点-季节相位
  以 ~13 yr 周期走完全循环（「近日点大年」——行星际岁差，一代人可见）。
  恒星第三体项 ×0.9999 → 认证时序数字近乎精确继承（确认跑见 orbits 横幅）。

stars:
  - id: star_ignis
    name: "烬星 · Ignis"
    spectral_class: K6           # 名义光谱型：M=0.65 对应 K6/K7、T_eff=4365 对应 K5/K6 界，取 K6
    luminosity_class: V
    mass: 0.65                 # M☉ 自变量（三输入；L = 引擎 MLR+Z 值，T = 作者光谱钉值）
    luminosity: 0.1227        # L☉ 自变量；光照 0.92×地球（S_eff=0.922 @ a_Aegis=0.3648 AU）
    temperature: 4365.0        # K — 作者钉值（较 SB 自然值 4386 低 0.5%，阈值内静默；光谱
                               # 钉在 GCM 定标点上，贫金属效应较 Z=0 抬 +1.7%）；<0.75 μm
                               # 份额 ≈0.33（K 星 NIR 高层吸收削弱地表温室，光谱蓝移 =
                               # 温室效率红利）；GCM 光谱分割用此值
    metallicity: -0.19         # [Fe/H] — 贫金属厚盘老 K 矮星（5.9 Gyr 龄典型）；引擎 Z 修正
                               # （Eker 2018：L∝Z^-0.1、R∝Z^+0.05）→ 同质量更热更亮
    age_gyr: 5.90
    position:
      x: 0.0
      y: 0.0
      z: 0.0

orbits:
  # ⚠ 路线 1 辐照重标定（2026-10-06 裁决，proposal: nacrea-insolation-recalibration）：
  # 日心轨道全表 a ×1.0328064——**年长锁定**：Aegis 0.3648 AU 在 M*=0.65 下精确
  # 还原 P=99.8 d，历法/季节/纪元叙事全部保持原值；共振链通约比严格保持；
  # 卫星系轨道（parent=行星）不动。恒星第三体项 M*/a³ ×0.9999、Aegis Hill 半径
  # ×1.0001、拉普拉斯半径 ×0.999——参数一阶不变，但强混沌系统重认证 = 全新
  # 抽签（初确认跑热流超带 → 触发重采样，过程见 0009 附录 §10）。**落地
  # （2026-10-07 作者裁决）**：守珠三角重采样定版（10-07 定版）= 正典实现——30 kyr
  # 数值认证：珠母星热流 0.34 W/m²（e_N rms 0.0036）正典带内，守珠 a/r_H
  # ≤ 0.453 有界；系综采样（相位 6 + 韵珠扰动 9 抽）无热流带内更优构型。
  # 长期动力学审计与豁免裁决仅见 design-notes/0009 §2（对外正典 = 双珠长期
  # 相伴，失稳细节不入对外设定）。认证命令：
  # `uv run python scripts/astro/rebound_nbody.py --j2 0.008 --tides --t-end 3e4`
  # （harness 已含 J2 节点+近点角向量算子 = 完整拉普拉斯面物理）。
  # 未积分天体（Ember/Crucible/Sentinel/小卫）= 旧历元根数按开普勒解析推进 t₁。
  # 矮行星角度按散布规则（距 90° 整数倍 <10° 重抽），轨道经 300 kyr 稳定性验证。
  # ---- 内行星（Aegis 迁移后残余碎片重组） ----
  - body_id: planet_ember
    parent_id: star_ignis
    semi_major_axis_au: 0.0475
    eccentricity: 0.005           # 5.9 Gyr 恒星潮汐圆化残余（TRAPPIST-1b 类比）
    inclination_deg: 0.8          # 内残余吸积的小互倾角（水星 7° 同类，缩放版）
    longitude_ascending_node_deg: 324.9
    argument_of_periapsis_deg: 0.0   # e=0.005 近圆，近点无定义
    mean_anomaly_epoch_deg: 180.030705
    epoch_year: 0.0

  - body_id: planet_crucible
    parent_id: star_ignis
    semi_major_axis_au: 0.1012
    eccentricity: 0.010           # 距恒星较远，恒星潮汐圆化效率低于 Ember
    inclination_deg: 0.4
    longitude_ascending_node_deg: 157.3
    argument_of_periapsis_deg: 0.0   # e=0.010 近圆，近点无定义
    mean_anomaly_epoch_deg: 212.298187
    epoch_year: 0.0

  # ---- 气态巨行星（宜居带，β 安静长期模态） ----
  # e=0.0679 为历元快照；β+ 安静模态带 0.065–0.081（振幅呼吸 ~2.85 kyr，
  # 10 Myr 有界验证；10-07 定版 30 kyr 认证当代段 rms 0.065 / p95 0.082）。
  # 距离季 = 通量摆幅 ±14%（近日点 ~22.9 d，领先北夏至 ~2.0 d）。
  # 狂野模态（ϖ₀≈90° 初值族）8.4 kyr 即死且热流 ×2.5——禁止「优化」回该扇区。
  - body_id: planet_aegis
    parent_id: star_ignis
    semi_major_axis_au: 0.3648000000
    eccentricity: 0.06786252      # β+ 安静模态历元值（带 0.065–0.081）
    inclination_deg: 0.025812
    longitude_ascending_node_deg: 131.099119
    argument_of_periapsis_deg: 88.993305  # ϖ_A=220.1°；循环周期 ~44 yr（近日点大年 ~13 yr 见文件头）
    mean_anomaly_epoch_deg: 47.539366
    epoch_year: 0.0

  # ---- 共振链（会聚迁移捕获，1:2:4 周期通约；e 为快照，链内禀呼吸见下） ----
  - body_id: planet_boreal
    parent_id: star_ignis
    semi_major_axis_au: 0.5776538
    eccentricity: 0.04614538      # 快照；β+ 带 0.003–0.11（链内禀呼吸，百年尺度）
    inclination_deg: 0.00838
    longitude_ascending_node_deg: 251.335687
    argument_of_periapsis_deg: 232.272881
    mean_anomaly_epoch_deg: 298.081383
    epoch_year: 0.0

  - body_id: planet_glacis
    parent_id: star_ignis
    semi_major_axis_au: 0.9295924
    eccentricity: 0.0442664       # 快照；β+ 带 0.005–0.14（墟带内缘的雕刻者）
    inclination_deg: 0.001616
    longitude_ascending_node_deg: 267.063883
    argument_of_periapsis_deg: 123.652606
    mean_anomaly_epoch_deg: 45.95449
    epoch_year: 0.0

  # ---- 远轨道散射体（Aegis 迁移弹射遗孤；墟带外缘雕刻者） ----
  - body_id: planet_sentinel
    parent_id: star_ignis
    semi_major_axis_au: 3.8008    # 判决：恰位——共振（2:1@2.40、3:2@2.89）
    # 雕刻墟带外缘而不消毒主带；与 Glacis 相距 35.7 互希尔半径（动力学解耦）
    eccentricity: 0.18            # 高偏心率 — 散射弹射的直接证据
    inclination_deg: 7.0          # 高倾角 — 散射弹射的直接证据
    longitude_ascending_node_deg: 326.0
    argument_of_periapsis_deg: 280.3
    mean_anomaly_epoch_deg: 160.781931
    epoch_year: 0.0

  # ---- 墟带矮行星（柯伊伯带类比；0.3 Myr 带扫描 + 300 kyr 单体稳定性双验证） ----
  - body_id: dwarf_relic
    parent_id: star_ignis
    semi_major_axis_au: 1.5697    # 主带锚：G 2:1@1.46 与 G 5:2@1.70 之间的干净窗
    eccentricity: 0.08            # 300 kyr 带 0.034–0.097（热带群成员）
    inclination_deg: 7.0
    longitude_ascending_node_deg: 58.2
    argument_of_periapsis_deg: 201.7
    mean_anomaly_epoch_deg: 112.4
    epoch_year: 0.0

  - body_id: dwarf_rime
    parent_id: star_ignis
    semi_major_axis_au: 6.7133    # 外散射盘/脱离过渡；q=4.70 略出 Sentinel 远日 4.48
    eccentricity: 0.30            # 300 kyr 带 0.199–0.339（q_min 4.52 = 暂现种群，Gyr 级寿命但缓慢加工中）
    inclination_deg: 14.0
    longitude_ascending_node_deg: 291.3
    argument_of_periapsis_deg: 103.6
    mean_anomaly_epoch_deg: 305.8
    epoch_year: 0.0

  - body_id: dwarf_russet
    parent_id: star_ignis
    semi_major_axis_au: 12.9101   # 深外缘；远日点 20.7 AU（36 K，N₂/CH₄ 霜稳定）
    eccentricity: 0.60            # 300 kyr 带 0.571–0.647（q_min 4.36，同暂现种群注记）
    inclination_deg: 15.0
    longitude_ascending_node_deg: 142.6
    argument_of_periapsis_deg: 259.4
    mean_anomaly_epoch_deg: 77.2
    epoch_year: 0.0

  # ---- 宜居卫星：Nacrea（珠母星；认证实现——勿改任何字段，见文件头红线） ----
  # 基准面 = 日心黄道系。ε=18°（Aegis 倾角）下的出路 (b) 构型：轨道面初始贴
  # Aegis 赤道，绕拉普拉斯面 ~10 yr 锥摆（Nacrea 在 1.45 r_L 外侧，赤道面非平衡态）。
  # 认证带（10-07 定版 30 kyr 认证，当代段 0–12 kyr）：i_ecl 10.9–18.3°、i_eq 0.2–31.4°；
  # **长期均值 i_ecl ≈ 14.9° = 气候层有效倾角**（planets.yaml axial_tilt_deg，
  # 10 yr ≪ 气候响应时间，季节学等效于均值倾角 + ±3° 十年呼吸）。历元值 13.6° =
  # 锥摆快照。
  - body_id: satellite_nacrea
    parent_id: planet_aegis
    semi_major_axis_au: 0.0048348095   # ~723,300 km
    eccentricity: 0.0024175            # 历元值；受迫带见 0009 §3（当代段 rms 0.0036）
    inclination_deg: 13.637092
    longitude_ascending_node_deg: 137.41468
    argument_of_periapsis_deg: 247.930961
    mean_anomaly_epoch_deg: 97.912075
    epoch_year: 0.0

  # ---- 逆行捕获卫：Cadence（韵珠，早期捕获 ~0.5 Gyr，Sentinel 散射期） ----
  # FJ 近平衡族：初值 i_ecl=167.2°/Ω=180°（ε=18 逆行拉普拉斯平衡 162.6° 近旁），
  # 历元态 = 轨迹 t₁ 状态。叙事：不是「赤道化石」，是绕逆行拉普拉斯面的有界进动
  # （i_ecl 为准不变量，i_eq 锥摆；10-07 定版认证当代段带 i_ecl 166.2–174.5°、
  # i_eq 150.0–175.3°）。e 带（当代段 p5–p95）0.009–0.072，火山活动总体温和。
  # 长期动力学审计与豁免裁决仅见 design-notes/0009 §2（对外正典 = 双珠长期相伴）。
  # ⚠ 认证实现要素：改动任何字段前必须重跑认证（文件头命令）。
  - body_id: satellite_cadence
    parent_id: planet_aegis
    semi_major_axis_au: 0.0078845945   # ~1,179,500 km ≈ 0.252 r_H；P≈6.54 d
