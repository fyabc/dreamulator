    parent_id: planet_boreal
    semi_major_axis_au: 0.007093  # 1,061,000 km（17.5 R_B），P≈10.0 d；U:S 周期比 2.55（脱调，避 5:2）
    eccentricity: 0.003
    inclination_deg: 2.5
    longitude_ascending_node_deg: 11.5   # Boreal 赤道交点（三卫共享）
    argument_of_periapsis_deg: 0.0
    mean_anomaly_epoch_deg: 156.013785
    epoch_year: 0.0

  # ---- Glacis 卫星 — 规则内卫星 + 逆行捕获卫 ----
  # 注：Glacis 特洛伊不稳定（0.3 Myr 数值判决 1/24，共振链行星无特洛伊）；
  # Rogue 在 Glacis e 呼吸峰值（0.14）期的剥离风险登记于 0009 附录待评估。
  - body_id: satellite_shard
