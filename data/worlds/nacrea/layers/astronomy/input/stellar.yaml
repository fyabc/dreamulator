    semi_major_axis_au: 0.00511   # 764,000 km（50 R_S）
    eccentricity: 0.30
    inclination_deg: 151.0        # 逆行不规则（~29° 逆行）
    longitude_ascending_node_deg: 65.7   # 不规则群随机面
