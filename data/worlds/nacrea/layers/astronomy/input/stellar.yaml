    name: "巨神星 · Aegis"
    body_type: "planet"
    mass_earth: 508.5             # 1.6 M_J × 317.83 M⊕/M_J
    radius_km: 71355              # 11.2 R⊕
    rotation_period_days: 0.4167  # ~10 小时（远快于卫星公转，确保角动量正向传递；
    #   偏慢于类木行星 ~8h 的原生值——早期巨撞击再倾事件同时减速，见下）
    # 潮汐耗散（弱耗散体制，2026-09-08 REBOUND+潮汐自洽核算裁决 P-B）：k₂≈0.35，
    #   Q≈5×10⁶（k₂/Q≈7×10⁻⁸，比木星实测 1.1×10⁻⁵ 弱 ~150×，在气巨星潮汐理论
    #   不确定带内）。推论：Nacrea 外迁 ~0.8 cm/yr；自由倾角阻尼时标 ≫ 系统年龄
    #   → 18° 倾角为早期巨撞击化石，无需持续维持机制；Aegis 自转 5.9 Gyr 减慢 <1%。
    axial_tilt_deg: 18.0          # 自转轴倾角（早期巨撞击设定；金星式撞击减速类比）。
    #   Nacrea 初始贴此赤道面出发，绕拉普拉斯面 ~10 yr 锥摆（出路 b，见 orbits 注）；
    #   气候层季节倾角 = Nacrea i_ecl 长期均值 14.9°（非本值的直接函数）。
    #   自转轴处 Cassini 态：自由进动 ~605 yr，跟随轨道面慢进动、倾角恒定（土星类比）。
    albedo: 0.343                 # 类木星 Bond albedo（与 planets.yaml 对齐）
    j2: 0.008                     # 归一化四极矩（1.6 M_J 快自转类木值；认证的长期算子标度）
    k2_over_q: 7.0e-8             # 弱耗散 P-B 包（k₂≈0.35, Q≈5×10⁶；2026-09-08 裁决）。
    #   引擎派生量（Nacrea 外迁 ~0.8 cm/yr、拉普拉斯半径 ~5.0e5 km、自转进动 ~605 yr）
    #   由 system_catalog 计算
    c_over_mr2: 0.26              # 主惯量系数（类木行星 Darwin–Radau，木星 0.254 同级）

