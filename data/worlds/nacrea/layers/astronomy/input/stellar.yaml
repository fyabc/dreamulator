  # ---- Umbra = 潜在宜居冰卫星（半径 0.75 R⊕，作者裁决 2026-10-08 定尺寸，
  #   解耦构型认证见 design-notes/0004）：非共振受迫地板 e≈0.002–0.004
  #   （恒星四极矩 + 伴星世俗），潮汐加热 ~0.02–0.13 W/m²（冰壳口径
  #   k₂/Q=2.5e-3；唯一计算项）+ 放射性 ~6.5 mW/m²（量级估算：岩石份额
  #   × 5.9 Gyr 硅酸盐产热率标定，±2×）+ 分异/吸积余热 ~10 mW/m²（冷却
  #   时标量级估算）→ 总热流 ~35–80 mW/m²：厚冰壳下海洋长期维持、弱冰火山——温和潮汐暖冰月。
  #   WHFast 2 Myr × 四初相全绿。
  - body_id: satellite_umbra
    parent_id: planet_boreal
    semi_major_axis_au: 0.00380   # 569,000 km（9.4 R_B = 0.121 r_H，4.7× 洛希），P≈3.9 d
