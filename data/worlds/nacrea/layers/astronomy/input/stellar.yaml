  - id: satellite_umbra
    name: "玄冰星 · Umbra"         # 沧卫二
    body_type: "natural_satellite"
    mass_earth: 0.1421              # ρ≈1856 kg/m³ 保持（冰岩分异）
    radius_km: 4778.0               # 0.75 R⊕（0.6–0.85 R⊕ 潜在宜居带中值；作者本意尺寸 10-08 落定）
    rotation_period_days: 3.90    # 同步自转
    axial_tilt_deg: 0.0
    albedo: 0.43
    k2_over_q: 2.5e-3               # 冰壳口径（受迫地板 e≈0.003 → 潮汐加热 ~0.02–0.13 W/m²）
    description:
      surface: "沧星卫星链中最大的一颗（半径约 4800 公里），也是系统内最重要的潜在宜居世界：温和的潮汐加热与内部放射性热流在全球冰壳之下长期维持着液态水海洋，表面散布弱活动的冰火山与古老的冰裂谷遗迹；表层带有晚期散射期陨击带来的矿物与有机物沉积，并拥有微弱的自身磁场。凭借稳定的环境、丰富的水与地热梯度，它是文明第二基地计划的首选目标；随着冰壳与海洋在数十亿年间持续演化，遥远未来也可能成为生命与定居的候选环境。"

  - id: satellite_sleet
    name: "霜冰星 · Sleet"         # 沧卫三
    body_type: "natural_satellite"
    mass_earth: 0.002
    radius_km: 949.9                # 0.149 R⊕
    rotation_period_days: 9.97    # 同步自转
