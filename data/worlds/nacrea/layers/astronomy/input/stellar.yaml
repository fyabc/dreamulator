    rotation_period_days: 0.72    # ~17 小时
    axial_tilt_deg: 5.0
    albedo: 0.25
    description:
      surface: "冰巨星，H₂-He 大气富含 CH₄，深青色；墟带内缘的雕刻者"

  # ---- 行星 VI：藩星（散射遗孤） ----
  - id: planet_sentinel
    name: "藩星 · Sentinel"
    body_type: "planet"
    mass_earth: 8.5
    radius_km: 15290              # 2.4 R⊕
    rotation_period_days: 0.625   # ~15 小时
    axial_tilt_deg: 15.0
    albedo: 0.20                  # 冰质表面
    description:
      surface: "远轨道冰质散射体，近日点 3.12 AU / 远日点 4.48 AU，保留原行星盘外层原始冰质成分；墟带外缘雕刻者，自带稳定特洛伊「伴行营」"

  # ---- 墟带矮行星（2026-09-28 新增；群体见墟带 design-note） ----
  - id: dwarf_relic
    name: "璞星 · Relic"
