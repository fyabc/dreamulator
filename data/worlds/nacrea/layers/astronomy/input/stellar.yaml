    inclination_deg: 168.821896
    longitude_ascending_node_deg: 290.545652
    argument_of_periapsis_deg: 117.95592
    mean_anomaly_epoch_deg: 164.805827
    epoch_year: 0.0

  # ---- 逆行捕获卫：Vigil（守珠，Charon 级，早期捕获；内迁 1800k 标称构型） ----
  # a≈1,747,000 km（历元 osculating；标称 1800k = 0.37 r_H）：内迁削弱恒星潮汐
  # e 泵浦、延寿并改善热流（Stage A/B/D 93 票矩阵结论）。三角 Ω/ω/M = 10-07
  # 定版重采样值（路线 1 强混沌重抽，2026-10-07 作者裁决「定版抽签 + 叙事豁免」；
  # 相位 6 + 韵珠扰动 9 抽系综无热流带内更优构型）。30 kyr 认证：e 带（当代段
  # p5–p95）0.099–0.228 → Hut 伪同步自转中值 ~10.2 d（随 e 带 9.0–11.1 d 呼吸）；
  # a/r_H ≤ 0.453（守卫 0.49）认证全窗有界存活（长期动力学审计见 design-notes/0009 §2）。
  - body_id: satellite_vigil
    parent_id: planet_aegis
    semi_major_axis_au: 0.0116769194
    eccentricity: 0.11903554
    inclination_deg: 170.079498
    longitude_ascending_node_deg: 178.12836
    argument_of_periapsis_deg: 242.650103
    mean_anomaly_epoch_deg: 330.18051
    epoch_year: 0.0

  # ---- Crucible 捕获小卫星（火卫一类比） ----
  - body_id: satellite_cinder
    parent_id: planet_crucible
    semi_major_axis_au: 0.000114  # 17,000 km（2.8 R_C），P≈0.27 d
    eccentricity: 0.02
    inclination_deg: 1.5          # 近赤道捕获（Crucible 倾角 0 → 赤道面≈黄道面）
    longitude_ascending_node_deg: 242.8
    argument_of_periapsis_deg: 322.8
    mean_anomaly_epoch_deg: 164.449246
    epoch_year: 0.0

  # ---- Boreal 卫星链（3 颗冰质规则卫星） ----
  - body_id: satellite_frostine
    parent_id: planet_boreal
    semi_major_axis_au: 0.00239   # 357,000 km（5.9 R_B），P≈1.95 d
    eccentricity: 0.001
    inclination_deg: 2.0          # 规则卫星，贴 Boreal 赤道面（倾角 2°）
    longitude_ascending_node_deg: 11.5   # Boreal 赤道交点（三卫共享）
    argument_of_periapsis_deg: 0.0   # 近圆，近点无定义
    mean_anomaly_epoch_deg: 55.174454
    epoch_year: 0.0

