    radius_km: 750
    rotation_period_days: 0.479   # ~11.5 h（未潮汐演化）
    axial_tilt_deg: 8.0
    albedo: 0.10                  # 托林压暗的原始表面
    description:
      surface: "墟带主带最大天体（未琢之玉）：散射期以来未经加工的原始冰岩分异体，托林深染；位于 Glacis 2:1 与 5:2 共振之间的干净窗"

  - id: dwarf_rime
    name: "皚星 · Rime"
    body_type: "dwarf_planet"
    mass_earth: 1.87e-3           # D≈2200 km，ρ≈2.0 g/cm³
    radius_km: 1100
    rotation_period_days: 0.621   # ~14.9 h
    axial_tilt_deg: 12.0
    albedo: 0.55                  # CO₂/H₂O 霜（56–76 K 冷俘新鲜表面）
    description:
      surface: "外散射盘过渡带的亮霜巨体：q=4.70 AU 略出 Sentinel 远日点，Gyr 级寿命但属缓慢加工中的暂现种群；高反照 CO₂/H₂O 霜面"

  - id: dwarf_russet
    name: "赭星 · Russet"
    body_type: "dwarf_planet"
    mass_earth: 3.08e-4           # D≈1300 km，ρ≈1.6 g/cm³
    radius_km: 650
    rotation_period_days: 0.408   # ~9.8 h
    axial_tilt_deg: 20.0
    albedo: 0.08                  # 深红托林（Gyr 辐照）
    description:
      surface: "深外缘红褐色化石（e=0.60，远日点 20.7 AU / 36 K）：Gyr 级辐照的深红托林表面；N₂·CH₄ 霜在远日点凝覆、近日点侧升华迁移——随轨道相位往返的季节性霜迁"

  # ---- 宜居卫星：Nacrea（珠母星） ----
  - id: satellite_nacrea
    name: "珠母星 · Nacrea"
    body_type: "natural_satellite"
    mass_earth: 1.20
    radius_km: 6817               # 1.07 R⊕
    rotation_period_days: 3.1336  # 恒星自转日（近同步，26-10-11 定版 500 kyr 实测）；太阳日 ≈3.24 地球日
    axial_tilt_deg: 19.9          # 恒星季节角时权均（26-10-11 定版主窗 161–500 kyr 实测 19.85）；长期
    #   波动带 17.55–22.05（约 8.39 地球年「季幅潮」主谱峰 ≈ 30.7 当地年，另见
    #   long_term_cycles）——波动时标 ≫ 气候响应时间 → 气候层读均值 + 登记波动带
    albedo: 0.30
    j2: 0.0008                    # 永久形状 J₂（0014 定案）；高于流体静力平衡值，需冻结隆起之类的形状保存
    #   机制（月球化石 J₂ 约 2×10⁻⁴、火星约 2×10⁻³ 为参照），模型未单独建模，见 0014 §8
    c_over_mr2: 0.33              # 惯量系数 C/MR²（26-10-11 定版成熟态）
    k2_over_q: 4.5e-4             # k₂=0.20, Q≈445（0014 定案的 CTL 0.45 倍在对数上平分给 k₂ 与 Q；
    #   Q 的依据是 3.138 d 潮周期远离洋盆共振、固体本体耗散为主，陆架耗散为次，岩质 Q
    #   文献带 100–500 内，辩护全文 physical_params.md / tidal_effects.md）。τ_e≈9 Myr ≪ 系统年龄。
    #   CTL 时滞 k2tau = 6.16×10⁻⁷ yr（参考值 1.368×10⁻⁶ yr 的 0.45 倍）——k₂/Q 仅在 n_ref
    #   约定下与 CTL 映射；潮汐热流的长期统计见 0014 §2。
    love_k2: 0.20                 # 洛夫数 k₂（比地球的 0.30 略刚，岩质行星常见 0.15–0.35）
    love_h2: 0.40                 # 洛夫数 h₂（与 k₂ 等比例下调，h₂/k₂ 保持地球的约 2）
    description:
      surface: "宜居卫星，表面约 70% 被海洋覆盖。潮汐加热驱动板块构造与碳-硅酸盐循环，是长期气候稳定的能量来源。"

  # ---- 逆行捕获卫：Cadence（韵珠，Europa 个头，P≈6.54 d） ----
  - id: satellite_cadence
    name: "韵珠星 · Cadence"
    body_type: "natural_satellite"
    mass_earth: 0.006             # 早期捕获（~0.5 Gyr，Sentinel 散射期）；长期摄动维持 Nacrea 受迫偏心率
    radius_km: 1436.6             # 0.2255 R⊕（Europa 大小），ρ≈2884 kg/m³ 保持
    #   （「Europa 个头、Europa 成分」：岩质 + 深部水层）
    rotation_period_days: 6.54    # 同步自转（t_lock ~Myr ≪ 年龄，锁定概率 ≈100%）
    axial_tilt_deg: 0.0           # 自转轴 ⊥ 轨道面
    albedo: 0.13                  # 红褐暗珠：原生托林 + Gyr 辐照 + 等离子体溅射（土卫八/D 型类比）
    description:
      surface: "韵珠是一颗逆行捕获的岩质卫星，半径约 1437 公里。表面因托林沉积、长期辐照与等离子体溅射而呈红褐色并显著暗化；深部冰层在自身隔热下长期保留。它的长期摄动是维持珠母星潮汐加热（进而维持板块构造）的主要泵浦源之一。从珠母星看，近合时是一颗约 22 角分宽（0.69 倍满月）、亮度约本地满月三分之一（视星等 −11.5）的暗红巨珠，稳居夜空第二；其偏心率带温和，火山活动总体处于间歇期，与珠母星的文明长期相伴。"

  # ---- 逆行捕获卫：Vigil（守珠，Charon 级，P≈11.8 d） ----
  - id: satellite_vigil
    name: "守珠星 · Vigil"
    body_type: "natural_satellite"
    mass_earth: 3.05e-4           # Charon 级（Charon 2.66e-4 M⊕）；ρ=1870 kg/m³ 由质量/半径自动导出
    radius_km: 615                # 0.0965 R⊕（与 planets.yaml 对齐），卡戎大小
    rotation_period_days: 10.2    # Hut 伪同步中值（随 e 带 0.099–0.228 在 9.0–11.1 d
    #   漂移——「呼吸锁定」；锁定概率 ≈100%）
    axial_tilt_deg: 0.0           # 自转轴 ⊥ 轨道面
    albedo: 0.313                 # Charon 型处理水冰的 HZ 辐照压暗版（p=0.209）
    description:
      surface: "守珠是一颗冰岩质捕获卫星，半径 615 公里，表面年龄约 50 亿年，覆盖着辐照处理过的结晶水冰与托林斑块，呈中灰微蓝色。它位于内迁构型（约 0.37 个希尔半径）处；从珠母星看，近合时是视直径约 4.1 角分、视星等约 −8.8 的亮珠。它的自转周期随轨道偏心率摆动在 9.0–11.1 天之间漂移，从珠母星测光变曲线即可察觉。它的轨道距离长期有界，与珠母星的文明长久相伴。"

  # ---- Crucible 捕获小卫星 ----
  - id: satellite_cinder
    name: "焦砾星 · Cinder"        # 鼎卫一
    body_type: "natural_satellite"
    mass_earth: 1.8e-9
    radius_km: 11.15              # 0.0017 R⊕（与 planets.yaml 对齐）
    rotation_period_days: 0.27    # 同步自转
    axial_tilt_deg: 0.0
    albedo: 0.071
    description:
      surface: "捕获小卫星，暗色不规则岩体"

  # ---- Boreal 卫星链 ----
  - id: satellite_frostine
    name: "凝冰星 · Frostine"      # 沧卫一
    body_type: "natural_satellite"
    mass_earth: 0.008
    radius_km: 1554.5               # 0.243 R⊕
    rotation_period_days: 2.17    # 同步自转
    axial_tilt_deg: 0.0
    albedo: 0.67
    description:
