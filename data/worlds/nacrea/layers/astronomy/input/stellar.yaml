# Nacrea 恒星系统 — 6 行星 + 3 卫星（Aegis 系统）
# 行星层：Aegis : Boreal : Glacis = 1:2:4 周期通约链（共振邻接；φ_L 循环，1 Myr 实测）
# 卫星层：Nacrea（宜居内卫）+ 双单体逆行捕获卫韵珠/守珠（长期摄动维持 Nacrea
# 受迫偏心率，见 design-notes/0009）
# 以光度为自变量（混合输入模式），引擎通过数值反演推算质量
name: "Nacrea System"

description: |
  系统形成史（基于 Izidoro et al. 2017 共振链迁移理论，四阶段演化）：

  阶段 1 — 核吸积期 (0–5 Myr)
  - 水雪线 (~0.5 AU) 外侧冰质星子快速吸积，形成 ~10 M⊕ 固态核心
  - 触发失控气体吸积，3–5 Myr 内增长至 1.6 M_J (Aegis)
  - 雪线内侧仅形成 0.1–1.0 M⊕ 岩石胚胎，未达气态吸积临界质量

  阶段 2 — II 型迁移与共振捕获 (5–10 Myr)
  - Aegis 与原行星盘交换角动量，从 ~0.5 AU 内迁至宜居带中心 (0.3536 AU)
  - 外缘两颗胚胎被"牧羊犬效应"推动，发生会聚迁移
  - 穿过 2:1 / 4:1 共振后周期比锁定 → Aegis : Boreal : Glacis = 1:2:4 周期通约链
    （共振邻接：盘消散后拉普拉斯角 φ_L 转入循环、无相位锁定，1 Myr N 体实测；
    近共振长期耦合仍维持 Aegis 的 45 kyr 偏心率振荡，见 long_term_cycles.md §3）
  - 迁移扫清 0.05–0.2 AU 区间所有原始胚胎

  阶段 3 — 盘消散后碎片重组 (10–200 Myr)
  - 气体盘消散后，Aegis 轨道内侧残余星子缓慢吸积，重组为两颗小岩石行星 (Ember, Crucible)
  - 一颗散射体被弹射至远轨道 (Sentinel, e=0.18, i=7°)

  阶段 4 — 长期潮汐演化与外卫捕获 (200 Myr–6 Gyr)
  - 内行星被恒星潮汐锁定
  - Nacrea 在 Aegis 子盘中形成并缓慢外迁至 724,000 km（潮汐演化，形成以来 +10%）
  - Sentinel 散射期（~0.5 Gyr）先后暴力捕获两颗逆行外卫星：Cadence（韵珠）与
    Vigil（守珠）——互相独立的单体捕获，非共振、非绑定（F12/F14/F23 血统，
    见 design-notes/0009）
  - 韵珠/守珠的长期摄动维持 Nacrea 的受迫偏心率（否则潮汐阻尼将在 ~Myr 尺度
    抹平），驱动潮汐加热 → 板块构造与碳-硅酸盐循环
  - 系统进入当前稳定态

stars:
  - id: star_ignis
    name: "烬星 · Ignis"
    spectral_class: K8           # 按质量 M=0.59（K8）；T_eff≈4055 K
    luminosity_class: V
    mass: 0.59                 # M☉ 自变量（双输入；MLR 偏差 ~3%）
    luminosity: 0.0761        # L☉ 自变量；T≈4055 K（调低 2%），光照 0.61×地球
    metallicity: 0.0
    age_gyr: 5.90
    position:
      x: 0.0
      y: 0.0
      z: 0.0

orbits:
  # 轨道根数自然化散布（2026-09-10，seed 20260910，规则：距 90° 整数倍 <10° 重抽）：
  # 非认证天体的 Ω/ω/M₀ 为散布值（此前全 0 = 交点共线/近点对齐/历元合排的默认值伪影）；
  # 规则卫星系共享父行星赤道交点（Boreal 三卫 Ω=11.5°、Glacis Shard Ω=20.3°，
  # 自转极方位未编码，约定极向随卫星交点）；ω 仅对 e≥0.02 天体散布（近圆轨道近点无定义）。
  # 不动名单：共振链三行星 M₀（φ_L 相位，1 Myr 验证）、Aegis argp=90°（近日点对齐北夏至）、
  # Aegis 系三卫星全要素（A4v 认证实现）、链内行星 i≈0（迁移共面化，物理理由）。
  # ---- 内行星（Aegis 迁移后残余碎片重组） ----
  - body_id: planet_ember
    parent_id: star_ignis
    semi_major_axis_au: 0.046
    eccentricity: 0.005           # 5.9 Gyr 恒星潮汐圆化残余（TRAPPIST-1b 类比）
    inclination_deg: 0.8          # 内残余吸积的小互倾角（水星 7° 同类，缩放版）
    longitude_ascending_node_deg: 324.9
    argument_of_periapsis_deg: 0.0   # e=0.005 近圆，近点无定义
    mean_anomaly_epoch_deg: 138.6
    epoch_year: 0.0

  - body_id: planet_crucible
    parent_id: star_ignis
    semi_major_axis_au: 0.098
    eccentricity: 0.010           # 距恒星较远，潮汐圆化效率低于 Ember
    inclination_deg: 0.4
    longitude_ascending_node_deg: 157.3
    argument_of_periapsis_deg: 0.0   # e=0.010 近圆，近点无定义
    mean_anomaly_epoch_deg: 198.0
    epoch_year: 0.0

  # ---- 气态巨行星（宜居带，混合变暖校准后位置） ----
  - body_id: planet_aegis
    parent_id: star_ignis
    semi_major_axis_au: 0.3536    # 年长 100 天（M=0.59 + 光照 0.66 反推）
    eccentricity: 0.03            # 距离季（受迫偏心率，GJ 876 共振链类比；用户终裁「0.03 够用」——e=0/0.03 A/B 验证信号确认）
    inclination_deg: 0.0
    longitude_ascending_node_deg: 0.0
    argument_of_periapsis_deg: 90.0  # 近日点对齐北夏至（ϖ=90°）：距离季与倾角季同相 → 北半球季节增强、南半球削弱
    mean_anomaly_epoch_deg: 0.0
    epoch_year: 0.0

  # ---- 共振链（会聚迁移捕获，1:2:4 拉普拉斯共振） ----
  - body_id: planet_boreal
    parent_id: star_ignis
    semi_major_axis_au: 0.5614    # 2:1 with Aegis → 0.3536 × 2^(2/3)（随链同步外移）
    eccentricity: 0.010           # 2:1 MMR 强制偏心率（GJ 876 共振链类比）
    inclination_deg: 0.0
    longitude_ascending_node_deg: 0.0
    argument_of_periapsis_deg: 0.0
    mean_anomaly_epoch_deg: 0.0
    epoch_year: 0.0

  - body_id: planet_glacis
    parent_id: star_ignis
    semi_major_axis_au: 0.8911    # 4:1 with Aegis → 0.3536 × 4^(2/3)（随链同步外移）
    eccentricity: 0.015           # Laplace 共振链最外端强制偏心率最高
    inclination_deg: 0.0
    longitude_ascending_node_deg: 0.0
    argument_of_periapsis_deg: 0.0
    mean_anomaly_epoch_deg: 0.0
    epoch_year: 0.0

  # ---- 远轨道散射体（Aegis 迁移弹射遗孤） ----
  - body_id: planet_sentinel
    parent_id: star_ignis
    semi_major_axis_au: 3.68
    eccentricity: 0.18            # 高偏心率 — 散射弹射的直接证据
    inclination_deg: 7.0          # 高倾角 — 散射弹射的直接证据
    longitude_ascending_node_deg: 326.0   # 散射事件随机化 Ω/ω/M（散布 pass）
    argument_of_periapsis_deg: 280.3
    mean_anomaly_epoch_deg: 116.0
    epoch_year: 0.0

  # ---- 宜居卫星（环绕 Aegis；外卫星为逆行捕获双珠，见 design-notes/0009） ----
  # 卫星轨道根数基准面 = 日心黄道面（Aegis 公转轨道面）；Aegis 赤道面在本系中
  # 由 Nacrea 轨道面定义（obliquity 9°、交点 Ω=0）。赤道系换算见 design-notes/0009。
  - body_id: satellite_nacrea
    parent_id: planet_aegis
    semi_major_axis_au: 0.00484   # 724,000 km（Vigil 在 0.40 r_H）
    eccentricity: 0.0018          # 历元值；受韵珠/守珠长期摄动在受迫带内振荡
    # （A4v 认证 33 kyr 健康切片：rms 0.0035、p5–p95 0.0008–0.0059、瞬时极值 0.009；
    # 主调制周期 11 kyr = 「万年火山脉冲」；加热 ≈7.5e4·e² W/m² → 均值 ~0.9、
    # 短期尖峰 ~6，红线 rms 0.006=2 W/m² 之内；线性标定 coef=2.64e-3 与
    # 硬度豁免见 design-notes/0009 §2–3 与重开章）
    inclination_deg: 9.0          # 赤道面轨道：规则卫星在行星子盘里形成，天然贴着行星赤道面；
    # 相对黄道的 9° 来自 Aegis 的自转轴倾角。轨道面动力学：这个距离上恒星扭矩已强于行星
    # 四极矩扭矩约 14 倍，平衡面（Laplace 面）几乎贴黄道，所以赤道面构型带有 8.35° 自由倾角，
    # 以约 4.7 年周期绕平衡面摆动（相对黄道 7.7°↔9°）。维持机制（P-B 潮汐包）：早期巨撞击
    # （Sentinel 散射期）撞出 9° 倾角并减速 Aegis 自转至 10h；Aegis 弱潮汐耗散（k₂/Q≈7×10⁻⁸）
    # 把倾角阻尼时标拉到 ~150–300 Gyr ≫ 系统年龄 5.9 Gyr，构型为冻结化石，
    # 见 design-notes/0009 与本文件 Aegis 弱耗散声明注释。
    longitude_ascending_node_deg: 0.0
    argument_of_periapsis_deg: 0.0
    mean_anomaly_epoch_deg: 0.0
    epoch_year: 0.0

  # ---- 逆行捕获卫：Cadence（韵珠，早期捕获 ~0.5 Gyr，Sentinel 散射期） ----
  # Gyr 级准可积：单体远距逆行（无交叉伙伴、恒星潮汐仅有界 e 摆动、无耗散通道），
  # F12/F14/F23 血统。与 Nacrea 周期比 2.13（脱离 2:1 约 2.4 个共振宽度）；
  # 与守珠 2.40（仅七阶 12:5，耦合 ∝ e⁷ 免疫）。
  # 轨道面 = 精确逆行赤道面（Ω=180° 与 Nacrea 轨道面共面反向）——赤道化石：
  # Aegis 弱潮汐耗散（k₂/Q≈7e-8）把自由倾角阻尼时标拉到 ≫ 系统年龄。
  # ⚠ 认证实现要素（A4v，IAS15+J2+潮汐，48.0 kyr）：改动任何字段前必须重跑认证，
  # 见 design-notes/0009 §5 工程红线与重开章。
  - body_id: satellite_cadence
    parent_id: planet_aegis
    semi_major_axis_au: 0.0080213904  # 1,200,000 km = 0.245 r_H；P=6.715 d
    eccentricity: 0.005           # 历元值；长期摆动 0.04–0.11 有界（p5–p95 包络；极端
    # excursion 0.006–0.138 各 <5% 时间；11/16.5 kyr 双频呼吸。A4v 认证 33 kyr 健康切片）
    inclination_deg: 171.0        # 黄道系；工程 Kozai 边界之外（存活要求 i≥171，见 0009 κ 律），摆动 170.3–178.2°
    longitude_ascending_node_deg: 180.0  # 精确逆行赤道面（赤道化石）——认证实现要素，勿改
    argument_of_periapsis_deg: 0.0
    mean_anomaly_epoch_deg: 0.0         # 认证实现要素，勿改
    epoch_year: 0.0

  # ---- 逆行捕获卫：Vigil（守珠，Charon 级小卫，早期捕获） ----
  # 0.44 r_H 逆行（安全线 0.5 内，F14 @0.458 r_H 血统；A4v 认证摆动 0.434–0.520）；
  # 与韵珠径向净空设计值 ~160k km ≈ 4.8 r_H,m。
  # 轨道面贴黄道面偏 4°（i=176°）——拉普拉斯面远端平衡态（4.3 r_L，恒星四极矩
  # 主导区），天王星不规则卫星实证类比；与韵珠赤道面构成 5–13° 互倾角，
  # 以 4.2 yr 拍频弱振荡（连珠季节律，见 sky_phenomena.md）。
  # 自转：已潮汐锁定（t_lock 28–86 Myr ≪ 5.4 Gyr，概率 ≈100%）；因恒星潮汐
  # e 摆动（0.07–0.34 包络，极端 0.01–0.46，A4v 认证）处于 Hut 伪同步：自转周期在
  # 10–16 d 间漂移（「呼吸锁定」）。
  - body_id: satellite_vigil
    parent_id: planet_aegis
    semi_major_axis_au: 0.0143716578  # 2,150,000 km = 0.44 r_H；P=16.10 d
    eccentricity: 0.02            # 历元值；长期摆动 0.07–0.34 有界（p5–p95 包络；极端
    # 0.010–0.461。A4v 认证 33 kyr 健康切片）
    inclination_deg: 176.0        # 黄道系（离黄道面 4°）；摆动 174.0–176.1°（A4v 认证）
    longitude_ascending_node_deg: 0.0   # 认证实现要素，勿改
    argument_of_periapsis_deg: 0.0
    mean_anomaly_epoch_deg: 90.0        # 认证实现要素，勿改
    epoch_year: 0.0

  # ---- Crucible 捕获小卫星（火卫一类比） ----
  - body_id: satellite_cinder
    parent_id: planet_crucible
    semi_major_axis_au: 0.000114  # 17,000 km（2.8 R_C），P≈0.27 d
    eccentricity: 0.02
    inclination_deg: 1.5          # 近赤道捕获（Crucible 倾角 0 → 赤道面≈黄道面）
    longitude_ascending_node_deg: 242.8
    argument_of_periapsis_deg: 322.8
    mean_anomaly_epoch_deg: 74.7
    epoch_year: 0.0

  # ---- Boreal 卫星链（3 颗冰质规则卫星） ----
  - body_id: satellite_frostine
    parent_id: planet_boreal
    semi_major_axis_au: 0.00239   # 357,000 km（5.9 R_B），P≈1.95 d
    eccentricity: 0.001
    inclination_deg: 2.0          # 规则卫星，贴 Boreal 赤道面（倾角 2°）
    longitude_ascending_node_deg: 11.5   # Boreal 赤道交点（三卫共享，散布 pass）
    argument_of_periapsis_deg: 0.0   # 近圆，近点无定义
    mean_anomaly_epoch_deg: 158.1
    epoch_year: 0.0

  - body_id: satellite_umbra
    parent_id: planet_boreal
    semi_major_axis_au: 0.00380   # 569,000 km（9.4 R_B），P≈3.9 d
    eccentricity: 0.002
    inclination_deg: 2.0
    longitude_ascending_node_deg: 11.5   # Boreal 赤道交点（三卫共享）
    argument_of_periapsis_deg: 0.0
    mean_anomaly_epoch_deg: 295.8
    epoch_year: 0.0

  - body_id: satellite_sleet
    parent_id: planet_boreal
    semi_major_axis_au: 0.00607   # 908,000 km（15 R_B），P≈7.9 d
    eccentricity: 0.003
    inclination_deg: 2.5
    longitude_ascending_node_deg: 11.5   # Boreal 赤道交点（三卫共享）
    argument_of_periapsis_deg: 0.0
    mean_anomaly_epoch_deg: 127.2
    epoch_year: 0.0

  # ---- Glacis 卫星 — 规则内卫星 + 逆行捕获外卫星 ----
  - body_id: satellite_shard
    parent_id: planet_glacis
    semi_major_axis_au: 0.00165   # 247,000 km（10 R_G），P≈3.4 d
    eccentricity: 0.01
    inclination_deg: 5.0          # 规则卫星 = 贴 Glacis 赤道面（倾角 5°；散布 pass 修正原 2° 失配）
    longitude_ascending_node_deg: 20.3   # Glacis 赤道交点
    argument_of_periapsis_deg: 0.0   # 近圆，近点无定义
    mean_anomaly_epoch_deg: 297.2
    epoch_year: 0.0

  - body_id: satellite_rogue
    parent_id: planet_glacis
    semi_major_axis_au: 0.00496   # 742,000 km（30 R_G），P≈17.8 d
    eccentricity: 0.30            # 轨道扁（捕获）
    inclination_deg: 157.0        # 逆行
    longitude_ascending_node_deg: 32.2   # 捕获随机化 Ω/ω/M（散布 pass）
    argument_of_periapsis_deg: 10.4
    mean_anomaly_epoch_deg: 210.9
    epoch_year: 0.0

  # ---- Sentinel 不规则捕获群（散射遗孤） ----
  - body_id: satellite_vagrant
    parent_id: planet_sentinel
    semi_major_axis_au: 0.00307   # 459,000 km（30 R_S）
    eccentricity: 0.15
    inclination_deg: 28.0         # 不规则（顺行）
    longitude_ascending_node_deg: 164.1   # 不规则群随机面（散布 pass）
    argument_of_periapsis_deg: 75.0
    mean_anomaly_epoch_deg: 198.9
    epoch_year: 0.0

  - body_id: satellite_guest
    parent_id: planet_sentinel
    semi_major_axis_au: 0.00511   # 764,000 km（50 R_S）
    eccentricity: 0.30
    inclination_deg: 151.0        # 逆行不规则（~29° 逆行）
    longitude_ascending_node_deg: 65.7   # 不规则群随机面（散布 pass）
    argument_of_periapsis_deg: 51.8
    mean_anomaly_epoch_deg: 289.4
    epoch_year: 0.0

bodies:
  # ---- 行星 I：焦星 ----
  - id: planet_ember
    name: "焦星 · Ember"
    body_type: "planet"
    mass_earth: 0.35
    radius_km: 4014               # 0.63 R⊕ — ρ=7.8 g/cm³（铁核残骸 + 重力压缩）
    rotation_period_days: 5.37    # 潮汐锁定于恒星
    axial_tilt_deg: 0.0
    albedo: 0.10                  # 裸露金属表面
    description:
      surface: "被剥夺大部分地幔的铁核残骸（ρ=7.8 g/cm³），昼侧灼热裸露岩石（380-504°C），铅锌矿脉半熔融；夜侧凝固金属霜，无大气"

  # ---- 行星 II：鼎星 ----
  - id: planet_crucible
    name: "鼎星 · Crucible"
    body_type: "planet"
    mass_earth: 0.90
    radius_km: 6180               # 0.97 R⊕
    rotation_period_days: 16.6    # 潮汐锁定于恒星
    axial_tilt_deg: 0.0
    albedo: 0.15                  # 暗色玄武岩表面
    description:
      surface: "90 bar CO₂ 超临界温室大气，表面 ~620 K，玄武岩平原与硫磺湖泊"

  # ---- 行星 III：神盾（气态巨行星） ----
  - id: planet_aegis
    name: "巨神星 · Aegis"
    body_type: "planet"
    mass_earth: 508.5             # 1.6 M_J × 317.83 M⊕/M_J
    radius_km: 71355              # 11.2 R⊕
    rotation_period_days: 0.4167  # ~10 小时（远快于卫星公转，确保角动量正向传递；
    #   偏慢于类木行星 ~8h 的原生值——早期巨撞击再倾事件同时减速，见下）
    # 潮汐耗散（弱耗散体制，2026-09-08 REBOUND+潮汐自洽核算裁决 P-B）：k₂≈0.35，
    #   Q≈5×10⁶（k₂/Q≈7×10⁻⁸，比木星实测 1.1×10⁻⁵ 弱 ~150×，在气巨星潮汐理论
    #   不确定带内）。推论：卫星外迁 ~0.8 cm/yr（形成以来累计 +10%，与
    #   satellite_architecture.md 一致）；自由倾角/4.7yr 摆动阻尼时标 ~80 Gyr ≫
    #   系统年龄 → 9° 构型为早期巨撞击化石（与 Sentinel 散射同期、Nacrea 冷却期），
    #   无需持续维持机制；Aegis 自转 5.9 Gyr 减慢 <1%。
    axial_tilt_deg: 9.0           # 自转轴倾角（早期巨撞击设定；金星式撞击减速类比）。Nacrea 走赤道面轨道，
    # 所以 Nacrea 相对黄道的有效倾角就是这 9°，它驱动季节。自转轴的自由进动周期约 550 年，
    # 与轨道面交点进动（约 1.2 千年）同量级，因此合理推断 Aegis 处于 Cassini 态：
    # 自转轴跟着轨道面一起进动、倾角保持恒定（土星即此状态）。详见 orbital_dynamics.md。
    albedo: 0.343                 # 类木星 Bond albedo（与 planets.yaml 对齐）
    j2: 0.008                     # 归一化四极矩（1.6 M_J 快自转类木值；0009 认证的长期算子标度）
    k2_over_q: 7.0e-8             # 弱耗散 P-B 包（k₂≈0.35, Q≈5×10⁶；2026-09-08 REBOUND+潮汐自洽核算裁决）。
    #   引擎派生量（Nacrea 外迁 ~0.7 cm/yr、拉普拉斯半径 ~5.0e5 km、自转进动 ~605 yr）由 system_catalog 计算
    c_over_mr2: 0.26              # 主惯量系数（类木行星 Darwin–Radau，木星 0.254 同级；自转进动 ~604 yr 输入）

