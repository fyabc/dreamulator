bodies:
  # ---- 行星 I：焦星 ----
  - id: planet_ember
    name: "焦星 · Ember"
    body_type: "planet"
    mass_earth: 0.35
    radius_km: 4014               # 0.63 R⊕ — ρ=7.8 g/cm³（铁核残骸 + 重力压缩）
    rotation_period_days: 5.37    # 潮汐锁定于恒星
    axial_tilt_deg: 0.0
    albedo: 0.10                  # 裸露金属表面
    description:
      surface: "被剥夺大部分地幔的铁核残骸（ρ=7.8 g/cm³），昼侧灼热裸露岩石（380-504°C），铅锌矿脉半熔融；夜侧凝固金属霜，无大气"

  # ---- 行星 II：鼎星 ----
  - id: planet_crucible
    name: "鼎星 · Crucible"
    body_type: "planet"
    mass_earth: 0.90
    radius_km: 6180               # 0.97 R⊕
    rotation_period_days: 16.6    # 潮汐锁定于恒星
    axial_tilt_deg: 0.0
    albedo: 0.15                  # 暗色玄武岩表面
    description:
      surface: "90 bar CO₂ 超临界温室大气，表面 ~620 K，玄武岩平原与硫磺湖泊"

  # ---- 行星 III：神盾（气态巨行星） ----
  - id: planet_aegis
    name: "巨神星 · Aegis"
    body_type: "planet"
    mass_earth: 508.5             # 1.6 M_J × 317.83 M⊕/M_J
    radius_km: 71355              # 11.2 R⊕
    rotation_period_days: 0.1863539  # 4.4725 h 快自转（26-10-11 定版成熟态）。远快于卫星公转，
    #   角动量正向传递。**机制待实验认证**：吸积遗产 + 收缩加速（角动量近似守恒下半径
    #   收缩使自转加快）为条件性解释，非认证结论（0009 文首披露）。
    # 潮汐耗散（弱耗散体制，2026-09-08 REBOUND+潮汐自洽核算裁决 P-B）：k₂≈0.35，
    #   Q≈5×10⁶（k₂/Q≈7×10⁻⁸，比木星实测 1.1×10⁻⁵ 弱 ~150×，在气巨星潮汐理论
    #   不确定带内）。推论：Nacrea 外迁 ~0.8 cm/yr；自由倾角阻尼时标 ≫ 系统年龄；
    #   Aegis 自转 5.9 Gyr 减慢 <1%。
    axial_tilt_deg: 44.8374718    # 自转轴倾角（26-10-11 定版成熟态）。**机制待实验认证**：
    #   卫星迁移驱动的条件性共振捕获渐进抬高（Saillenfest 类）或早期倾斜子盘为候选
    #   解释；早期巨撞击化石说退役（0009 §5）。高倾角 + Nacrea 在 ~1.05 r_L 处的
    #   拉普拉斯面几何自洽给出恒星季节角 ~19.9°（气候层口径）。
    albedo: 0.343                 # 类木星 Bond albedo（与 planets.yaml 对齐）
    j2: 0.04                      # 归一化四极矩（26-10-11 定版快自转成熟态；旋转流体
    #   内部结构与高阶引力尚未独立核验——0009 文首披露）
    k2_over_q: 7.0e-8             # 弱耗散 P-B 包（k₂≈0.35, Q≈5×10⁶；2026-09-08 裁决）。
    #   引擎派生量（Nacrea 外迁、拉普拉斯半径、自转进动）由 system_catalog 计算。
    #   定版 CTL 参考 k2tau=6.043×10⁻¹² yr（恒星潮汐；与 k₂/Q 映射约定独立）
    c_over_mr2: 0.26              # 主惯量系数（26-10-11 定版成熟态；类木行星 Darwin–Radau 同级）

  # ---- 行星 IV：沧星（共振链 2:1） ----
  - id: planet_boreal
    name: "沧星 · Boreal"
    body_type: "planet"
    mass_earth: 159.3             # 0.5 M_J
