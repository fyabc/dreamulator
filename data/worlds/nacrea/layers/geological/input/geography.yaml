# Nacrea 海陆分布锚定规格（机器可读）
#
# 与 geography.md（2026-08 修改后的不对称混合案）一一对应。地形管线的
# plate 阶段读取本文件，把每个 feature 叠加成逐 cell 的"陆地偏置场"
# ([-1,+1]：正=陆地、负=海洋)，再以全局阈值替代默认的"每板块随机大陆比例"，
# 让命名大陆/大洋真正落到指定位置。构造演化后按 reapply_after_tectonics
# 重新锚定，防止大陆随板块漂移离开锚点。
#
# 字段语义（见 src/dreamulator/map/geography.py）：
#   kind          语义标签（continent/archipelago/plateau/ocean_basin/
#                 rift_sea/shallow_sea/isthmus）
#   lon/lat       锚点中心（度）。极点特征 lon 任意
#   radius_deg    圆半径；拉长特征 = 半短轴（半宽）
#   strength      +1 强陆地 … −1 强海洋
#   elongation             半长轴/半短轴（≥1，1=圆）
#   bearing_deg            半长轴朝向（0=北，90=东）
#
#   可选字段（高程控制，仅 terrain 阶段读取）：
#   elevation_target_m     高程钉扎目标（m，相对海平面）。将 feature 覆盖区域内
#                          的 cell 向该值拉近。正值=压低山体/制造浅海陆桥，
#                          负值=加深海盆。与 pin_strength 配合使用。
#   pin_strength           钉扎强度 [0, 1]。1=完全强制到 target（硬钳），
#                          0.5=中等拉近（保内部起伏），0=无效果。
#                          默认 1。不宜对所有 feature 使用——仅用于关键地质
#                          瓶颈（海峡深度、陆桥高度、大陆平均海拔）。
#   pin_exponent           偏差指数化（>0，默认 1.0）。1.0=线性拉近（和旧行为
#                          一致）；>1=加大高差：山峰被强力下压，平原温和调整。
#                          配合中等 pin_strength 使用（例 0.3+1.5 或 0.4+2.0）。
#   sea_level_offset_m     局部海平面偏移（m，相对全局 sea_level_offset_m）。
#                          正值=抬升局部海平面（淹没陆地/加深浅海），
#                          负值=降低局部海平面（露出更多陆地）。
#                          用途：冰期海退实验、临界海峡门槛值扫描。
#
# 角度→距离换算（R=6817 km，1°≈119 km）：
#   世界岛 0.9×10^8 km² ≈ 表面积 15%；大裂谷海 600 km 宽×8000 km 长。
# 注：以下数值为首轮初值，需在重建后按地貌对照 geography.md 迭代微调。
# 已知局限：shallow_sea 的"浅"（水深<200 m）暂无法由二值地壳表达，
# 需后续海底高程控制；本轮仅保证海陆格局正确。

version: 1
land_fraction_target: 0.28      # 与 terrain_config.target_land_fraction 对齐
hemisphere_land_bias: 0.10      # 北半球偏陆（设定：北半球占 62% 陆地）
reapply_after_tectonics: true   # 构造演化后重锚定，保住正典大陆

features:
  # ---- 陆块（侧点 + 极点）----
  - name: 世界岛
    kind: continent
    lon: -90.0                  # 后随点 ~90°W
    lat: -10.0                  # 中心南移以压缩北方沙漠
    radius_deg: 35.0            # 半短轴；拉长后面积约 15% 表面积
    strength: 0.85              # <裂谷强度，保证裂谷能切开（见大裂谷海）
    elongation: 1.3             # 南北拉伸缩短（1.6→1.3: 北界 56→35°, 南界 −56→−55°）
    bearing_deg: 0.0            # 南北向拉长
    # 与 terrain_config.interior_lowland_* 协同：内部低地已系统性下压大陆深部，
    # 此钉扎把低区锚定在 ~400m（地球陆均高），pin_exponent<1 保护造山带高山。
    elevation_target_m: 400.0
    pin_strength: 0.3
    pin_exponent: 0.6           # 偏差指数化：保护高山，低区拉平到 target

  # ---- 大裂谷海：多段错列（en échelon）裂谷，仿东非大裂谷/红海 ----
  # 不用单一拉长偏置场（会产出笔直经向裂谷）；改用多段沿蜿蜒路径错列排布，
  # 走向左右摆动、宽窄不一，并叠加断块隆起（正场）与异常塌陷（更强负场）。
  # 2026-08-06 v2：用户验证后整体 ×1.7 放大并加强（首版裂谷太弱，碎成湖泊串
  # 而非陆间海）；各段仍拉开幅度，并有东非式分叉（西支）。
  - name: 大裂谷海·南段
    kind: rift_sea
    lon: -92.0
    lat: -25.0
    radius_deg: 5.1             # 宽深海段（红海型）
    strength: -2.6              # 须超过世界岛(+0.85)才能切穿
    noise_amplitude: 1.2
    elongation: 3.0
    bearing_deg: 25.0           # 段轴向左右摆动 → 蜿蜒走向
  - name: 大裂谷海·中南段
    kind: rift_sea
    lon: -88.0
    lat: -11.0
    radius_deg: 3.1             # 窄弱段（半裂谷/夭折裂谷）
    strength: -2.0
    noise_amplitude: 0.8
    elongation: 5.0
    bearing_deg: -30.0
  - name: 大裂谷海·中段
    kind: rift_sea
    lon: -91.5
    lat: -3.0
    radius_deg: 4.4
    strength: -3.0              # 强切穿段
    noise_amplitude: 1.2
    elongation: 3.5
    bearing_deg: 40.0
  - name: 大裂谷海·中北段
    kind: rift_sea
    lon: -87.0
    lat: 8.0
    radius_deg: 2.6             # 最窄段
    strength: -1.8              # 最弱段
    noise_amplitude: 0.8
    elongation: 4.5
    bearing_deg: -15.0
  # 北段与中北段之间的连接裂谷（保持裂谷海连通，增加海岸线曲折度）
  - name: 大裂谷海·中北连接段
    kind: rift_sea
    lon: -87.0
    lat: 13.0
    radius_deg: 1.7             # 小型裂谷，不切太宽
    strength: -1.5              # 弱裂谷，刚好切开即可
    noise_amplitude: 0.8
    elongation: 2.5
    bearing_deg: -10.0
  - name: 大裂谷海·北段
    kind: rift_sea
    lon: -90.5
    lat: 19.0
    radius_deg: 4.9
    strength: -2.4
    noise_amplitude: 0.8
    elongation: 2.6
    bearing_deg: 30.0
  # 西支分叉（仿东非大裂谷 Western Rift：从中段向 WNW 分出）
  - name: 大裂谷海·西支南段
    kind: rift_sea
    lon: -95.5
    lat: -1.0
    radius_deg: 3.2
    strength: -2.2
    noise_amplitude: 0.8
    elongation: 3.0
    bearing_deg: -70.0
  - name: 大裂谷海·西支北段
    kind: rift_sea
    lon: -103.0
    lat: 3.0
    radius_deg: 2.4
    strength: -1.8
    noise_amplitude: 0.8
    elongation: 2.8
    bearing_deg: -75.0
  # 断块隆起（正场小丘，裂谷肩抬升 / 未裂透的断块）
  - name: 裂谷肩断块隆起·南
    kind: plateau
    lon: -85.5
    lat: -9.0
    radius_deg: 2.7
    strength: 0.9               # 弱正场 → 裂谷边缘断块隆起
    noise_amplitude: 0.75
    elongation: 2.4
    bearing_deg: -25.0
  - name: 裂谷肩断块隆起·北
    kind: plateau
    lon: -93.5
    lat: 12.0
    radius_deg: 1.7
    strength: 0.5
    noise_amplitude: 0.75
    elongation: 1.8
    bearing_deg: 20.0
  # ---- 北极周缘裂谷（自转减慢松弛裂缝）----
  # 潮汐锁定过程中自转离心力减弱 → 极点旋转扁率松弛 → 地壳张性裂缝。
  # 这些裂谷切割北极大陆边缘，连通北方内海与外洋。
  - name: 北极周缘裂谷·本初段
    kind: rift_sea
    lon: 11.5
    lat: 59.0
    radius_deg: 2.25
    strength: -2.0
    noise_amplitude: 1.2
    elongation: 3.5
    bearing_deg: 130.0
  - name: 北极周缘裂谷·西段
    kind: rift_sea
    lon: -82.5
    lat: 48.0
    radius_deg: 1.4
    strength: -1.7
    noise_amplitude: 1.5
    elongation: 3.0
    bearing_deg: 25.0
  - name: 北极周缘裂谷·中段
    kind: rift_sea
    lon: -52.0
    lat: 52.0
    radius_deg: 1.4
    strength: -2.0
    noise_amplitude: 1.2
    elongation: 3.5
    bearing_deg: 140.0
  - name: 北极周缘裂谷·远西段
    kind: rift_sea
    lon: -136.3
    lat: 58.5
    radius_deg: 1.2
    strength: -2.0
    noise_amplitude: 1.2
    elongation: 4.0
    bearing_deg: 133.0

  - name: 北方海峡小型断陷1
    kind: rift_sea
    lon: -3.3
    lat: 68.9 
    radius_deg: 1.1
    strength: -0.20
    noise_amplitude: 0.8
    elongation: 1.0
    bearing_deg: 0.0

  # 异常塌陷（更强负场，裂谷内局部深陷 / 拉分盆地）
  - name: 裂谷塌陷盆地·中
    kind: rift_sea
    lon: -84.5
    lat: 2.0
    radius_deg: 2.5
    strength: -3.0              # 比裂谷主体更深 → 局部深陷（模型下限 −3）
    noise_amplitude: 1.5
    elongation: 2.5
    bearing_deg: 15.0
  - name: 裂谷塌陷盆地·北
    kind: rift_sea
    lon: -89.0
    lat: 14.0
    radius_deg: 1.7
    strength: -2.4
    noise_amplitude: 0.8
    elongation: 2.0
    bearing_deg: -18.0

  - name: 前导点褶皱山系
    kind: archipelago
    lon: 94.0
    lat: -2.5
    radius_deg: 6.0
    strength: 1.10
    noise_amplitude: 0.85
    elongation: 1.1
    bearing_deg: 30.0

  - name: 海峡小型断陷1
    kind: rift_sea
    lon: 73.0
    lat: 24.0 
    radius_deg: 1.2
    strength: -0.20
    noise_amplitude: 0.8
    elongation: 4.0
    bearing_deg: 5.0

  - name: 海峡小型断陷2
    kind: rift_sea
    lon: 73.3
    lat: 17.0 
    radius_deg: 0.5
    strength: -0.20
    noise_amplitude: 0.8
    elongation: 1.0
    bearing_deg: 0.0

  - name: 北极大陆
    kind: plateau
    lon: 150.0
    lat: 86.0
    radius_deg: 15.0
    strength: 1.5
    noise_amplitude: 1.45
    elongation: 1.3
    bearing_deg: 46.0
    elevation_target_m: 800.0
    pin_strength: 0.7
    pin_exponent: 0.5


  # ---- 大洋（向星 / 背星点 + 南极浅海）----
  - name: Aegis深渊洋
    kind: ocean_basin
    lon: 0.0                    # 向星点
    lat: 0.0
    radius_deg: 45.0
    strength: -1.0              # 最深海洋
    elongation: 1.0

  # 永耀岛 — 潮汐固定热点火山岛。向星点承受最强潮汐应力→地幔局部熔融→
  # 单一巨型火山在固定位置持续堆积（不同于地球板块飘过热点形成的火山链）。
  # 位于 Aegis 深渊洋中央，Aegis 永悬天顶，为 nacrea 文明传说中的"世界之眼"。
  - name: 永耀岛
    kind: plateau
    lon: 0.5                    # 略偏向星点，不完全重合
    lat: -0.8
    radius_deg: 2.5             # 小型岛屿
    strength: 1.5               # 需克服 Aegis 深渊洋 −1.0 偏置
    noise_amplitude: 0.75
    elongation: 1.1
    bearing_deg: 0.0
    elevation_target_m: 2100.0
    pin_strength: 0.7
    pin_exponent: 2.0           # 削峰——孤立的尖耸火山锥

  - name: 虚空洋
    kind: ocean_basin
    lon: 180.0                  # 背星点
    lat: 0.0
    radius_deg: 40.0
    strength: -0.8
    elongation: 1.0

  # 世界岛东岸浅海——弱负偏置让海向陆渗透，形成曲折海岸和内海
  - name: 世界岛东岸浅海1
    kind: shallow_sea
    lon: -46.0
    lat: -12.0
    radius_deg: 6.0
    strength: -0.35            # 弱负偏置：不强制成海，只增加海洋倾向
    elongation: 2.0
    bearing_deg: 75.0

  - name: 南极浅海
    kind: shallow_sea
    lon: 0.0                    # 极点，lon 任意
    lat: -90.0
    radius_deg: 24.0
    strength: -0.4              # 弱负偏置：浅海倾向，不强制统一深度
    elongation: 1.0

  # ---- 南方大陆（地球南半球 19% 陆地来自南美/澳洲；打破南大洋单调、
  #   让板块地壳构成接近地球：~5 陆 / ~6 洋 / 其余混合）----
  - name: 南方大陆1
    kind: continent
    lon: 120.0
    lat: -35.0
    radius_deg: 12.0
    strength: 0.6
    elongation: 1.4
    bearing_deg: 30.0
    elevation_target_m: 350.0  # 压低平均海拔（地球澳洲均值 ~330 m）
    pin_strength: 0.4
    pin_exponent: 1.5          # 偏差指数化：山脉强力下压
  - name: 南方大陆2
    kind: continent
    lon: -35.0
    lat: -40.0
    radius_deg: 11.0
    strength: 0.2
    elongation: 1.6
    bearing_deg: 15.0

  # ---- 南大洋（geography.md：南半球中纬度为洋；四环近似纬向洋带，
  #   否则 fBm 在此自发出陆，形成设计外大陆，边界横穿成"露出洋中脊"假象）----
  - name: 南大洋·0
    kind: ocean_basin
    lon: 0.0
    lat: -32.0
    radius_deg: 28.0
    strength: -0.8
  - name: 南大洋·90
    kind: ocean_basin
    lon: 90.0
    lat: -39.0
    radius_deg: 26.0
    strength: -0.8
  - name: 南大洋·180
    kind: ocean_basin
    lon: 180.0
    lat: -40.0
    radius_deg: 30.0
    strength: -0.9
  - name: 南大洋·-90
    kind: ocean_basin
    lon: -90.0
    lat: -36.0
    radius_deg: 27.0
    strength: -0.7

  # ---- 前导大陆小裂谷（2026-08）----
  # 以 #89452 为中心、南北走向（偏西 25°），切穿大陆、连通周围内海并打开出口。
  - name: 前导大陆小裂谷
    kind: rift_sea
    lon: 135.0
    lat: 6.0
    radius_deg: 2.2
    strength: -2.0              # 切穿大陆、连通内海
    noise_amplitude: 0.8
    elongation: 2.0
    bearing_deg: -25.0          # 偏西 25°

  # ── 高程微调 ────────────────────────────────────────────────────────────
  # (待后续南方文明锚定)
