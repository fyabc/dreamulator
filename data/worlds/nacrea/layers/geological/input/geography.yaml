              [-126, 18.5], [-131, 19.5], [-133.5, 23.5], [-138, 24]]
    edge_deg: 1.0
    strength: 0.42
    noise_amplitude: 0.2    # 碎片轮廓起伏幅度

  # # 北方陆间海西南水道（2026-10-21 作者要求）：陆间海主体与西部海盆之间必须保持水道，使内海东西两侧
  # # 都有出口（西侧经西部海盆通向西南外海）。用 overlay 不动板块；刻海场切开陆地，可跨越海平面的
