    elongation: 1.3
    bearing_deg: 30.0

  # ════════════════════════════════════════════════════════════════════
  # 五、大洋（向星 / 背星深海 + 中纬纬向洋带）
  # ════════════════════════════════════════════════════════════════════

  - name: Aegis深渊洋              # 向星点为中心 ±45°（全球最深海洋，陆地 0.7%）
    lon: 0.0                    # 向星点
    lat: 0.0
    radius_deg: 45.0
    strength: -1.0              # 最深海洋
    elongation: 1.0

  # 永耀岛：向星点火山省上的主火山，位于 Aegis 深渊洋中央，Aegis 永悬天顶，为 nacrea 文明传说中的
  # "世界之眼"。叙事豁免：此处热流与火山活动异常增大，岛屿目录推出的热管盾状火山只有约 1 km 起伏、
  # 出不了深海，所以永耀岛的高度由作者钉扎，不由目录推出（design-notes/0017 §5）。
  - name: 永耀岛
    lon: 0.4                    # 略偏向星点，不完全重合
    lat: -0.6
    radius_deg: 2.5             # 小型岛屿
    strength: 1.5               # 需克服 Aegis 深渊洋 −1.0 偏置
    noise_amplitude: 1.2
    elongation: 1.1
    bearing_deg: 0.0
    elevation_target_m: 2100.0
    pin_strength: 0.7
    pin_exponent: 3.0           # 削峰——孤立的尖耸火山锥

  - name: 虚空洋                  # 背星点为中心（陆地 0.1%；该半球终年不见 Aegis）
    lon: 180.0                  # 背星点
    lat: 0.0
    radius_deg: 40.0
    strength: -0.8
    elongation: 1.0

  # ---- 南大洋（geography.md：南半球中纬度为洋；四环近似纬向洋带，
  #   否则 fBm 在此自发出陆，形成设计外大陆，边界横穿成"露出洋中脊"假象）----
  - name: 南大洋·0
    lon: 0.0
    lat: -32.0
    radius_deg: 28.0
    strength: -0.6
  - name: 南大洋·90
    lon: 90.0
    lat: -39.0
    radius_deg: 26.0
    strength: -0.8
  - name: 南大洋·180
    lon: 180.0
    lat: -40.0
    radius_deg: 30.0
    strength: -0.9
  - name: 南大洋·-90
    lon: -90.0
    lat: -36.0
    radius_deg: 27.0
    strength: -0.7

  # ════════════════════════════════════════════════════════════════════
  # 六、边缘浅海（曲折海岸 + 岛弧浅海）
  # ════════════════════════════════════════════════════════════════════

  # 弱负偏置让海向陆渗透，形成曲折海岸和内海
  - name: 世界岛东岸浅海
    lon: -46.0
    lat: -12.0
    radius_deg: 6.0
    strength: -0.35             # 弱负偏置：不强制成海，只增加海洋倾向
    noise_amplitude: 4.0        # 高噪声增加边界随机性
    elongation: 2.0
    bearing_deg: 75.0

  # 弱负偏置让海向陆渗透，形成曲折海岸和内海
  - name: 曙光大陆南方浅海
    lon: 46.0
    lat: -4.0
    radius_deg: 6.0
    strength: -0.15
    noise_amplitude: 3.5
    elongation: 1.2
    bearing_deg: 90.0

  - name: 南极浅海                # 南纬 60°…76° 环带（岛弧 + 浅海，无连续大陆）
    lon: 0.0                    # 极点，lon 任意
    lat: -90.0
    radius_deg: 24.0
    strength: -0.25             # 弱负偏置：浅海倾向，不强制统一深度
    elongation: 1.0
    bearing_deg: 0.0

# ════════════════════════════════════════════════════════════════════
# overlays：地形微调层（只在地形合成阶段叠加；规则见文件头部说明）
# ════════════════════════════════════════════════════════════════════

overlays:

  # 逐日大陆改形（2026-09-30 用户裁决）。
  - name: 逐日东北海
    lon: 135.0
    lat: 45.0
    radius_deg: 12.0
    strength: -1.5
    noise_amplitude: 1.5
    elongation: 1.2
    bearing_deg: 90.0

  # 东南补偿：陆壳碎片上的群岛（补偿东北移除的陆地）。
  - name: 逐日东南群岛
    polygon: [[143, 12], [150, 8], [152, 16], [162, 12], [154, 10], [152, 4], [156, 2],
              [158, -4], [152, -8], [143.5, -2], [145, 3], [142, 7]]
    edge_deg: 1.0
    strength: 0.45        # 碎片内陆地占比 45%
    noise_amplitude: 0.2  # 碎片轮廓起伏幅度

  # 世界岛西北群岛海（2026-09-30 用户裁决）：世界岛西北外海的陆壳碎片，碎片内是岛与海峡镶嵌的群岛。
  - name: 西北群岛海
