# Nacrea 海陆分布锚定规格（机器可读）
#
# 与 geography.md（2026-08 修改后的不对称混合案）一一对应，feature 按海陆主要
# 特征分组：一 主要陆块 → 二 裂谷海系统 → 三 海峡与小型断陷 → 四 褶皱山系 →
# 五 大洋 → 六 边缘浅海。地形管线的 plate 阶段读取本文件，把每个 feature 叠加成
# 逐 cell 的"陆地偏置场"([-1,+1]：正=陆地、负=海洋)，再以全局阈值替代默认的
# "每板块随机大陆比例"，让命名大陆/大洋真正落到指定位置。构造演化后按
# reapply_after_tectonics 重新锚定，防止大陆随板块漂移离开锚点。
# （叠加为纯加法+末端截断，feature 顺序不影响结果——见 geography.py
#   build_land_bias_field。）
#
# 字段语义（见 src/dreamulator/map/geography.py）：
#   lon/lat       锚点中心（度）。极点特征 lon 任意
#   radius_deg    圆半径；拉长特征 = 半短轴（半宽）
#   strength      +1 强陆地 … −1 强海洋
#   elongation             半长轴/半短轴（≥1，1=圆）
#   bearing_deg            半长轴朝向（0=北，90=东）
#
#   可选字段（高程控制，仅 terrain 阶段读取）：
#   elevation_target_m     高程钉扎目标（m，相对海平面）。将 feature 覆盖区域内
#                          的 cell 向该值拉近。正值=压低山体/制造浅海陆桥，
#                          负值=加深海盆。与 pin_strength 配合使用。
#   pin_strength           钉扎强度 [0, 1]。1=完全强制到 target（硬钳），
#                          0.5=中等拉近（保内部起伏），0=无效果。
#                          默认 1。不宜对所有 feature 使用——仅用于关键地质
#                          瓶颈（海峡深度、陆桥高度、大陆平均海拔）。
#   pin_exponent           偏差指数化（>0，默认 1.0）。1.0=线性拉近（和旧行为
#                          一致）；>1=加大高差：山峰被强力下压，平原温和调整。
#                          配合中等 pin_strength 使用（例 0.3+1.5 或 0.4+2.0）。
#   sea_level_offset_m     局部海平面偏移（m，相对全局 sea_level_offset_m）。
#                          正值=抬升局部海平面（淹没陆地/加深浅海），
#                          负值=降低局部海平面（露出更多陆地）。
#                          用途：冰期海退实验、临界海峡门槛值扫描。
#
# 角度→距离换算（R=6817 km，1°≈119 km）：
#   世界岛 0.9×10^8 km² ≈ 表面积 15%；大裂谷海 600 km 宽×8000 km 长。
# 注：以下数值为首轮初值，需在重建后按地貌对照 geography.md 迭代微调。
# 已知局限：shallow_sea 的"浅"（水深<200 m）暂无法由二值地壳表达，
# 需后续海底高程控制；本轮仅保证海陆格局正确。
#
# ── features 与 overlays 的分工（2026-09-30，调参前请读）────────────────────
#
# 文件里有两个列表，写进哪个列表决定了这次改动的"影响力范围"：
#
#   features —— 主特征（大陆、大洋、裂谷海、海峡）。它们参与板块阶段的
#   工作：决定板块种子怎么摆、地壳怎么切成陆/洋、构造演化后怎么重新
#   锚定。改这个列表里的任何一项，全球板块划分都会重新生成——洋中脊、
#   海沟、海岸线在世界各地重排一遍，和改动位置无关的地方也会变。这是
#   "改世界"级别的操作，每次改完应该当一次新世界来检查。
#
#   overlays —— 地形微调层（文件末尾的独立段落）。它们只在最后的地形
#   合成阶段叠加进陆地偏置场，板块阶段完全看不见。因此：
#
#     · 改 overlays 里的强度、噪声、高程钉扎，全球板块保持逐位不变，
#       只有补丁附近的海陆会动——适合反复试参数。
#     · 每次构建后看日志里的 "Water calibration … overlay-blind(N cells)"
#       一行：海平面由补丁以外的世界决定，补丁自己造成的增陆/刻海就是
#       全球陆地比例的净漂移量（这是设计意图，不是 bug）。
#     · 移动或增删补丁（改变 footprint）时，海平面会有一个很小的残余
#       偏移（量级 ~20 m，来自补丁内原有陆地比例与全球目标的差）；
#       只调 strength / noise 则严格为零。
#     · 补丁覆盖区的地壳类型默认仍是板块阶段的产物——负场在陆地上刻出
#       来的海是大陆地壳浅海（陆间海语义，物理正确）；正场补丁会整体声明
#       为微陆块（见下方参数规则），造陆不再受阈值门限制。
#
#   经验法则：想让"这个世界"不变、只修局部海陆纹理 → overlays；
#   想重新安排大陆与海洋 → features（接受全球重排）。
#
# ── 参数规则（2026-09-30 定稿；strength 符号两层统一：正=造陆、负=刻海）────
#
# 正值大小的口径两层不同（机制不同，别混用）：
#   · overlays：正值 = 补丁内陆地占比（0–1）。0.3–0.6 → 镶嵌群岛（noise
#     决定岛/峡形态），0.8–1.0 → 近实心岛，>1 按 1 处理。壳声明自动覆盖整个
#     名义 footprint，没有"门槛"。
#   · features：正值 = 场强（板块阶段全球分位数的排名权重），1.0 = 整块
#     大陆声明。想要占比可控的补丁状陆地，用 overlays。
# 负值 = 刻海强度（两层同）：把场压过 −0.5 门 → 洋底基准，−1.2 ~ −2.0 可靠
# 切穿大陆，绝对值越大切得越宽越深。
#
# noise_amplitude = 纹理粗糙度（只画纹理，不移动壳分界主体）：正 overlay
# 里决定群岛的岛/峡密度；海岸 feature 里决定海岸线蜿蜒。注意 kernel 实际
# 半径会被放大到 (1+A)× 半长轴（A=4 时 5 倍）——壳声明已统一用无噪声场
# （features 走分位数天然自适应；overlays 固定阈值必须排除噪声，带噪声
# 会全球撒碎陆，实测踩坑），但调大 noise 时心里有数。
#
# elevation_target_m + pin_strength = 手动海拔（两层通用，最后生效）：
# 正值 target 钉陆地高度（陆桥/平台），负值 target 钉海峡或浅海深度；
# pin_strength 1.0 = 精确强制，0.3–0.7 = 软拉。它是"作者的地板/天花板"
# 语义——会把纹理熨平，造陆/造群岛请用 strength + noise，钉扎只做精修。

version: 1
land_fraction_target: 0.278     # 与 terrain_config.target_land_fraction 对齐
hemisphere_land_bias: 0.10      # 北半球偏陆（设定：北半球占 62% 陆地）
reapply_after_tectonics: true   # 构造演化后重锚定，保住正典大陆

features:
  # ════════════════════════════════════════════════════════════════════
  # 一、主要陆块（侧点 + 极点；逐日大陆/曙光大陆由潮汐骨架自发涌现，
  #     仅在四/六节给支撑性 feature）
  # ════════════════════════════════════════════════════════════════════

  - name: 世界岛                  # 后随点大陆（~70°W 为中心，占陆地 39%）
    lon: -90.0                  # 后随点 ~90°W
    lat: -10.0                  # 中心南移以压缩北方沙漠
    radius_deg: 35.0            # 半短轴；拉长后面积约 15% 表面积
    strength: 0.85              # <裂谷强度，保证裂谷能切开（见大裂谷海）
    elongation: 1.3             # 南北拉伸缩短（1.6→1.3: 北界 56→35°, 南界 −56→−55°）
    bearing_deg: 0.0            # 南北向拉长
    # 与 terrain_config.interior_lowland_* 协同：内部低地已系统性下压大陆深部，
    # 此钉扎把低区锚定在 ~400m（地球陆均高），pin_exponent<1 保护造山带高山。
    elevation_target_m: 400.0
    pin_strength: 0.3
    pin_exponent: 0.6           # 偏差指数化：保护高山，低区拉平到 target

  - name: 北极大陆                # 极点大陆（北极点为中心，占陆地 18%；与世界岛分离）
    lon: 150.0
    lat: 86.0
    radius_deg: 15.0
    strength: 1.5
    noise_amplitude: 1.45
    elongation: 1.3
    bearing_deg: 46.0
    elevation_target_m: 800.0
    pin_strength: 0.7
    pin_exponent: 0.5

  # ---- 南方大陆（地球南半球 19% 陆地来自南美/澳洲；打破南大洋单调、
  #   让板块地壳构成接近地球：~5 陆 / ~6 洋 / 其余混合）----
  - name: 南方大陆1
    lon: 120.0
    lat: -35.0
    radius_deg: 12.0
    strength: 0.6
    elongation: 1.4
    bearing_deg: 30.0
    elevation_target_m: 350.0  # 压低平均海拔（地球澳洲均值 ~330 m）
    pin_strength: 0.4
    pin_exponent: 1.5          # 偏差指数化：山脉强力下压
  - name: 南方大陆2
    lon: -35.0
    lat: -40.0
    radius_deg: 11.0
    strength: 0.2
    elongation: 1.6
    bearing_deg: 15.0

  # ════════════════════════════════════════════════════════════════════
  # 二、裂谷海系统（陆间海；连通性来源）
  # ════════════════════════════════════════════════════════════════════

  # ---- 大裂谷海：多段错列（en échelon）裂谷，仿东非大裂谷/红海 ----
  # 不用单一拉长偏置场（会产出笔直经向裂谷）；改用多段沿蜿蜒路径错列排布，
  # 走向左右摆动、宽窄不一，并叠加断块隆起（正场）与异常塌陷（更强负场）。
  # 2026-08-06 v2：用户验证后整体 ×1.7 放大并加强（首版裂谷太弱，碎成湖泊串
  # 而非陆间海）；各段仍拉开幅度，并有东非式分叉（西支）。
  - name: 大裂谷海·南段
    lon: -92.0
    lat: -22.0
    radius_deg: 5.1             # 宽深海段（红海型）
    strength: -2.6              # 须超过世界岛(+0.85)才能切穿
    noise_amplitude: 1.8
    elongation: 3.0
    bearing_deg: 32.0
  - name: 大裂谷海·中南段
    lon: -88.0
    lat: -11.0
    radius_deg: 3.5
    strength: -2.5
    noise_amplitude: 2.0
    elongation: 4.0
    bearing_deg: -30.0
  - name: 大裂谷海·中段
    lon: -91.5
    lat: -3.0
    radius_deg: 4.4
    strength: -3.0              # 强切穿段
    noise_amplitude: 1.8
    elongation: 3.5
    bearing_deg: 40.0
  - name: 大裂谷海·中北段1
    lon: -87.0
    lat: 8.0
    radius_deg: 4.0
    strength: -2.0
    noise_amplitude: 2.0
    elongation: 4.5
    bearing_deg: -15.0
  - name: 大裂谷海·中北段2
    lon: -87.0
    lat: 13.0
    radius_deg: 3.0
    strength: -1.5
    noise_amplitude: 3.0
    elongation: 2.5
    bearing_deg: -10.0
  - name: 大裂谷海·北段
    lon: -90.5
    lat: 19.0
    radius_deg: 5.0
    strength: -2.4
    noise_amplitude: 2.8
    elongation: 2.0
    bearing_deg: 30.0
  # 西支分叉（仿东非大裂谷 Western Rift：从中段向 WNW 分出）
  - name: 大裂谷海·西支南段
    lon: -95.5
    lat: -1.0
    radius_deg: 4.0
    strength: -2.2
    noise_amplitude: 1.0
    elongation: 3.0
    bearing_deg: -70.0
  - name: 大裂谷海·西支北段
    lon: -103.0
    lat: 4.0
    radius_deg: 3.0
    strength: -1.8
    noise_amplitude: 1.0
    elongation: 3.5
    bearing_deg: -75.0
  # 断块隆起（正场小丘，裂谷肩抬升 / 未裂透的断块）
  - name: 裂谷肩断块隆起·南
    lon: -85.5
    lat: -9.0
    radius_deg: 2.7
    strength: 0.9               # 弱正场 → 裂谷边缘断块隆起
    noise_amplitude: 0.75
    elongation: 2.4
    bearing_deg: -25.0
  - name: 裂谷肩断块隆起·北
    lon: -93.5
    lat: 12.0
    radius_deg: 1.7
    strength: 0.5
    noise_amplitude: 0.75
    elongation: 1.8
    bearing_deg: 20.0
  # 异常塌陷（更强负场，裂谷内局部深陷 / 拉分盆地）
  - name: 裂谷塌陷盆地·中
    lon: -84.5
    lat: 2.0
    radius_deg: 2.5
    strength: -3.0              # 比裂谷主体更深 → 局部深陷（模型下限 −3）
    noise_amplitude: 1.5
    elongation: 2.5
    bearing_deg: 15.0
  - name: 裂谷塌陷盆地·北
    lon: -89.0
    lat: 14.0
    radius_deg: 1.7
    strength: -2.4
    noise_amplitude: 0.8
    elongation: 2.0
    bearing_deg: -18.0

  # ---- 北极周缘裂谷（自转减慢松弛裂缝）----
  # 潮汐锁定过程中自转离心力减弱 → 极点旋转扁率松弛 → 地壳张性裂缝。
  # 这些裂谷切割北极大陆边缘，连通北方内海与外洋。
  - name: 北极周缘裂谷·本初段
    lon: 11.5
    lat: 59.0
    radius_deg: 2.25
    strength: -2.0
    noise_amplitude: 1.2
    elongation: 3.5
    bearing_deg: 130.0
  - name: 北极周缘裂谷·西段
    lon: -77.0
    lat: 50.0
    radius_deg: 2.0
    strength: -1.5
    noise_amplitude: 1.5
    elongation: 3.0
    bearing_deg: 90.0
  - name: 北极周缘裂谷·中段
    lon: -52.0
    lat: 52.0
    radius_deg: 1.4
    strength: -2.0
    noise_amplitude: 1.2
    elongation: 3.5
    bearing_deg: 140.0
  - name: 北极周缘裂谷·远西段
    lon: -136.3
    lat: 58.5
    radius_deg: 1.2
    strength: -2.0
    noise_amplitude: 1.2
    elongation: 4.0
    bearing_deg: 133.0

  # ════════════════════════════════════════════════════════════════════
  # 三、海峡与地峡（关键水道/陆地瓶颈）
  # ════════════════════════════════════════════════════════════════════

  - name: 世界岛-北极海峡1
    lon: -3.3
    lat: 69.5
    radius_deg: 1.1
    strength: -0.50
    noise_amplitude: 0.8
    elongation: 1.0
    bearing_deg: 0.0

  - name: 世界岛-北极海峡2
    lon: -4.35
    lat: 44.0
    radius_deg: 1.0
    strength: -0.50
    noise_amplitude: 0.5
    elongation: 1.0
    bearing_deg: 0.0

  - name: 世界岛-北极陆间海西部区域
    lon: -90.0
    lat: 48.0
    radius_deg: 10.0
    strength: -0.12
    noise_amplitude: 3.0
    elongation: 1.20
    bearing_deg: 10.0

  - name: 世界岛南北地峡
    lon: -73.7
    lat: 37.0
    radius_deg: 2.0
    strength: 1.0
    noise_amplitude: 0.5
    elongation: 1.0
    bearing_deg: 0.0
    elevation_target_m: 100.0

  - name: 曙光-逐日海峡1
    lon: 73.0
    lat: 24.0
    radius_deg: 1.2
    strength: -0.50
    noise_amplitude: 0.8
    elongation: 4.0
    bearing_deg: 5.0

  - name: 曙光-逐日海峡2
    lon: 73.3
    lat: 17.0
    radius_deg: 1.0
    strength: -0.40
    noise_amplitude: 0.5
    elongation: 1.0
    bearing_deg: 0.0

  # ════════════════════════════════════════════════════════════════════
  # 四、褶皱山系（前导点压缩造山；岛弧/群岛，非大陆）
  # ════════════════════════════════════════════════════════════════════

  - name: 前导点褶皱山系
    lon: 94.0
    lat: -2.5
    radius_deg: 6.0
    strength: 1.0
    noise_amplitude: 0.85
    elongation: 1.3
    bearing_deg: 30.0

  # ════════════════════════════════════════════════════════════════════
  # 五、大洋（向星 / 背星深海 + 中纬纬向洋带）
  # ════════════════════════════════════════════════════════════════════

  - name: Aegis深渊洋              # 向星点为中心 ±45°（全球最深海洋，陆地 0.7%）
    lon: 0.0                    # 向星点
    lat: 0.0
    radius_deg: 45.0
    strength: -1.0              # 最深海洋
    elongation: 1.0

  # 永耀岛 — 潮汐固定热点火山岛。向星点承受最强潮汐应力→地幔局部熔融→
  # 单一巨型火山在固定位置持续堆积（不同于地球板块飘过热点形成的火山链）。
  # 位于 Aegis 深渊洋中央，Aegis 永悬天顶，为 nacrea 文明传说中的"世界之眼"。
  - name: 永耀岛
    lon: 0.4                    # 略偏向星点，不完全重合
    lat: -0.6
    radius_deg: 2.5             # 小型岛屿
    strength: 1.5               # 需克服 Aegis 深渊洋 −1.0 偏置
    noise_amplitude: 1.2
    elongation: 1.1
    bearing_deg: 0.0
    elevation_target_m: 1700.0
    pin_strength: 0.7
    pin_exponent: 3.0           # 削峰——孤立的尖耸火山锥

  - name: 虚空洋                  # 背星点为中心（陆地 0.1%；该半球终年不见 Aegis）
    lon: 180.0                  # 背星点
    lat: 0.0
    radius_deg: 40.0
    strength: -0.8
    elongation: 1.0

  # ---- 南大洋（geography.md：南半球中纬度为洋；四环近似纬向洋带，
  #   否则 fBm 在此自发出陆，形成设计外大陆，边界横穿成"露出洋中脊"假象）----
  - name: 南大洋·0
    lon: 0.0
    lat: -32.0
    radius_deg: 28.0
    strength: -0.8
  - name: 南大洋·90
    lon: 90.0
    lat: -39.0
    radius_deg: 26.0
    strength: -0.8
  - name: 南大洋·180
    lon: 180.0
    lat: -40.0
    radius_deg: 30.0
    strength: -0.9
  - name: 南大洋·-90
    lon: -90.0
    lat: -36.0
    radius_deg: 27.0
    strength: -0.7

  # ════════════════════════════════════════════════════════════════════
  # 六、边缘浅海（曲折海岸 + 岛弧浅海）
  # ════════════════════════════════════════════════════════════════════

  # 弱负偏置让海向陆渗透，形成曲折海岸和内海
  - name: 世界岛东岸浅海
    lon: -46.0
    lat: -12.0
    radius_deg: 6.0
    strength: -0.35             # 弱负偏置：不强制成海，只增加海洋倾向
    noise_amplitude: 4.0        # 高噪声增加边界随机性
    elongation: 2.0
    bearing_deg: 75.0

  # 弱负偏置让海向陆渗透，形成曲折海岸和内海
  - name: 曙光大陆南方浅海
    lon: 46.0
    lat: -4.0
    radius_deg: 6.0
    strength: -0.15
    noise_amplitude: 3.5
    elongation: 1.2
    bearing_deg: 90.0

  - name: 南极浅海                # 南纬 60°…76° 环带（岛弧 + 浅海，无连续大陆）
    lon: 0.0                    # 极点，lon 任意
    lat: -90.0
    radius_deg: 24.0
    strength: -0.30             # 弱负偏置：浅海倾向，不强制统一深度
    elongation: 1.0


    bearing_deg: 0.0

# ════════════════════════════════════════════════════════════════════
# overlays：地形微调层（只在地形合成阶段叠加；规则见文件头部说明）
# ════════════════════════════════════════════════════════════════════

overlays:

  # 逐日大陆改形（2026-09-30 用户裁决）。
  # 东北部移除：开中纬东风水汽走廊，解除 +90..120 干核（88% BSk）的
  # 上游自遮蔽；顺带清除北方 (127.5, 55) 大岛。
  - name: 逐日东北海
    lon: 137.0
    lat: 40.0
    radius_deg: 10.0
    strength: -1.3
    noise_amplitude: 1.0
    elongation: 1.6
    bearing_deg: 90.0

  # 东南补偿：正场 = 补丁内陆地占比——0.45 给镶嵌群岛（补偿东北移除的陆地）。
  - name: 逐日东南群岛
    lon: 148.0
    lat: 4.0
    radius_deg: 8.0
    strength: 0.45        # 陆地占比 45%：noise 4.0 切出密集岛/峡
    noise_amplitude: 4.0
    elongation: 1.6
    bearing_deg: 0.0

  # 世界岛西北群岛海（2026-09-30 用户裁决）：世界岛西北外海做高噪声弱
  # 正场 → 复杂海岸线 + 亚热带（Aw/Cfb/BSk）文明有效陆地；该处东侧为
  # 开阔东风洋（−130..−180 陆地 ~5%），供水充分。
  - name: 西北群岛海
    lon: -130.0
    lat: 26.0
    radius_deg: 6.0
    strength: 0.5           # 陆地占比 50%：noise 2.5 切出岛/峡镶嵌
    noise_amplitude: 2.5    # 岛/峡密度与粗糙度
    elongation: 1.3
    bearing_deg: 0.0
