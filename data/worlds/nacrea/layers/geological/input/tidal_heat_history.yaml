# 潮汐热流史：热管火山省（亚格子岛屿目录阶段 C）的输入。
#
# 潮汐加热的强弱随自转–轨道失配角 ψ 变化（design-notes/0014）。热流超过板块所能排出的部分由热管
# 火山带出（design-notes/0017），所以这条时间线决定每个时期火山省喷出多少岩浆。
#
# recent：最近 200 万年的全球平均潮汐热流（W/m²，2 万年滑动平均），取自当代历元所在的正典轨迹
#   （集合成员 CTL045_J2_08_e2，当代 = 模式时刻 2367 kyr）。第一个值是当代，往后每隔 step_kyr 千年
#   回溯一次。最近一次潮汐期（热流高于 1.2 W/m²）在约 85–70 万年前，此后热流回落到静息期。
# ensemble：更早到回溯窗口（2000 万年）的时段用带种子的随机序列，静息段与潮汐期交替，时长与段内
#   热流按 0014 的 J₂ = 0.0008 档集合统计（静息段中位约 25 万年，潮汐期中位约 5 万年、最长约 100 万年，
#   段内平均 1.22–1.85 W/m²）。认识论类别：观测拟合，拟合对象是模型集合统计。
# province_activity_sigma_ln：每次潮汐期各火山省的活跃度各自随机抽取（对数正态），两边因此强弱交替。
# latest_phase_activity：最近一次潮汐期各火山省的活跃度（作者设定，1 = 按加热图样）。背星点在这一期
#   偏弱，只形成次级岛屿（作者 2026-10-21 裁决）。火山省共四个：向星点、背星点与南北两极。
