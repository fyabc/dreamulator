# Nacrea 恒星系 — 行星物理参数
# 含 6 颗行星 + 3 颗卫星（Nacrea 珠母星 + 逆行捕获卫 Cadence/Vigil）
planets:
  # ================================================================
  # 宜居卫星：Nacrea（珠母星） — 环绕巨神星 Aegis
  # ================================================================
  - id: satellite_nacrea
    name: "珠母星 · Nacrea"
    orbits: planet_aegis
    planet_type: ocean_world
    mass: 1.20                    # M⊕
    radius: 1.07                  # R⊕ (6817 km)
    rotation_period_days: 3.1336  # 恒星自转日（近同步，26-10-11 定版 500 kyr 实测）；太阳日 ≈3.24 地球日
    axial_tilt_deg: 19.9          # 恒星季节角时权均（26-10-11 定版主窗 161–500 kyr 实测 19.85）；长期波动带
    #   17.55–22.05（约 8.39 地球年季幅潮 ≈ 30.7 当地年）——波动时标 ≫ 气候响应时间，
    #   气候层读均值 + 登记波动带（与 astronomy/stellar.yaml 同源）
    albedo: 0.30
    atmosphere:
      surface_pressure_atm: 1.0
      composition:                # 摩尔分数，和 ≈ 1.0（CH4 为 1e-7 级痕量）
        N2: 0.7795
        O2: 0.2099
        Ar: 0.0100
        CO2: 0.000712             # 712 ppm 基线（作者裁决，故意非整数；落 450–800 ppm
        # 窗口内，地球历史类比 = 早上新世–中中新世大暖期 MMCO，复杂生命全盛档）。
        # GCM 定标（design-notes/0012）：712 ppm 下全球均温约 11.9°C，140–6000 ppm
        # 只有一个平衡态。CO₂ 随地热混沌变化：万年尺度 356–1400 ppm，千万年尺度
        # 极值 140–3000 ppm。碳酸盐-硅酸盐稳态自洽：稳态
        # V/W_eff = (712/280)^0.3 ≈ 1.32 → 潮汐火山脱气 ~2.9×⊕ × 风化效率
        # 2-2.5×⊕（新鲜玄武岩供给 ×3 折扣冷气候 ×0.65），正落设定带。
        CH4: 0.0000001            # 100 ppb = 0.1 ppm（微量 realism 档，作者裁决
        # 2026-10-06：非温室把手，~0.1-0.3 K 级微调）。构成 = 火山/蛇纹石化
        # 非生物源 30-50 ppb（脱气 2.5-4×⊕ × CH4/CO2 比 1e-4-1e-3，稳态 =
        # 源 3-15 Mt/yr × 寿命 ~10 yr ÷ 2960 Mt/ppm）+ 湿地生物产甲烷暂记
        # ~50 ppb（冷凉世界湿地通量约为现代地球 1/10 量级；正式额度待生态层
        # 裁决，若类地产甲烷生物圈成立可上探 0.3-1 ppm）。辐射效应
        # ΔF ≈ 0.36 W/m²（0.036√C，C 单位 ppb）→ ΔT ≈ +0.3 K，计入
        # greenhouse_factor 总账；PlaSim 辐射方案不含 CH4 吸收带，GCM 侧
        # 不可见（低于噪声）。叙事抓手（定性）：地热活跃期火山与蛇纹石化来源增加，
        # CH4 随之上升；它寿命约 10 yr，远短于地热变化的时间尺度，只表现为跟随
        # 活跃期的小幅增温，冰芯中可与火山灰层位共同辨认。热流到 CH4、CO2 的
        # 换算不做定量推导（作者裁决）。
      greenhouse_factor: 35.0     # 定值（S_eff 0.922 → Te 249.6 K，量级地球式）。GCM
      # 交叉验证（design-notes/0012）：712 ppm 下 GCM 约 11.9°C、引擎约 13.2°C，
      # 在 ±2 K 偏差不确定度内一致。CO₂ 变化时的等效温室按
      # G ≈ 35.0 + 5.2×ln(pCO₂/712 ppm) K 换算；引擎全球均温不含冰反照率反馈，
      # 改变强迫的正典调整需用 GCM 重新定标。
    hydrosphere:
      water_coverage: 0.722
      salinity_ppt: 35.0
      ocean_depth_km: 4.0         # 平均深度 4000 m
    lithosphere:
      has_plate_tectonics: true
      # num_plates 为派生量（板块生成输出），不在 input 手写；实际值见 plates.json
      volcanic_activity: 3.0      # 地球的 3 倍（潮汐驱动）
    magnetic_field_strength: 30.0 # 潮汐加热维持熔融地核 → 发电机效应

  # ================================================================
  # 逆行捕获卫：Cadence — 早期捕获（~0.5 Gyr），非共振单体；现行认证 =
  # 26-10-11 定版 500 kyr（design-notes/0009）：轨道要素见 stellar.yaml，勿单独改动
  # ================================================================
  - id: satellite_cadence
    name: "韵珠星 · Cadence"
    orbits: planet_aegis
    planet_type: terrestrial
    mass: 0.006                   # M⊕（减半：压 Nacrea 受迫 e + 延寿，93 票矩阵裁决 2026-09-28）
    radius: 0.2255                # R⊕ (1436.6 km，Europa 大小)，ρ≈2.88 g/cm³ 保持（岩质+深部水层）
    rotation_period_days: 6.54    # 同步自转 = 公转周期
    axial_tilt_deg: 0.0           # 自转轴 ⊥ 轨道面
    albedo: 0.13                  # 红褐暗珠：原生托林 + Gyr 辐照 + 等离子体溅射（土卫八/D 型类比）

  # ================================================================
  # 逆行捕获卫：Vigil — Charon 级小卫（内迁 0.37 r_H 构型），早期捕获；
  # 26-10-11 定版 500 kyr 认证：双珠全程存活、韵珠-守珠实际最小距离
  # 408,239 km。对外正典 = 双珠与文明长期相伴；豁免与命名规则见 0009 §2
  # ================================================================
  - id: satellite_vigil
    name: "守珠星 · Vigil"
    orbits: planet_aegis
    planet_type: terrestrial
    mass: 3.05e-4                 # M⊕（Charon 级）
    radius: 0.0965                # R⊕ (615 km)，ρ≈1.87 g/cm³（冰岩混合，土卫六/木卫四带）
    rotation_period_days: 10.29   # Hut 伪同步（26-10-11 定版实测 10.286 d；随 e 带 0.037–0.128 小幅漂移）
    axial_tilt_deg: 0.0           # 自转轴 ⊥ 轨道面
    albedo: 0.313                 # Charon 型处理结晶水冰（HZ 辐照压暗版）

  # ================================================================
  # Crucible（鼎星）捕获卫星 — 小卫星（火卫一类比）
  # ================================================================
  - id: satellite_cinder
    name: "焦砾星 · Cinder"        # 鼎卫一
    orbits: planet_crucible
    planet_type: terrestrial
    mass: 1.8e-9                   # M⊕（火卫一类比）
    radius: 0.00175                 # R⊕ (~11 km)
    rotation_period_days: 0.27     # 同步自转 = 公转周期（~6.5 h）
    axial_tilt_deg: 0.0
    albedo: 0.071                   # 暗色捕获岩体

  # ================================================================
  # Boreal（沧星）卫星链 — 3 颗冰质规则卫星（非共振宽间距，见 astronomy/stellar.yaml）
  # ================================================================
  - id: satellite_frostine
    name: "凝冰星 · Frostine"      # 沧卫一
    orbits: planet_boreal
    planet_type: terrestrial
    mass: 0.008                    # M⊕
    radius: 0.2440                  # R⊕ (1554 km)，ρ≈1.9 g/cm³ 冰质
    rotation_period_days: 2.17     # 同步自转 = 公转周期
    axial_tilt_deg: 0.0
    albedo: 0.67                   # 富冰表面，冰下海洋（欧罗巴类比）

  - id: satellite_umbra
    name: "玄冰星 · Umbra"         # 沧卫二
    orbits: planet_boreal
    planet_type: terrestrial
    mass: 0.1421                   # M⊕
    radius: 0.7500                  # R⊕ (4778 km)，ρ≈1.86 g/cm³ 冰岩分异
    rotation_period_days: 3.90     # 同步自转 = 公转周期
    axial_tilt_deg: 0.0
    albedo: 0.43                   # 最大者，冰下海洋 + 微弱磁场（温和潮汐暖冰月，总热流 ~35–80 mW/m²）

  - id: satellite_sleet
    name: "霜冰星 · Sleet"         # 沧卫三
    orbits: planet_boreal
    planet_type: terrestrial
    mass: 0.002                    # M⊕
    radius: 0.1491                  # R⊕ (950 km)，ρ≈1.5 g/cm³ 冰质
    rotation_period_days: 9.97     # 同步自转 = 公转周期
    axial_tilt_deg: 0.0
    albedo: 0.22                   # 密布陨石坑（木卫四类比）

  # ================================================================
  # Glacis（霰星）卫星 — 规则内卫星 + 逆行捕获外卫星
  # ================================================================
  - id: satellite_shard
    name: "玄石星 · Shard"         # 霰卫一
    orbits: planet_glacis
    planet_type: terrestrial
    mass: 0.001                    # M⊕
    radius: 0.1178                  # R⊕ (750 km)，ρ≈1.2 g/cm³ 冰岩
    rotation_period_days: 3.42     # 同步自转 = 公转周期
    axial_tilt_deg: 0.0
    albedo: 0.32

  - id: satellite_rogue
    name: "逆石星 · Rogue"         # 霰卫二
    orbits: planet_glacis
    planet_type: terrestrial
    mass: 0.0002                   # M⊕
    radius: 0.0589                  # R⊕ (375 km)
    rotation_period_days: 17.8     # 同步自转 = 公转周期（逆行，轨道扁）
    axial_tilt_deg: 0.0
    albedo: 0.19

  # ================================================================
  # Sentinel（藩星）不规则捕获群 — 散射遗孤，无规则卫星
  # ================================================================
  - id: satellite_vagrant
    name: "近客星 · Vagrant"       # 藩卫一
    orbits: planet_sentinel
    planet_type: terrestrial
    mass: 0.001                    # M⊕
    radius: 0.0994                   # R⊕ (~640 km)，冰岩混合
    rotation_period_days: 0.42     # 不规则，非同步自转
    axial_tilt_deg: 26.0
    albedo: 0.23

  - id: satellite_guest
    name: "远客星 · Guest"         # 藩卫二
    orbits: planet_sentinel
    planet_type: terrestrial
    mass: 0.0003                   # M⊕
    radius: 0.0117                  # R⊕ (~76 km)
    rotation_period_days: 0.31     # 不规则，非同步自转（逆行）
    axial_tilt_deg: 44.0
    albedo: 0.17

  # ================================================================
  # 行星 I：焦星 Ember — 被剥夺地幔的铁核残骸
  # ================================================================
  - id: planet_ember
    name: "焦星 · Ember"
    orbits: star_ignis
    planet_type: terrestrial
    mass: 0.35                    # M⊕
    radius: 0.63                  # R⊕ — ρ=7.8 g/cm³（参照水星 5.4 + 重力压缩）
    rotation_period_days: 5.37    # 潮汐锁定于恒星
    axial_tilt_deg: 0.0
    albedo: 0.10                  # 裸露金属表面
    magnetic_field_strength: 5.0  # 残余铁核微弱磁场 (μT)
    satellite_ids: []             # 无卫星（恒星潮汐剥离，水星类比）

  # ================================================================
  # 行星 II：鼎星 Crucible — 温室炼狱中的次生岩石世界
  # ================================================================
  - id: planet_crucible
    name: "鼎星 · Crucible"
    orbits: star_ignis
    planet_type: terrestrial
    mass: 0.90                    # M⊕
    radius: 0.97                  # R⊕
    rotation_period_days: 16.6    # 潮汐锁定于恒星
    axial_tilt_deg: 0.0
    albedo: 0.15                  # 暗色玄武岩表面
    atmosphere:
      surface_pressure_atm: 90.0
      composition:
        CO2: 0.90
        SO2: 0.05
        N2: 0.05
      greenhouse_factor: 248.0    # T_eq 372 K → 实际表面 ~620 K
    volcanic_activity: 5.0        # 极高火山活动
    satellite_ids:
      - satellite_cinder           # 捕获小卫星（火卫一类比）

  # ================================================================
  # 行星 III：神盾 Aegis — 宜居带气态巨行星
  # ================================================================
  - id: planet_aegis
    name: "巨神星 · Aegis"
    orbits: star_ignis
    planet_type: gas_giant
    mass: 508.5                   # 1.6 M_J × 317.83 M⊕/M_J
    radius: 11.2                  # ~1.0 R_J (Fortney et al. 2007, 1.6 M_J 冷气态巨行星)
    rotation_period_days: 0.1863539  # 4.4725 h 快自转（26-10-11 定版成熟态；机制待实验认证，见 astronomy/stellar.yaml）
    axial_tilt_deg: 44.8374718    # 自转轴倾角（26-10-11 定版成熟态；机制待实验认证）。气候层恒星季节角 = Nacrea 定版主窗时权均 19.9°（非本值直接函数）
    albedo: 0.343                 # Jupiter-like Bond albedo
    atmosphere:
      surface_pressure_atm: 1000.0
      composition:
        H2: 0.86
        He: 0.135
        CH4: 0.003
        NH3: 0.002
      greenhouse_factor: 0.0
    magnetic_field_strength: 400.0  # ~8× Jupiter (质量更大 + 快速自转)
    satellite_ids:
      - satellite_nacrea
      - satellite_cadence
      - satellite_vigil

  # ================================================================
  # 行星 IV：沧星 Boreal — 共振链次级气态巨行星 (2:1)
  # ================================================================
  - id: planet_boreal
    name: "沧星 · Boreal"
    orbits: star_ignis
    planet_type: gas_giant
    mass: 159.3                   # 0.5 M_J (M⊕)
    radius: 9.5                   # R⊕ (~0.85 R_J)
    rotation_period_days: 0.50    # ~12 hours
    axial_tilt_deg: 2.0
    albedo: 0.30
    atmosphere:
      surface_pressure_atm: 500.0
      composition:
        H2: 0.84
        He: 0.14
        H2O: 0.01
        NH3: 0.01
      greenhouse_factor: 0.0
    satellite_ids:
      - satellite_frostine
      - satellite_umbra
      - satellite_sleet

  # ================================================================
  # 行星 V：霰星 Glacis — 共振链末端冰巨星 (4:1)
  # ================================================================
  - id: planet_glacis
    name: "霰星 · Glacis"
    orbits: star_ignis
    planet_type: ice_giant
    mass: 17.1                    # M⊕ (~0.054 M_J，海王星级)
    radius: 3.88                  # R⊕
    rotation_period_days: 0.72    # ~17 hours
    axial_tilt_deg: 5.0
    albedo: 0.25
    atmosphere:
      surface_pressure_atm: 100.0
      composition:
        H2: 0.80
        He: 0.15
        CH4: 0.05
      greenhouse_factor: 0.0
    satellite_ids:
      - satellite_shard
      - satellite_rogue

  # ================================================================
  # 行星 VI：藩星 Sentinel — 迁移弹射遗孤
  # ================================================================
  - id: planet_sentinel
    name: "藩星 · Sentinel"
    orbits: star_ignis
    planet_type: ice_giant
    mass: 8.5                     # M⊕
    radius: 2.4                   # R⊕
    rotation_period_days: 0.625   # ~15 hours
    axial_tilt_deg: 15.0
    albedo: 0.20                  # 冰质表面
    satellite_ids:
      - satellite_vagrant
      - satellite_guest
