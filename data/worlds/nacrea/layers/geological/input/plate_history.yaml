# Nacrea 地质历史的创作设定（可选输入）
#
# sutures 供古地理倒推读取，也参与现状地形合成：老造山带沿缝合带立起（docs/knowledge/geology/terrain_synthesis.md
# §4.3），改动会触发地形重建；格式见 docs/design/proposals/geological-timeline.md §5.1。
# collisions 与 andean_margins（可选，本文件暂未使用）是历史契约的作者覆盖，参与现状地形合成，改动会触发
# 地形重建，格式见 docs/design/proposals/history-contract.md §3.4；不写时碰撞开始时刻由构造演化推导。
#
# sutures：古缝合带。倒推到碰撞年龄时，持有缝合带的板块沿折线切开，离开的一侧在倒推中远离、
# 在正向时间里与另一侧相向汇聚。
#   path               [经度, 纬度]（度）的折线，按大圆段连接，两端落在海里或板块边界上
#   collision_age_myr  碰撞完成时刻（距今百万年）
#   width_km           缝合带半宽（古地理倒推标记用，不决定造山带宽度）
#   moving_side        离开的一侧：left / right（相对折线前进方向）或方位（north、southwest 等）
#   reopened_by_rift   true 表示折线沿着一条现状陆连裂谷：这条缝合带后来被裂谷重新撕开（裂谷常沿古缝合带
#                      张开）。它不切大陆块，只让裂谷两侧的焊接停在碰撞年龄，更早时两侧分开；不需要 moving_side
#
# 碰撞年龄属创作设定。地形引擎按造山后起伏衰减把年龄换成残留山脊高度：山脊从本世界典型碰撞造山带的
# 脊线高度（各碰撞段中位数，nacrea 约 2030 m）以 70 Myr 的 e 折时间衰减到约 400 m 的残留值，宽度保持
# 活动造山带的楔形宽度（地球观测拟合，Pazzaglia 与 Brandon 1996；nacrea 热流更高、岩石圈更弱，衰减时间约
# 有 2 倍不确定）。各条后面的注释是按此算出的残留山脊高度。名称待定。
#
# 拼合缝合带（reopened_by_rift）的造山带已被裂谷撕开，年龄由超大陆旋回约束，裂谷两侧仍留有残留山脊：
# 旋回约 1.2 亿年，与按板块速度标度的理论范围（约 0.3–2.5 亿年，见 docs/knowledge/geology/supercontinent_cycle.md）相容；
# 当代处于裂解中期，取这次裂解约 60 Myr 前开始（按引擎相对运动估算，现状陆连裂谷的张裂时间多在 40 Myr 以内，
# 张开极慢的少数裂谷估算可达数百 Myr，不可靠）；超大陆完整存续约占旋回的四分之一（约 3000 万年），所以拼合
# 完成于约 90 Myr 前，拼合碰撞落在约 90–120 Myr。四条按「最后合上的最先撕开」排序：裂谷张开越早，
# 年龄越年轻。拼合前是四块大陆：世界岛（板块 18、5、17、8）、北方大陆（板块 0、14、1）、东方大陆
# （板块 13、3、11）与南方大陆（板块 7）。

