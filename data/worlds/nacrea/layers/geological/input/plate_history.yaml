# Nacrea 地质历史的创作设定（可选输入）
#
# 只供古地理倒推（板块拓扑层，src/dreamulator/map/paleo_walk.py）读取，不参与现状地形合成；
# 改动本文件不会触发地形重建。格式见 docs/design/proposals/geological-timeline.md §5.1。
#
# sutures：古缝合带。倒推到碰撞年龄时，持有缝合带的板块沿折线切开，离开的一侧在倒推中远离、
# 在正向时间里与另一侧相向汇聚。
#   path               [经度, 纬度]（度）的折线，按大圆段连接，两端落在海里或板块边界上
#   collision_age_myr  碰撞完成时刻（距今百万年）
#   width_km           缝合带半宽
#   moving_side        离开的一侧：left / right（相对折线前进方向）或方位（north、southwest 等）
#   reopened_by_rift   true 表示折线沿着一条现状陆连裂谷：这条缝合带后来被裂谷重新撕开（裂谷常沿古缝合带
#                      张开）。它不切大陆块，只让裂谷两侧的焊接停在碰撞年龄，更早时两侧分开；不需要 moving_side
#
# 碰撞年龄按缝合带上陆地（高程大于 0 的陆壳）的平均高程推算：比大陆基准高出越少，碰撞越古老（造山后起伏衰减，
# 活动造山带的中位成形时间加 50 Myr × ln(活动造山带起伏 / 该带起伏)）。50 Myr 的衰减时间是地球观测
# 拟合（Baldwin 等 2003），nacrea 热流更高、岩石圈更弱，取值约有 2 倍不确定；年龄属创作设定。名称待定。
#
# 拼合缝合带（reopened_by_rift）的造山带已被裂谷撕开，起伏推不出年龄，年龄改由超大陆旋回约束：
# 旋回约 1.2 亿年，与按板块速度标度的理论范围（约 0.3–2.5 亿年，见 docs/knowledge/geology/supercontinent_cycle.md）相容；现状最老的一批陆连裂谷
# 张裂于约 48–62 Myr 前，即这次裂解的开始；超大陆完整存续约占旋回的四分之一（约 3000 万年），所以拼合
# 完成于约 90 Myr 前，拼合碰撞落在约 90–120 Myr。四条按「最后合上的最先撕开」排序：裂谷张开越早，
# 年龄越年轻。拼合前是四块大陆：世界岛（板块 18、5、17、8）、北方大陆（板块 0、14、1）、东方大陆
# （板块 13、3、11）与南方大陆（板块 7）。

