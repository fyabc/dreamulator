# Nacrea 地形生成管线配置 (CVT Pipeline v2.0)
#
# 用于 dreamulator terrain generate 命令的配置文件。
#
# 用法:
#   uv run dreamulator terrain generate nacrea --planet satellite_nacrea \
#     --config data/worlds/nacrea/layers/geological/input/terrain_config.yaml
#
# 数据来源:
#   planets.yaml       — 行星物理参数
#   geography.yaml     — 机器可读海陆锚定规格（大陆/大洋锚点，驱动地壳分配）
#   geography.md       — 海陆分布设定（2026-08 更新后的不对称混合案）
#   geological_history.md — 地质演化史
#   tidal_effects.md   — 潮汐效应
#
# 海陆锚定（2026-08 实现）: 同目录的 geography.yaml 把 geography.md 的命名
# 地貌（Aegis 深渊洋、虚空洋、世界岛、前导点褶皱山系、北极大陆、大裂谷海、
# 世界岛—北极陆桥）编码为锚点。地质引擎据此构建逐 cell 陆地偏置场并以全局阈值
# 分配地壳（见 docs/design/terrain-pipeline.md §3.5）。删除 geography.yaml
# 即回退到随机大陆分布。feature 参数为首轮初值，可按渲染结果微调。

# ── 行星基本参数 ──────────────────────────────────────────────────────────────
planet:
  seed: 42
  radius_km: 6817.0            # 1.07 R_earth
  gravity_m_s2: 10.28          # 1.05g (G*1.2M_earth/(1.07R_earth)^2)
  rotation_period_days: 3.25   # 潮汐锁定于 Aegis 巨行星

# ── CVT 网格 + 地形合成 ───────────────────────────────────────────────────────
terrain:
  num_nodes: 200000            # 20 万个 Voronoi cell（v0.24 升级）
  jitter_sigma: 0.3
  lloyd_iterations: 8
  continental_elevation_m: 650.0  # 剥蚀后克拉通基准（地球陆表众数 ~200–500m，非均值 840m）
  oceanic_elevation_m: -3800.0 # Nacrea 海洋平均深度 ~4000m
  boundary_influence_km: 400.0       # shoulder sigma — wide flank base width (km)
  # Dual-component mountain profile (v0.25): narrow ridge Gaussian + wide shoulder
  # Gaussian.  Ridge sigma controls how sharp the range crest is; shoulder
  # strength controls the flank plateau height relative to the crest.
  boundary_ridge_sigma_km: 80.0      # narrow ridge crest half-width (km).  Smaller = sharper peaks
  boundary_shoulder_strength: 0.3    # shoulder amplitude ratio (0=no shoulder, 1=equal to ridge)
  convergent_uplift_m: 5000.0  # 山峰 ~8000m（5000×1.3 C-C 造山）
  divergent_depth_m: 2000.0
  plate_elevation_spread_m: 800.0   # 板块间海拔差异（克拉通相对平坦，陆表起伏 ~100–300m）
  continental_undulation_m: 300.0   # 动态地形起伏（克拉通相对平坦）
  boundary_noise: 0.10
  # terrain_algorithm: cortial2019_asymmetric  # terrain synthesis strategy
  # mountain_asymmetry: 0.4                    # 0=symmetric, 1=strongly asymmetric
  # hotspot_count: 3                           # volcanic hotspot chains (0=off)
  # ── 内部低地（2026-08）──────────────────────────────────────────────
  # 大陆深部（远离汇聚边界的克拉通内部）系统性下压到低地海拔，解决
  # "大陆主体都是 ≥1000m 高原、缺少平原"的问题（地球陆均高 ~350-500m）。
  # 下压量 = depth × smoothstep(距最近汇聚边界距离 / scale)，被 floor 钳制在
  # 海平面之上 → 校准后的海岸线不变。造山带/古造山带（后续阶段叠加）仍可高出。
  interior_lowland_enabled: true
  interior_lowland_depth_m: 500.0        # 深部最大下压量（m）
  interior_lowland_distance_scale_km: 600.0   # 下压从 0 → 满深的距离（km，≈1.5× boundary_influence）
  interior_lowland_floor_m: 0.0          # 软钳制到海平面（先保住海岸线，28% 陆地）
  # ── 沉积填充（2026-08）──────────────────────────────────────────────
  # 内部低地把深部压到海平面以下，floor 软钳制把它们钳到 ~0m（保住海岸线）。
  # 沉积填充接着把「被钳平的孤立盆地」填到溢流点（通往海洋的最低出口），
  # 使其重新排水（Landlab SinkFiller / Tucker 2001）——调整内陆海拔、不动海岸线。
  # 留一小部分盆地不填满（填到溢流点 − lake_depth），作为外流湖（is_lake）。
  deposition_enabled: true
  lake_fraction: 0.2                  # 留作内流湖的盆地比例
  lake_depth_m: 50.0                  # 湖面低于海平面的深度（m；参考里海 −28m）

# ── 构造板块 ──────────────────────────────────────────────────────────────────
# 来源: geography.md (12主板块 + 8小板 = 20)
# 注意: num_plates 是**生成请求**（种子数）；构造演化（裂解）后实际板块数
# 以 plates.json 为准（seed=42 实测 25）。map.yaml/文档引用实际值。
# 板块速度: ~15 cm/yr 最快（地球 ~3×，潮汐加热驱动；现由下方 tidal 段从
# 潮汐加热推导，plate_speed_max_cm_yr 为未启用耦合时的回退值）
plates:
  num_plates: 20
  plate_speed_min_cm_yr: 3.0   # 最慢板块（tidal 段推导时保留此下界）
  plate_speed_max_cm_yr: 15.0  # 最快板块（tidal_plate_speed_enabled 时被推导值覆盖 ≈ 15）
  plate_algorithm: cortial2019  # plate partition strategy
  tectonic_algorithm: "cortial2019"  # time-evolution (""=none, "cortial2019")
  tectonic_steps: 50                # evolution steps (50=preview, 125-250=full)
  # tectonic_dt_my: 0.0         # My/step (0 = auto-scale to resolution)
  # 板块大小偏态：select_plate_seeds 用可变密度采样使初始剖分偏态（CV≈0.44），
  # 裂解用加权 Dijkstra 产生不等大碎片，裂解率调低避免大盘被过度拆解。
  # 构造重采样为乘法加权 Voronoi（plate_weight 持久权重 = 出生面积），
  # 偏态在 Lloyd 型迭代中保持而非被洗掉（见 roadmap #6、terrain-pipeline.md §3.2）。
  rift_base_rate: 0.005
  # Cortial 2019 §3 边界噪声扭曲：0=平直测地边界；低频 fBm 扭曲使边界弯曲成
  # 弧形（岛弧/造山带分段弯曲），而非绵延平直（见 terrain-pipeline.md §3.2）。
  boundary_warp: 0.3              # 0.9→0.6 仍犬牙交错，再降（2026-08 用户反馈）
  boundary_uplift_noise: 0.8      # 岛弧/洋脊隆起低频随机调制 → 大岛+附属岛层级
  continental_fraction_min: 0.28   # target ~28% emergent land
  continental_fraction_max: 0.36

  lat_bias: 0.33  # tidally-locked, weak latitude preference

  # ---- 海平面自动校准 ("倒水") -------------------------------------------
  # 启用后，通过二分查找确定海平面高度，使得露出水面的陆地面积比例
  # 恰好等于 target_land_fraction。海平面自动成为 0 m 基准面。
  # 关闭后使用固定的双峰基底 (continental_elevation_m / oceanic_elevation_m)。
  # 隐含水预算（等效均匀深度）在校准日志中报告。
  sea_level_auto: true
  # 目标露出陆地比例 [0, 1]。Nacrea 设定为海洋世界，陆地较少。
  target_land_fraction: 0.28

# ── 噪声参数 ──────────────────────────────────────────────────────────────────
noise:
  noise_scale: 2.0            # 细节噪声频率: 波长 ≈ 6817/2.0 ≈ 3400 km (大陆级)
  noise_octaves: 6
  noise_persistence: 0.5
  noise_lacunarity: 2.0
  noise_amplitude_land_m: 600.0
  noise_amplitude_ocean_m: 300.0
  # noise_scale 与物理波长的换算：波长(km) ≈ 行星半径(km) / scale
  # nacrea R=6817 km: scale 0.5→13600 km(全球级), 2.0→3400 km(大陆级),
  #                   3.0→2300 km(板块级), 5.0→1400 km(区域级)
  regional_noise_scale: 3.0      # 板块级起伏（波长 ~2300 km）
  regional_noise_amplitude_land_m: 1200.0
  regional_noise_amplitude_ocean_m: 800.0

# ── 洋底年龄-深度沉降（板块冷却模型）──────────────────────────────────────────
# 洋底深度随距洋中脊距离增加而加深：depth = ridge + coeff·sqrt(age)
# 解决三个问题：① 浅水过多（0-500m 14.8% vs 地球 8%）→ 洋中脊附近浅、
# 渐深；② 均深偏浅（3015m vs 地球 3682m）→ old basins 达 5500m 拉高均值；
# ③ 极值过深（海沟 16km）→ 基底线从 -2500 起算而非均匀 -3800，海沟叠加
# 后不再超 12km。
ocean:
  age_depth_enabled: true
  spreading_rate_cm_yr: 6.0     # 半扩张速率（地球 1–5），nacrea 潮汐加热+活跃地质体 → 更高
  ridge_depth_m: 2500.0         # 洋中脊深度
  subsidence_coeff: 350.0       # sqrt(age) 系数
  max_age_myr: 100.0            # 稳态年龄（岩石圈热平衡）
  max_age_depth_m: 5500.0       # 纯冷却最大深度（海沟叠加另计）

# ── 潮汐加热 → 板块速度耦合 ──────────────────────────────────────────────────
# 启用后，最快板块速度与洋底半扩张速率由潮汐加热（Peale & Cassen 1978）通过
# 经验幂律 v ∝ q^β 推导，替代上面的 plate_speed_max_cm_yr / ocean.spreading_rate_cm_yr。
# nacrea: q_tidal ≈ 0.27 W/m² = 3× 地球总热流(0.09) → β=1.0 → v ≈ 15 cm/yr，
# 半扩张 = 0.4 × 15 = 6 cm/yr —— 与手写值一致（终值不变）。
# 参考 docs/knowledge/geology/tidal_plate_speed.md（含引用与 Valencia vs
# O'Neill&Lenardic 争论）。v 以 0.5 cm/yr 粒度取整（经验律 ±50% 不确定）。
tidal:
  plate_speed_enabled: true
  plate_speed_beta: 1.0           # v ∝ q^β，文献范围 [0.5, 1.5]
  plate_speed_v_ref_cm_yr: 5.0    # 地球平均板块速度
  plate_speed_q_ref_w_m2: 0.09    # 地球总表面热流（47 TW）
  k2_over_q: 0.003                # k₂=0.3 / Q=100（physical_params.md）
  spreading_ratio: 0.4            # 半扩张 ≈ 0.4 × 最快板块速度

# ── 气候参数（慢自转标定，roadmap 3A.3a） ─────────────────────────────────────
# Nacrea 自转 Ω=0.31 Ω⊕（78h）：科氏力弱 → 经向热输送更强 →
# 赤道-极地温差小于地球的 40°C；Hadley 胞扩展到极地（单圈环流，GCM 证实无 Ferrel/极地胞）。
climate:
  # ── 温度：单圈环流 Held-Hou 剖面 ──
  # hadley_extent_deg=90（单圈，GCM Ω=0.31 结果）：Hadley 胞抵极，热输送由
  # 翻转环流（MOC）主导——与扩散 EBM 的涡旋输送机制不同，Ω^0.3 标度会低估输送。
  # 用 Held & Hou (1980) 四次方剖面 T(φ)=T_mean+ΔT·(1/5−sin⁴φ)，ΔT=Ω²a²θ₀/(2gH)，
  # 副热带平（无冷荒漠）、极地有冰盖。ebm_1d=true 启用；ebm_diffusion_* 仅三圈环流用。
  ebm_1d: true
  # ebm_olr_b_wm2k: 2.0           # 线性 OLR 系数 B（Budyko 1969，默认）
  # ebm_diffusion_wm2k: 0.35      # 总经向扩散 D（三圈环流季节 B_eff 用）
  # ebm_diffusion_land_wm2k: 0.2  # 陆地大气输送（三圈环流大陆度用）
  # 3A.3: ice-albedo feedback — T<-10C → albedo 0.7 → less solar abs → cooler
  variable_lapse_rate: true  # T-dependent Γ: tropical highlands stay warmer
  ice_albedo_feedback: true
  ice_albedo_max_cooling_c: 3.0   # M dwarf: ice albedo in NIR is much lower (~0.2 vs ~0.7 visible)
  ice_albedo_threshold_c: -5.0    # default -10; lower = earlier activation
  hadley_extent_deg: 90.0     # 单圈环流：Hadley 胞直抵极地（GCM Ω=0.31 结果）
  polar_cell_start_deg: 90.0  # 单圈：无 Ferrel/极地胞
  storm_track_amplitude_mm: 0.0  # 单圈：无斜压风暴路径（baroclinic eddies 不形成）
  # Sub-Aegis hemisphere warming: tidally-locked to gas giant →
  # Aegis IR + reflected starlight ≈ 1–1.5 W/m² → ~1°C warmer
  # on the permanently planet-facing side.  This fixed longitudinal
  # temperature gradient drives wind & ocean currents on a slow
  # rotator where Coriolis-driven circulation is inherently weak.
  sub_planet_warming_c: 1.0
  sub_planet_longitude_deg: 0.0  # Aegis深渊洋 = 向星点 (geography.yaml)
  # 水汽输送：蒸发基准用共享物理默认（能量限制 ~1000 mm @15°C），
  # 不再单世界覆盖（蒸发是水的物理属性，不随恒星/卫星变化）。

# ── 导出设置 ──────────────────────────────────────────────────────────────────
export:
  export_width: 4096
  export_height: 2048

# ── 均衡高程极限 ────────────────────────────────────────────────────────────
# 陆 max = 8848 × g_earth/g_gaia = 8848 × 9.81/10.28 ≈ 8443 m
# （h_max ∝ 1/g：高重力行星的山峰被自身重量压低）
# 海 max = 11034 × g_gaia/g_earth ≈ 11550 m（非精确标度，取略深于地球；
# 板片 pull ∝ g 增强 vs 薄岩石圈弯曲减弱，两效应大致抵消）
isostasy:
  enabled: true
  max_continental_elevation_m: 8443.0   # 地球 ~8848
  max_ocean_depth_m: 11550.0            # 地球 ~11034

# ── 流水侵蚀 / 沉积（2026-08-26 已移除）─────────────────────────────────
# 尺度结论：51 km 网格（200k）上真实河谷（5–50 km 宽）全部亚网格，流水侵蚀在
# 此分辨率只会产生单 cell 宽人工沟壑，且 detachment-limited 无输沙极限会过度夷平/
# 造深谷。河谷雕刻归管线最后一步的 Gaea 局地高清精修（米级）；大陆内部低地由
# 地形合成的「内部低地」解决（非侵蚀）。河网（流量累积/河流矢量图层）保留，
# 见 hydrology.py / river_generator.py。
