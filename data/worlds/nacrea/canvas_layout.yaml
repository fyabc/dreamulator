# Layout of the global terrain-diffusion canvases (S1), read by td_canvas_build.CanvasLayoutConfig.
# Author choices only; the layout rules themselves live in map/td_canvas.py.

# Climate and mesh source: the frozen GCM climate branch.
branch: gcm-t42-712

# Discs that split continents too large for one canvas (edge anisotropy cap 1.15).
cuts:
  # World Island's north-south isthmus: the smallest disc that separates the two halves.
  - {lat: 37.0, lon: -70.0, radius_km: 120.0}
  # The broad neck north-east of 78°W 10°N; wider than the buffer, so its land is given back
  # to the nearest piece after the split.
  - {lat: 12.0, lon: -74.0, radius_km: 250.0, reattach: true}

# Fixed canvas ids: a land seed point (lat, lon) per id.  Other canvases are named by centre.
names:
  aurora: [18.0, 44.0]
  world-west: [-10.0, -110.0]
  world-southeast: [-10.0, -60.0]
  arctic: [80.0, 0.0]

# Forced joins: the island off World Island's south-east coast belongs with that canvas.
joins:
  - {point: [-11.6, -36.3], into: [-10.0, -60.0]}

max_anisotropy_overrides: {}

# Height conditioning: add the zero-mean tectonic structure field and condition the height
# channel strongly (SNR 0.05; smaller is stronger), so TD keeps the 70–250 km structure; scale
# TD's output detail by the Earth-fitted factor below.
structure: true
generation:
  cond_snr: [0.05, 0.2, 1.0, 0.2, 1.0]
  # TD output detail scale: 2.0 x the upstream residual_std (1.1678), fitted on Earth
  # (Copernicus GLO-90, five calibration and five validation sites).
  pipeline_kwargs:
    residual_std: 2.3356
